<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tópico — SMUFDPJ Fórum</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0908'/><text x='16' y='23' font-family='Arial Black,Arial,sans-serif' font-size='17' font-weight='900' fill='%23c1272d' text-anchor='middle'>PJ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap">
<script src="/purify.min.js"></script>
<style>
:root {
  --bg: #0a0908; --bg-card: #141210; --bg-card-hover: #1b1915;
  --ink: #f5f1e8; --ink-mute: #a8a092; --ink-dim: #6b6459;
  --divider: #2a2520; --divider-strong: #403930;
  --pj: #c1272d; --pj-soft: #7a1a1d; --ev: #e8a13a; --ev-soft: #8c5d1f;
  --heard: #5a8a52; --bg-card-sunk: #100e0c;
  --font-display: "Archivo Black", sans-serif;
  --font-editorial: "Instrument Serif", serif;
  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "JetBrains Mono", monospace;
}
html[data-theme="light"] {
  --bg: #f3ede0; --bg-card: #ebe4d3; --bg-card-hover: #e0d8c3;
  --ink: #1a1612; --ink-mute: #5a5245; --ink-dim: #8a7f6d;
  --divider: #d4cbb5; --divider-strong: #b3a78a;
  --pj: #9c1f22; --pj-soft: #6b1518; --ev: #a0671e; --ev-soft: #6e4716;
  --heard: #4a7342; --bg-card-sunk: #e6dec8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* Header */
.site-header { border-bottom: 1px solid var(--divider); background: var(--bg-card-sunk); position: sticky; top: 0; z-index: 100; }
.header-inner { max-width: 1400px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 20px; height: 56px; }
.site-logo { font-family: var(--font-display); font-size: 17px; color: var(--pj); text-transform: uppercase; letter-spacing: -0.01em; text-decoration: none; flex-shrink: 0; }
.header-back { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; padding: 6px 10px; border: 1px solid var(--divider); }
.header-back:hover { color: var(--ink); border-color: var(--ink-dim); }
.header-spacer { flex: 1; }
.theme-toggle { background: transparent; border: 1px solid var(--divider-strong); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
.theme-toggle:hover { border-color: var(--pj); color: var(--pj); }
.user-badge { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute); }
.user-badge .av { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--pj-soft); display: grid; place-items: center; font-family: var(--font-display); font-size: 10px; color: var(--pj); overflow: hidden; }
.user-badge .av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.logout-btn { background: none; border: none; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); cursor: pointer; padding: 4px; }
.logout-btn:hover { color: var(--pj); }
.auth-btn { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 14px; border: 1px solid var(--divider-strong); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.auth-btn.primary { background: var(--pj); border-color: var(--pj); color: #fff; }

/* Thread layout */
.thread-view { padding: 28px 32px 60px; display: grid; grid-template-columns: 1fr 280px; gap: 36px; max-width: 1400px; margin: 0 auto; }
.crumbs { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 18px; }
.crumbs a { color: var(--pj); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs .sep { opacity: 0.4; margin: 0 8px; }
.crumbs .here { color: var(--ink); }
.thread-head { border-bottom: 1px solid var(--divider); padding-bottom: 22px; margin-bottom: 22px; }
.thread-head h1 { font-family: var(--font-editorial); font-style: italic; font-size: clamp(26px, 3vw, 38px); color: var(--ink); line-height: 1.15; margin: 8px 0 14px; }
.thread-head .head-tags { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.thread-head .head-meta { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.08em; margin-top: 8px; }
.thread-head .head-meta b { color: var(--ink); font-weight: normal; text-transform: uppercase; }

/* Posts */
.post { display: grid; grid-template-columns: 56px 1fr; gap: 18px; padding: 20px 0; border-bottom: 1px solid var(--divider); }
.post.root { background: rgba(193,39,45,0.04); border-left: 3px solid var(--pj); padding: 22px 22px 22px 18px; margin-bottom: 6px; }
.post-avatar { width: 52px; height: 52px; background: var(--bg-card); border: 1px solid var(--divider-strong); border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 17px; color: var(--ink-mute); overflow: hidden; flex-shrink: 0; }
.post-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.post-byline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.post-author { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.post-author:hover { color: var(--pj); }
.post-badge { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--divider-strong); color: var(--ink-mute); line-height: 1.4; }
.post-badge.op { color: var(--pj); border-color: var(--pj-soft); }
.post-date { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); letter-spacing: 0.08em; margin-left: auto; }
.post-body { font-family: var(--font-body); font-size: 16.5px; color: var(--ink); line-height: 1.6; }
.post-body p { margin: 0 0 12px; }
.post-body p:last-child { margin-bottom: 0; }

/* Quote block */
.quote-block { border-left: 3px solid var(--ev); background: var(--bg-card); padding: 12px 16px; margin: 14px 0; font-family: var(--font-editorial); font-style: italic; font-size: 15px; color: var(--ink-mute); line-height: 1.5; }
.quote-who { display: block; font-family: var(--font-mono); font-style: normal; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ev); margin-bottom: 6px; }

/* Spoiler */
.spoiler { display: block; background: var(--bg-card); border: 1px dashed var(--ev-soft); padding: 10px 14px; margin: 12px 0; cursor: pointer; user-select: none; }
.spoiler-label { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ev); margin-bottom: 6px; }
.spoiler-content { color: transparent; text-shadow: 0 0 8px var(--ink-mute); transition: all 0.2s; pointer-events: none; font-family: var(--font-body); font-size: 15px; }
.spoiler.revealed .spoiler-content { color: var(--ink); text-shadow: none; }

/* Reactions */
.reactions { display: flex; gap: 6px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.react-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1px solid var(--divider-strong); background: transparent; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); line-height: 1; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
.react-chip:hover { border-color: var(--ink-mute); color: var(--ink); }
.react-chip .ico { font-size: 13px; }
.react-chip .rcount { font-family: var(--font-display); font-size: 13px; color: var(--ink-dim); }
.react-chip.active { background: rgba(193,39,45,0.08); border-color: var(--pj); color: var(--ink); }
.react-chip.active .rcount { color: var(--pj); }
.react-chip.active.heard { background: rgba(90,138,82,0.1); border-color: var(--heard); color: var(--heard); }
.react-chip.active.heard .rcount { color: var(--heard); }
.react-chip.active.gold { background: rgba(232,161,58,0.1); border-color: var(--ev); color: var(--ev); }
.react-chip.active.gold .rcount { color: var(--ev); }

/* Post tools */
.post-tools { display: flex; gap: 16px; margin-top: 10px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.post-tools button { background: none; border: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink-dim); padding: 0; cursor: pointer; }
.post-tools button:hover { color: var(--pj); }

/* Sidebar */
.thread-rail { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 72px; align-self: flex-start; }
.rail-card { border: 1px solid var(--divider); background: var(--bg-card); padding: 18px; }
.rail-card-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 12px; }
.rail-card-label.pj { color: var(--pj); }
.rail-stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px dotted var(--divider); font-family: var(--font-mono); font-size: 11px; }
.rail-stat-row:last-child { border-bottom: none; }
.rail-stat-row .k { color: var(--ink-dim); letter-spacing: 0.1em; text-transform: uppercase; font-size: 10px; }
.rail-stat-row .v { color: var(--ink); font-family: var(--font-display); font-size: 14px; }

/* Tags */
.tag { padding: 2px 7px; border: 1px solid var(--divider-strong); color: var(--ink-mute); line-height: 1.4; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; }
.tag.pj { color: var(--pj); border-color: var(--pj-soft); }
.tag.ev { color: var(--ev); border-color: var(--ev-soft); }

/* Buttons */
.btn { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 9px 16px; border: 1px solid var(--divider-strong); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; line-height: 1; text-decoration: none; }
.btn.primary { background: var(--pj); border-color: var(--pj); color: #fff; }
.btn.sm { padding: 6px 11px; font-size: 10px; }
.btn.ghost { border-color: transparent; color: var(--ink-mute); }

/* Reply composer */
.reply-section { margin-top: 28px; }
.reply-composer { border: 1px solid var(--divider-strong); background: var(--bg-card); }
.reply-composer-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--divider); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
.reply-composer-toolbar { display: flex; gap: 4px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--divider); background: var(--bg-card-sunk); }
.tool-btn { background: transparent; border: 1px solid transparent; color: var(--ink-mute); font-family: var(--font-mono); font-size: 12px; width: 30px; height: 30px; display: inline-grid; place-items: center; cursor: pointer; }
.tool-btn:hover { border-color: var(--divider-strong); color: var(--ink); }
.tool-btn.b { font-weight: 700; }
.tool-btn.i { font-style: italic; font-family: var(--font-editorial); font-size: 16px; }
.tool-btn.divider { width: 1px; height: 16px; background: var(--divider-strong); padding: 0; margin: 0 4px; cursor: default; border: none; pointer-events: none; }
.reply-textarea { width: 100%; padding: 14px; min-height: 110px; font-family: var(--font-body); font-size: 15.5px; color: var(--ink); line-height: 1.55; background: var(--bg-card); border: none; outline: none; resize: vertical; }
.reply-textarea::placeholder { color: var(--ink-dim); font-style: italic; font-family: var(--font-editorial); font-size: 16px; }
.reply-composer-foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid var(--divider); background: var(--bg-card-sunk); gap: 10px; flex-wrap: wrap; }
.reply-foot-id { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
.reply-foot-id .who { color: var(--ink-mute); }
.reply-char-count { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); }
.reply-char-count.warn { color: var(--ev); }
.reply-error { font-family: var(--font-mono); font-size: 11px; color: var(--pj); margin-top: 8px; display: none; }
.reply-error.visible { display: block; }
.reply-preview-pane { display: none; padding: 14px; min-height: 80px; border-top: 1px solid var(--divider); background: var(--bg-card-sunk); font-family: var(--font-body); font-size: 15.5px; color: var(--ink); line-height: 1.55; }

/* Login gate */
.login-gate { border: 1px dashed var(--divider-strong); padding: 22px; text-align: center; margin-top: 28px; }
.login-gate p { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 14px; }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; place-items: center; z-index: 200; padding: 20px; }
.modal-overlay.open { display: grid; }
.modal-box { background: var(--bg-card); border: 1px solid var(--divider-strong); width: 100%; max-width: 420px; padding: 24px; }
.modal-box h2 { font-family: var(--font-editorial); font-style: italic; font-size: 22px; color: var(--ink); margin: 0 0 16px; }
.modal-box textarea { width: 100%; background: var(--bg-card-sunk); border: 1px solid var(--divider-strong); padding: 10px 12px; font-family: var(--font-body); font-size: 15px; color: var(--ink); min-height: 80px; resize: vertical; outline: none; border-radius: 0; }
.modal-box textarea:focus { border-color: var(--pj); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

/* Loading/error */
.loading-state, .error-state { padding: 64px 32px; text-align: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); max-width: 1400px; margin: 0 auto; }

@media (max-width: 860px) {
  .thread-view { grid-template-columns: 1fr; padding: 20px 16px 40px; gap: 24px; }
  .thread-rail { position: static; }
  .header-inner { padding: 0 16px; }
}
@media (max-width: 600px) {
  .post { grid-template-columns: 40px 1fr; gap: 12px; }
  .post.root { padding: 16px 14px; }
  .post-avatar { width: 40px; height: 40px; font-size: 14px; }
  .post-body { font-size: 15.5px; }
  .post-date { font-size: 10px; }
  .reactions { gap: 4px; }
  .react-chip { padding: 4px 8px; font-size: 10px; }
}

/* ── Tool modals ─────────────────────────────────────────────── */
.tool-modal { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; }
.tool-modal-inner { background:var(--bg-card); border:1px solid var(--divider-strong); padding:20px; width:340px; display:flex; flex-direction:column; gap:10px; }
.tool-modal-label { font-family:var(--font-mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--pj); }
.tool-modal-inner input[type=text],
.tool-modal-inner input[type=date],
.tool-modal-inner input[type=url] { background:var(--bg-card-sunk); border:1px solid var(--divider); color:var(--ink); font-family:var(--font-mono); font-size:12px; padding:7px 10px; width:100%; outline:none; }
.tool-modal-inner input[type=text]:focus,
.tool-modal-inner input[type=date]:focus,
.tool-modal-inner input[type=url]:focus { border-color:var(--pj); }
.tool-modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
.tool-modal-error { font-family:var(--font-mono); font-size:10px; color:var(--pj); min-height:14px; }
.audio-tabs { display:flex; gap:4px; }
.tab-btn { background:transparent; border:1px solid var(--divider); color:var(--ink-dim); font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; padding:5px 10px; cursor:pointer; }
.tab-btn.active { border-color:var(--pj); color:var(--pj); }
#audioTimer { font-family:var(--font-mono); font-size:22px; color:var(--ink-mute); text-align:center; padding:8px 0; }
#audioTimer.recording { color:var(--pj); }

/* ── Embed setlist card ────────────────────────────────────────── */
.embed-setlist { display:flex; border-radius:4px; overflow:hidden; margin:10px 0; }
.embed-setlist .bar { width:4px; background:var(--pj); flex-shrink:0; }
.embed-setlist .body { background:var(--bg-card-sunk); padding:10px 14px; flex:1; }
.embed-setlist-eyebrow { font-family:var(--font-mono); font-size:9px; color:var(--ink-dim); letter-spacing:0.12em; text-transform:uppercase; }
.embed-setlist-banda { font-family:var(--font-display); font-size:13px; color:var(--pj); margin-top:2px; }
.embed-setlist-venue { font-family:var(--font-mono); font-size:10px; color:var(--ink-mute); margin-top:2px; }

/* ── Audio player ──────────────────────────────────────────────── */
.audio-attach { background:var(--bg-card-sunk); border:1px solid var(--divider); border-radius:4px; padding:10px 14px; margin:8px 0; }
.audio-attach audio { width:100%; max-width:320px; height:32px; display:block; }
.audio-attach-label { font-family:var(--font-mono); font-size:9px; color:var(--ink-dim); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:6px; }
</style>
</head>

<script>const API_BASE = "https://perpetual-energy-production-1a69.up.railway.app";</script>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="site-logo">SMUFDPJ</a>
    <a href="forum.html" class="header-back">← Fórum</a>

</header>

</div>

<!-- Setlist modal -->
<div class="tool-modal" id="setlistModal" style="display:none">

      <button class="btn sm" id="slCancel">Cancelar</button>

</div>

      <input type="url" id="audioUrlInput" placeholder="https://exemplo.com/audio.mp3">

    <div class="tool-modal-actions">
      <button class="btn sm" id="audioCancel">Cancelar</button>
      <button class="btn sm primary" id="audioInsert" disabled>Inserir</button>
    </div>
  </div>
</div>

<script>
"use strict";

let _reportTargetId = null;
let _token = localStorage.getItem("forum_token");
let _user = (() => { try { return JSON.parse(localStorage.getItem("forum_user")); } catch(e) { return null; } })();
let _topicId = null;
let _replyPhotos = [];

function san(str) {
  return DOMPurify.sanitize(str || "", { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
}
function timeAgo(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d) / 1000;
  if (diff < 60) return "agora";
  if (diff < 3600) return Math.floor(diff / 60) + "min";
  if (diff < 86400) return Math.floor(diff / 3600) + "h";
  if (diff < 604800) return Math.floor(diff / 86400) + "d";
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}
function initials(name) {
  return (name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
}
function avatarHtml(url, name) {
  return url ? `<img src="${san(url)}" alt="${san(name)}">` : initials(name);
}

function escapeHtml(str) {
  return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderBody(rawText) {
  const VALID_IMG   = /^data:image\/(jpeg|png|gif|webp);base64,/i;
  const VALID_AUDIO = /^data:audio\/(webm|ogg|mpeg|wav);base64,/i;
  const VALID_URL   = /^https:\/\//i;

  const imgSlots     = [];
  const audioSlots   = [];
  const setlistSlots = [];

  // 1. Extract special tags before any HTML processing
  let processed = rawText;

  processed = processed.replace(
    /\[img\]([^\][\n]{10,}?)\[\/img\]/gi,
    (_, src) => {
      if (imgSlots.length >= 4 || !VALID_IMG.test(src.trim())) return "";
      imgSlots.push(src.trim());
      return `__IMGSLOT${imgSlots.length - 1}__`;
    }
  );

  processed = processed.replace(
    /\[audio\]([^\][\n]{20,}?)\[\/audio\]/gi,
    (_, src) => {
      if (audioSlots.length >= 2 || !VALID_AUDIO.test(src.trim())) return "";
      audioSlots.push({ type: "data", src: src.trim() });
      return `__AUDIOSLOT${audioSlots.length - 1}__`;
    }
  );

  processed = processed.replace(
    /\[audio-url\]([^\]\n]{10,300}?)\[\/audio-url\]/gi,
    (_, url) => {
      if (audioSlots.length >= 2 || !VALID_URL.test(url.trim())) return "";
      audioSlots.push({ type: "url", src: url.trim() });
      return `__AUDIOSLOT${audioSlots.length - 1}__`;
    }
  );

  processed = processed.replace(
    /\[setlist\]([^\n]{5,200}?)\[\/setlist\]/gi,
    (_, content) => {
      setlistSlots.push(content.trim());
      return `__SETSLOT${setlistSlots.length - 1}__`;
    }
  );

  // 2. Standard text transformations
  const escaped = escapeHtml(processed);
  const withSpoilers = escaped.replace(
    /\[spoiler\]([\s\S]*?)\[\/spoiler\]/gi,
    (_, c) => `<span class="spoiler"><span class="spoiler-label">&#9888; spoiler — clique para revelar</span><span class="spoiler-content">${c.trim()}</span></span>`
  );
  const withQuotes = withSpoilers.replace(
    /^&gt;([^:\n]+):([^\n]*)/gm,
    (_, who, text) => `<div class="quote-block"><span class="quote-who">&#8627; ${who.trim()} escreveu</span>${text.trim()}</div>`
  ).replace(
    /^&gt;([^\n]*)/gm,
    (_, c) => `<div class="quote-block">${c.trim()}</div>`
  );
  const withBold   = withQuotes.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  const withItalic = withBold.replace(/_([^_\n]+)_/g, "<em>$1</em>");
  const withParas  = "<p>" + withItalic.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";

  const sanitized = DOMPurify.sanitize(withParas, {
    ALLOWED_TAGS: ["p", "br", "div", "span", "strong", "em"],
    ALLOWED_ATTR: ["class"],
  });

  const hasMedia = imgSlots.length || audioSlots.length || setlistSlots.length;
  if (!hasMedia) return sanitized;

  // 3. Post-process: inject rich elements via DOM (never via innerHTML) to prevent XSS
  const wrap = document.createElement("div");
  wrap.innerHTML = sanitized;

  function walkTextNodes(root, callback) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const hits = [];
    while (walker.nextNode()) {
      const node = walker.currentNode;
      const m = node.nodeValue.match(/__(?:IMGSLOT|AUDIOSLOT|SETSLOT)(\d+)__/);
      if (m) hits.push({ node, full: m[0] });
    }
    for (const h of hits) callback(h.node, h.full);
  }

  walkTextNodes(wrap, (node, marker) => {
    let el = null;

    if (marker.startsWith("__IMGSLOT")) {
      const idx = parseInt(marker.replace("__IMGSLOT", "").replace("__", ""));
      if (idx >= imgSlots.length) return;
      el = document.createElement("img");
      el.src = imgSlots[idx];
      el.alt = "foto";
      el.style.cssText = "max-width:100%;border-radius:6px;display:block;margin:8px 0";
    }

    if (marker.startsWith("__AUDIOSLOT")) {
      const idx = parseInt(marker.replace("__AUDIOSLOT", "").replace("__", ""));
      if (idx >= audioSlots.length) return;
      const slot = audioSlots[idx];
      const wrap2 = document.createElement("div");
      wrap2.className = "audio-attach";
      const label = document.createElement("div");
      label.className = "audio-attach-label";
      label.textContent = "audio";
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = slot.src;
      wrap2.appendChild(label);
      wrap2.appendChild(audio);
      el = wrap2;
    }

    if (marker.startsWith("__SETSLOT")) {
      const idx = parseInt(marker.replace("__SETSLOT", "").replace("__", ""));
      if (idx >= setlistSlots.length) return;
      const parts = setlistSlots[idx].split(/\s*\|\s*/);
      const banda = parts[0] || "";
      const data  = parts[1] || "";
      const venue = parts[2] || "";
      const card = document.createElement("div");
      card.className = "embed-setlist";
      const bar = document.createElement("div"); bar.className = "bar";
      const body = document.createElement("div"); body.className = "body";
      const eyebrow = document.createElement("div"); eyebrow.className = "embed-setlist-eyebrow";
      eyebrow.textContent = "Setlist do show";
      const bandaEl = document.createElement("div"); bandaEl.className = "embed-setlist-banda";
      bandaEl.textContent = banda;
      const venueEl = document.createElement("div"); venueEl.className = "embed-setlist-venue";
      venueEl.textContent = [data, venue].filter(Boolean).join(" · ");
      body.appendChild(eyebrow); body.appendChild(bandaEl); body.appendChild(venueEl);
      card.appendChild(bar); card.appendChild(body);
      el = card;
    }

    if (el) node.parentNode.replaceChild(el, node);
  });

  return wrap.innerHTML;
}

const _HTTP_MSGS = {
  400: "Dados inválidos. Verifique o que foi enviado.",
  401: "Sessão expirada. Entre novamente.",
  403: "Sem permissão para esta ação.",
  404: "Conteúdo não encontrado.",
  422: "Texto muito longo ou formato inválido.",
  429: "Muitas tentativas seguidas. Aguarde um momento.",
  500: "Erro no servidor. Tente novamente em breve.",
  503: "Serviço temporariamente indisponível.",
};
async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (_token) headers["Authorization"] = "Bearer " + _token;
  let res;
  try {
    res = await fetch(API_BASE + path, { ...opts, headers });
  } catch (_) {
    throw new Error("Sem conexão com o servidor. Verifique sua internet.");
  }
  if (res.status === 401) { logout(); return null; }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const serverMsg = typeof body.detail === "string" ? body.detail : null;
    throw new Error(serverMsg || _HTTP_MSGS[res.status] || "Erro " + res.status);
  }
  return res.json();
}

              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.onerror = reject;
          img.src = e.target.result;

async function toggleReaction(btn) {
  if (!_token) { location.href = API_BASE + "/auth/google/login"; return; }
  const type = btn.dataset.type;
  const targetId = btn.dataset.id;
  const targetType = btn.dataset.ttype;
  const clsMap = { heard: "heard", gold: "gold" };
  const suffix = { tava_la: "heard", salvar: "gold" }[type] || "";

  try {
    const data = await apiFetch("/forum/reactions", {
      method: "POST",
      body: JSON.stringify({ target_id: targetId, target_type: targetType, type }),
    });
    if (data === null) return;
    const { active, count } = data;
    btn.classList.toggle("active", active);
    if (suffix) btn.classList.toggle(suffix, active);
    let rcount = btn.querySelector(".rcount");
    if (count > 0) {
      if (!rcount) { rcount = document.createElement("span"); rcount.className = "rcount"; btn.appendChild(rcount); }
      rcount.textContent = count;
    } else if (rcount) {
      rcount.remove();
    }
  } catch (err) {
    console.error("Reaction error:", err);
  }
}

    const data  = document.getElementById("slData").value;
    const local = document.getElementById("slLocal").value.trim();
    if (!data || !local) { document.getElementById("slLocal").focus(); return; }
    const dateStr = new Date(data + "T12:00:00").toLocaleDateString("pt-BR", { day:"2-digit", month:"short", year:"numeric" });
    const tag = `[setlist]${banda} | ${dateStr} | ${local}[/setlist]`;
    const start = targetTextarea.selectionStart;
    const before = targetTextarea.value.substring(0, start);
    const after  = targetTextarea.value.substring(targetTextarea.selectionEnd);
    targetTextarea.value = (before ? before + "\n\n" : "") + tag + (after ? "\n\n" + after : "");
    targetTextarea.focus();
    close();
  }

  const slInsert = document.getElementById("slInsert");
  const slCancel = document.getElementById("slCancel");
  slInsert.addEventListener("click", insert);
  slCancel.addEventListener("click", close);
  modal.addEventListener("click", e => { if (e.target === modal) close(); });

  function cleanup() {
    slInsert.removeEventListener("click", insert);
    slCancel.removeEventListener("click", close);
  }
}

// ── Audio modal ───────────────────────────────────────────────
function openAudioModal(targetTextarea) {
  const modal     = document.getElementById("audioModal");
  const recBtn    = document.getElementById("audioRecBtn");
  const timer     = document.getElementById("audioTimer");
  const errEl     = document.getElementById("audioRecErr");
  const preview   = document.getElementById("audioPreview");
  const prevWrap  = document.getElementById("audioPreviewWrap");
  const urlInput  = document.getElementById("audioUrlInput");
  const insertBtn = document.getElementById("audioInsert");
  const cancelBtn = document.getElementById("audioCancel");

  // Reset state
  urlInput.value = "";
  errEl.textContent = "";
  timer.textContent = "0:00 / 0:15";
  timer.classList.remove("recording");
  prevWrap.style.display = "none";
  preview.src = "";
  insertBtn.disabled = true;
  recBtn.textContent = "Iniciar gravacao";

  let mediaRec = null, audioChunks = [], timerInterval = null, elapsed = 0;
  let pendingDataUrl = null;
  let activeTab = "rec";

  // Tabs
  document.querySelectorAll("[data-audiotab]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.audiotab === "rec");
    btn.onclick = () => {
      activeTab = btn.dataset.audiotab;
      document.querySelectorAll("[data-audiotab]").forEach(b => b.classList.toggle("active", b === btn));
      document.getElementById("audioTabRec").style.display = activeTab === "rec" ? "" : "none";
      document.getElementById("audioTabUrl").style.display = activeTab === "url" ? "" : "none";
      insertBtn.disabled = activeTab === "url" ? !urlInput.value.startsWith("https://") : !pendingDataUrl;
    };
  });
  document.getElementById("audioTabRec").style.display = "";
  document.getElementById("audioTabUrl").style.display = "none";

  urlInput.addEventListener("input", () => {
    if (activeTab === "url") insertBtn.disabled = !urlInput.value.trim().startsWith("https://");
  });

  function stopRecording() {
    if (mediaRec && mediaRec.state !== "inactive") mediaRec.stop();
    clearInterval(timerInterval);
    timer.classList.remove("recording");
    recBtn.textContent = "Gravar novamente";
  }

  recBtn.addEventListener("click", async () => {
    if (mediaRec && mediaRec.state === "recording") { stopRecording(); return; }
    try {
      errEl.textContent = "";
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = []; pendingDataUrl = null; elapsed = 0;
      prevWrap.style.display = "none"; preview.src = "";
      insertBtn.disabled = true;

      const mimeType = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/ogg"]
        .find(t => MediaRecorder.isTypeSupported(t)) || "";
      mediaRec = new MediaRecorder(stream, mimeType ? { mimeType, audioBitsPerSecond: 16000 } : { audioBitsPerSecond: 16000 });

      mediaRec.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(audioChunks, { type: mediaRec.mimeType || "audio/webm" });
        const reader = new FileReader();
        reader.onload = ev => {
          const dataUrl = ev.target.result;
          if (dataUrl.length > 44000) {
            errEl.textContent = "Gravacao muito longa. Tente novamente (max ~15s).";
            insertBtn.disabled = true;
            return;
          }
          pendingDataUrl = dataUrl;
          preview.src = dataUrl;
          prevWrap.style.display = "";
          if (activeTab === "rec") insertBtn.disabled = false;
        };
        reader.readAsDataURL(blob);
      };

      mediaRec.start(200);
      recBtn.textContent = "Parar";
      timer.classList.add("recording");

      timerInterval = setInterval(() => {
        elapsed++;
        const m = Math.floor(elapsed / 60), s = elapsed % 60;
        timer.textContent = `${m}:${String(s).padStart(2, "0")} / 0:15`;
        if (elapsed >= 15) stopRecording();
      }, 1000);
    } catch (err) {
      errEl.textContent = "Sem acesso ao microfone. Verifique as permissoes do navegador.";
    }
  });

  function close() {
    if (mediaRec && mediaRec.state !== "inactive") mediaRec.stop();
    clearInterval(timerInterval);
    modal.style.display = "none";
  }

  insertBtn.addEventListener("click", () => {
    let tag = "";
    if (activeTab === "rec" && pendingDataUrl) {
      tag = `[audio]${pendingDataUrl}[/audio]`;
    } else if (activeTab === "url") {
      const url = urlInput.value.trim();
      if (!url.startsWith("https://")) return;
      tag = `[audio-url]${url}[/audio-url]`;
    }
    if (!tag) return;
    const start = targetTextarea.selectionStart;
    const before = targetTextarea.value.substring(0, start);
    const after  = targetTextarea.value.substring(targetTextarea.selectionEnd);
    targetTextarea.value = (before ? before + "\n\n" : "") + tag + (after ? "\n\n" + after : "");
    targetTextarea.focus();
    close();
  });

  cancelBtn.addEventListener("click", close);
  modal.addEventListener("click", e => { if (e.target === modal) close(); });

  modal.style.display = "flex";
}

async function submitReply(topicId) {
  let body = document.getElementById("replyBody").value.trim();
  const errEl = document.getElementById("replyError");
  if (!body || body.length < 2) {
    errEl.textContent = "Mensagem muito curta."; errEl.classList.add("visible"); return;
  }
  if (_replyPhotos.length) body += "\n\n" + _replyPhotos.map(p => `[img]${p.dataUrl}[/img]`).join("\n");
  const btn = document.getElementById("replySubmit");
  btn.disabled = true; btn.textContent = "Publicando…";
  errEl.classList.remove("visible");
  try {
    const result = await apiFetch(`/forum/topics/${encodeURIComponent(topicId)}/posts`, {
      method: "POST",
      body: JSON.stringify({ body }),
    });
    if (result !== null) { _replyPhotos = []; location.reload(); }
  } catch (err) {
    errEl.textContent = err.message || "Erro ao publicar.";
    errEl.classList.add("visible");
  } finally {
    btn.disabled = false; btn.textContent = "Publicar resposta";
  }
}

function openReport(postId) {
  if (!_token) { alert("Entre com Google para reportar."); return; }
  _reportTargetId = postId;
  document.getElementById("reportReason").value = "";
  document.getElementById("reportModal").classList.add("open");
}
function closeReport() {
  document.getElementById("reportModal").classList.remove("open");
  _reportTargetId = null;
}
async function submitReport() {
  if (!_reportTargetId) return;
  const reason = document.getElementById("reportReason").value.trim();
  try {
    await apiFetch("/forum/reports", {
      method: "POST",
      body: JSON.stringify({ target_id: _reportTargetId, target_type: "post", reason: reason || null }),
    });
    closeReport();
    alert("Report enviado. Obrigado!");
  } catch { alert("Erro ao enviar report."); }
}

function initTheme() {
  const saved = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });
}

async function init() {
  initTheme();

  if (_token && !_user) {
    try {
      const data = await apiFetch("/auth/me");
      _user = data;
      localStorage.setItem("forum_user", JSON.stringify(data));
    } catch (_) {
      localStorage.removeItem("forum_token");
      _token = null;
    }
  }

  renderAuthArea();

  document.getElementById("reportCancel").addEventListener("click", closeReport);
  document.getElementById("reportSubmit").addEventListener("click", submitReport);
  document.getElementById("reportModal").addEventListener("click", e => {
    if (e.target === document.getElementById("reportModal")) closeReport();
  });

  const params = new URLSearchParams(location.search);
  _topicId = params.get("id");
  if (!_topicId) {
    document.getElementById("pageContent").innerHTML = `<div class="error-state">Tópico não encontrado. <a href="forum.html" style="color:var(--pj)">Voltar ao fórum</a></div>`;
    return;
  }

  try {
    const data = await apiFetch(`/forum/topics/${encodeURIComponent(_topicId)}`);
    if (data) renderTopic(data);
  } catch (err) {
    document.getElementById("pageContent").innerHTML = `<div class="error-state">Erro ao carregar tópico: ${san(err.message)}. <a href="forum.html" style="color:var(--pj)">Voltar ao fórum</a></div>`;
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>
