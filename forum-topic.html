<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tópico — SMUFDPJ Fórum</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0908'/><text x='16' y='23' font-family='Arial Black,Arial,sans-serif' font-size='17' font-weight='900' fill='%23c1272d' text-anchor='middle'>PJ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap">
<script src="/purify.min.js"></script>
<style>
:root {
  --bg: #0a0908; --bg-card: #141210; --bg-card-hover: #1b1915;
  --ink: #f5f1e8; --ink-mute: #a8a092; --ink-dim: #6b6459;
  --divider: #2a2520; --divider-strong: #403930;
  --pj: #c1272d; --pj-soft: #7a1a1d; --ev: #e8a13a; --ev-soft: #8c5d1f;
  --heard: #5a8a52; --bg-card-sunk: #100e0c;
  --font-display: "Archivo Black", sans-serif;
  --font-editorial: "Instrument Serif", serif;
  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "JetBrains Mono", monospace;
}
html[data-theme="light"] {
  --bg: #f3ede0; --bg-card: #ebe4d3; --bg-card-hover: #e0d8c3;
  --ink: #1a1612; --ink-mute: #5a5245; --ink-dim: #8a7f6d;
  --divider: #d4cbb5; --divider-strong: #b3a78a;
  --pj: #9c1f22; --pj-soft: #6b1518; --ev: #a0671e; --ev-soft: #6e4716;
  --heard: #4a7342; --bg-card-sunk: #e6dec8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* Header */
.site-header { border-bottom: 1px solid var(--divider); background: var(--bg-card-sunk); position: sticky; top: 0; z-index: 100; }
.header-inner { max-width: 1400px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 20px; height: 56px; }
.site-logo { font-family: var(--font-display); font-size: 17px; color: var(--pj); text-transform: uppercase; letter-spacing: -0.01em; text-decoration: none; flex-shrink: 0; }
.header-back { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; padding: 6px 10px; border: 1px solid var(--divider); }
.header-back:hover { color: var(--ink); border-color: var(--ink-dim); }
.header-spacer { flex: 1; }
.theme-toggle { background: transparent; border: 1px solid var(--divider-strong); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
.theme-toggle:hover { border-color: var(--pj); color: var(--pj); }
.user-badge { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute); }
.user-badge .av { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--pj-soft); display: grid; place-items: center; font-family: var(--font-display); font-size: 10px; color: var(--pj); overflow: hidden; }
.user-badge .av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.logout-btn { background: none; border: none; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); cursor: pointer; padding: 4px; }
.logout-btn:hover { color: var(--pj); }
.auth-btn { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 14px; border: 1px solid var(--divider-strong); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.auth-btn.primary { background: var(--pj); border-color: var(--pj); color: #fff; }

/* Thread layout */
.thread-view { padding: 28px 32px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 36px; max-width: 1280px; margin: 0 auto; }
.crumbs { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 18px; }
.crumbs a { color: var(--pj); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs .sep { opacity: 0.4; margin: 0 8px; }
.crumbs .here { color: var(--ink); }
.thread-head { border-bottom: 1px solid var(--divider); padding-bottom: 22px; margin-bottom: 22px; }
.thread-head h1 { font-family: var(--font-editorial); font-style: italic; font-size: clamp(26px, 3vw, 38px); color: var(--ink); line-height: 1.15; margin: 8px 0 14px; }
.thread-head .head-tags { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.thread-head .head-meta { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.08em; margin-top: 8px; }
.thread-head .head-meta b { color: var(--ink); font-weight: normal; text-transform: uppercase; }

/* Posts */
.post { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 18px; padding: 20px 0; border-bottom: 1px solid var(--divider); }
.post.root { background: rgba(193,39,45,0.04); border-left: 3px solid var(--pj); padding: 22px 22px 22px 18px; margin-bottom: 6px; }
.post-avatar { width: 52px; height: 52px; background: var(--bg-card); border: 1px solid var(--divider-strong); border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 17px; color: var(--ink-mute); overflow: hidden; flex-shrink: 0; }
.post-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.post-byline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.post-author { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.post-author:hover { color: var(--pj); }
.post-badge { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--divider-strong); color: var(--ink-mute); line-height: 1.4; }
.post-badge.op { color: var(--pj); border-color: var(--pj-soft); }
.post-date { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); letter-spacing: 0.08em; }
.post-date::before { content: "·"; margin-right: 8px; color: var(--divider-strong); }
.post-body { font-family: var(--font-body); font-size: 16.5px; color: var(--ink); line-height: 1.6; overflow-wrap: anywhere; word-break: break-word; min-width: 0; }
.post-body p { margin: 0 0 12px; }
.post-body p:last-child { margin-bottom: 0; }
.post-body .align-esq    { display: block; text-align: left;   margin: 6px 0; }
.post-body .align-centro { display: block; text-align: center; margin: 6px 0; }
.post-body .align-dir    { display: block; text-align: right;  margin: 6px 0; }
.post-body .img-align    { display: block; margin: 8px 0; }
.post-body .img-align img { max-width: 100%; border-radius: 6px; display: inline-block; }
.post-tags { display: inline-flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }

/* Quote block */
.quote-block { border-left: 3px solid var(--ev); background: var(--bg-card); padding: 12px 16px; margin: 14px 0; font-family: var(--font-editorial); font-style: italic; font-size: 15px; color: var(--ink-mute); line-height: 1.5; overflow-wrap: anywhere; word-break: break-word; }
.quote-who { display: block; font-family: var(--font-mono); font-style: normal; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ev); margin-bottom: 6px; }

/* Spoiler */
.spoiler { display: block; background: var(--bg-card); border: 1px dashed var(--ev-soft); padding: 10px 14px; margin: 12px 0; cursor: pointer; user-select: none; }
.spoiler-label { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ev); margin-bottom: 6px; }
.spoiler-content { color: transparent; text-shadow: 0 0 8px var(--ink-mute); transition: all 0.2s; pointer-events: none; font-family: var(--font-body); font-size: 15px; }
.spoiler.revealed .spoiler-content { color: var(--ink); text-shadow: none; }

/* Reactions */
.reactions { display: flex; gap: 6px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.react-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1px solid var(--divider-strong); background: transparent; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); line-height: 1; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
.react-chip:hover { border-color: var(--ink-mute); color: var(--ink); }
.react-chip .ico { font-size: 13px; }
.react-chip .rcount { font-family: var(--font-display); font-size: 13px; color: var(--ink-dim); }
.react-chip.active { background: rgba(193,39,45,0.08); border-color: var(--pj); color: var(--ink); }
.react-chip.active .rcount { color: var(--pj); }
.react-chip.active.heard { background: rgba(90,138,82,0.1); border-color: var(--heard); color: var(--heard); }
.react-chip.active.heard .rcount { color: var(--heard); }
.react-chip.active.gold { background: rgba(232,161,58,0.1); border-color: var(--ev); color: var(--ev); }
.react-chip.active.gold .rcount { color: var(--ev); }

/* Post tools */
.post-tools { display: flex; gap: 16px; margin-top: 10px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.post-tools button { background: none; border: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink-dim); padding: 0; cursor: pointer; }
.post-tools button:hover { color: var(--pj); }

/* Sidebar */
.thread-rail { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 72px; align-self: flex-start; }
.rail-card { border: 1px solid var(--divider); background: var(--bg-card); padding: 18px; }
.rail-card-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 12px; }
.rail-card-label.pj { color: var(--pj); }
.rail-stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px dotted var(--divider); font-family: var(--font-mono); font-size: 11px; }
.rail-stat-row:last-child { border-bottom: none; }
.rail-stat-row .k { color: var(--ink-dim); letter-spacing: 0.1em; text-transform: uppercase; font-size: 10px; }
.rail-stat-row .v { color: var(--ink); font-family: var(--font-display); font-size: 14px; }
.rail-show-card { border: 1px solid var(--divider-strong); background: var(--bg-card-sunk); padding: 12px 14px; position: relative; }
.rail-show-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--pj); }
.rail-show-eyebrow { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--pj); margin-bottom: 6px; }
.rail-show-date { font-family: var(--font-display); font-size: 16px; color: var(--ink); letter-spacing: -0.01em; }
.rail-show-venue { font-family: var(--font-editorial); font-style: italic; font-size: 14px; color: var(--ink-mute); margin-top: 3px; line-height: 1.3; }
.rail-users { display: flex; flex-direction: column; gap: 0; }
.rail-user { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dotted var(--divider); text-decoration: none; }
.rail-user:last-child { border-bottom: none; }
.rail-user:hover .who { color: var(--pj); }
.rail-user .av { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-card-sunk); border: 1px solid var(--divider-strong); display: grid; place-items: center; font-family: var(--font-display); font-size: 10px; color: var(--ink-mute); overflow: hidden; }
.rail-user .av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.rail-user .who { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink); letter-spacing: 0.08em; text-transform: uppercase; }
.rail-user .count { font-family: var(--font-display); font-size: 13px; color: var(--ink-mute); }

/* Tags */
.tag { padding: 2px 7px; border: 1px solid var(--divider-strong); color: var(--ink-mute); line-height: 1.4; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; }
.tag.pj { color: var(--pj); border-color: var(--pj-soft); }
.tag.ev { color: var(--ev); border-color: var(--ev-soft); }

/* Buttons */
.btn { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 9px 16px; border: 1px solid var(--divider-strong); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; line-height: 1; text-decoration: none; }
.btn.primary { background: var(--pj); border-color: var(--pj); color: #fff; }
.btn.sm { padding: 6px 11px; font-size: 10px; }
.btn.ghost { border-color: transparent; color: var(--ink-mute); }

/* Reply composer */
.reply-section { margin-top: 28px; }
.reply-composer { border: 1px solid var(--divider-strong); background: var(--bg-card); }
.reply-composer-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--divider); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
.reply-composer-toolbar { display: flex; gap: 4px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--divider); background: var(--bg-card-sunk); }
.tool-btn { background: transparent; border: 1px solid transparent; color: var(--ink-mute); font-family: var(--font-mono); font-size: 12px; width: 30px; height: 30px; display: inline-grid; place-items: center; cursor: pointer; }
.tool-btn:hover { border-color: var(--divider-strong); color: var(--ink); }
.tool-btn.b { font-weight: 700; }
.tool-btn.i { font-style: italic; font-family: var(--font-editorial); font-size: 16px; }
.tool-btn.divider { width: 1px; height: 16px; background: var(--divider-strong); padding: 0; margin: 0 4px; cursor: default; border: none; pointer-events: none; }
.reply-textarea { width: 100%; padding: 14px; min-height: 110px; font-family: var(--font-body); font-size: 15.5px; color: var(--ink); line-height: 1.55; background: var(--bg-card); border: none; outline: none; resize: vertical; }
.reply-textarea::placeholder { color: var(--ink-dim); font-style: italic; font-family: var(--font-editorial); font-size: 16px; }
.reply-composer-foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid var(--divider); background: var(--bg-card-sunk); gap: 10px; flex-wrap: wrap; }
.reply-foot-id { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
.reply-foot-id .who { color: var(--ink-mute); }
.reply-char-count { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); }
.reply-char-count.warn { color: var(--ev); }
.reply-error { font-family: var(--font-mono); font-size: 11px; color: var(--pj); margin-top: 8px; display: none; }
.reply-error.visible { display: block; }
.reply-extras { padding: 12px 14px; border-top: 1px solid var(--divider); background: var(--bg-card); display: flex; flex-direction: column; gap: 12px; }
.reply-extras-section { display: flex; flex-direction: column; gap: 6px; }
.reply-extras-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); }
.reply-attachments { display: flex; gap: 8px; flex-wrap: wrap; }
.reply-attach-btn { padding: 8px 12px; border: 1px dashed var(--divider-strong); background: transparent; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.reply-attach-btn:hover { border-color: var(--ink-mute); color: var(--ink); }
.reply-attach-btn .ico { color: var(--pj); font-family: var(--font-display); font-size: 12px; line-height: 1; }
.reply-attach-btn.added { border-style: solid; border-color: var(--heard); color: var(--heard); }
.reply-attach-btn.added .ico { color: var(--heard); }
.reply-tag-editor { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px 8px; border: 1px solid var(--divider-strong); background: var(--bg-card-sunk); min-height: 36px; }
.reply-tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: transparent; border: 1px solid var(--divider-strong); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-mute); }
.reply-tag-chip .rm { background: none; border: none; color: var(--ink-mute); cursor: pointer; font-size: 12px; padding: 0 0 0 2px; line-height: 1; }
.reply-tag-chip.pj { background: rgba(193,39,45,0.08); border-color: var(--pj-soft); color: var(--pj); }
.reply-tag-chip.pj .rm { color: var(--pj); }
.reply-tag-chip.ev { background: rgba(232,161,58,0.08); border-color: var(--ev-soft); color: var(--ev); }
.reply-tag-chip.ev .rm { color: var(--ev); }
.reply-tag-input { background: transparent; border: none; outline: none; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink); flex: 1; min-width: 120px; padding: 2px 0; }
.reply-tag-input::placeholder { color: var(--ink-dim); }
.reply-preview-pane { display: none; padding: 14px; min-height: 80px; border-top: 1px solid var(--divider); background: var(--bg-card-sunk); font-family: var(--font-body); font-size: 15.5px; color: var(--ink); line-height: 1.55; }

/* Login gate */
.login-gate { border: 1px dashed var(--divider-strong); padding: 22px; text-align: center; margin-top: 28px; }
.login-gate p { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 14px; }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; place-items: center; z-index: 200; padding: 20px; }
.modal-overlay.open { display: grid; }
.modal-box { background: var(--bg-card); border: 1px solid var(--divider-strong); width: 100%; max-width: 420px; padding: 24px; }
.modal-box h2 { font-family: var(--font-editorial); font-style: italic; font-size: 22px; color: var(--ink); margin: 0 0 16px; }
.modal-box textarea { width: 100%; background: var(--bg-card-sunk); border: 1px solid var(--divider-strong); padding: 10px 12px; font-family: var(--font-body); font-size: 15px; color: var(--ink); min-height: 80px; resize: vertical; outline: none; border-radius: 0; }
.modal-box textarea:focus { border-color: var(--pj); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

/* Loading/error */
.loading-state, .error-state { padding: 64px 32px; text-align: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); max-width: 1400px; margin: 0 auto; }

@media (max-width: 860px) {
  .thread-view { grid-template-columns: 1fr; padding: 20px 16px 40px; gap: 24px; }
  .thread-rail { position: static; }
  .header-inner { padding: 0 16px; }
}
@media (max-width: 600px) {
  .post { grid-template-columns: 40px 1fr; gap: 12px; }
  .post.root { padding: 16px 14px; }
  .post-avatar { width: 40px; height: 40px; font-size: 14px; }
  .post-body { font-size: 15.5px; }
  .post-date { font-size: 10px; }
  .reactions { gap: 4px; }
  .react-chip { padding: 4px 8px; font-size: 10px; }
}

/* ── Tool modals ─────────────────────────────────────────────── */
.tool-modal { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; }
.tool-modal-inner { background:var(--bg-card); border:1px solid var(--divider-strong); padding:20px; width:340px; display:flex; flex-direction:column; gap:10px; }
.tool-modal-label { font-family:var(--font-mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--pj); }
.tool-modal-inner input[type=text],
.tool-modal-inner input[type=date],
.tool-modal-inner input[type=url] { background:var(--bg-card-sunk); border:1px solid var(--divider); color:var(--ink); font-family:var(--font-mono); font-size:12px; padding:7px 10px; width:100%; outline:none; }
.tool-modal-inner input[type=text]:focus,
.tool-modal-inner input[type=date]:focus,
.tool-modal-inner input[type=url]:focus { border-color:var(--pj); }
.tool-modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
.tool-modal-error { font-family:var(--font-mono); font-size:10px; color:var(--pj); min-height:14px; }
.audio-tabs { display:flex; gap:0; border-bottom:1px solid var(--divider); }

<script>
"use strict";

let _reportTargetId = null;
let _token = localStorage.getItem("forum_token");
let _user = (() => { try { return JSON.parse(localStorage.getItem("forum_user")); } catch(e) { return null; } })();
let _topicId = null;
let _replyPhotos = [];
let _replyAudio = [];
let _replyMusic = [];
let _replyTags = [];

// Limites alinhados ao backend (body max 200000 chars). Foto grande trava o browser.
const MAX_UPLOAD_BYTES = 8 * 1024 * 1024;   // 8 MB por arquivo de entrada
const MAX_BODY_CHARS = 200000;              // teto do backend (PostCreate.body)

function san(str) {
  return DOMPurify.sanitize(str || "", { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
}
// Substitui tags pesadas por placeholders amigáveis antes de citar/fazer snippet.
function cleanForQuote(body) {
  let t = String(body || "");
  t = t.replace(/\[img(?::[a-z]+)?\][\s\S]*?\[\/img\]/gi, " [foto] ");
  t = t.replace(/\[audio\][\s\S]*?\[\/audio\]/gi, " [áudio] ");
  t = t.replace(/\[audio-url\][\s\S]*?\[\/audio-url\]/gi, " [áudio] ");
  t = t.replace(/\[setlist\][\s\S]*?\[\/setlist\]/gi, " [setlist] ");
  t = t.replace(/\[musica\]([^|\n]+?)(?:\s*\|[\s\S]*?)?\[\/musica\]/gi, " [música: $1] ");
  t = t.replace(/\[spoiler\][\s\S]*?\[\/spoiler\]/gi, " [spoiler] ");
  t = t.replace(/\[(esq|centro|dir)\]([\s\S]*?)\[\/\1\]/gi, "$2");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "$1");
  t = t.replace(/_([^_\n]+)_/g, "$1");
  t = t.replace(/~~([^~\n]+)~~/g, "$1");
  t = t.replace(/\n\n(?:#[\wÀ-ɏ_-]+(?:[ \t]+|(?=\n\n|$)))+(?=\n\n|$)/gu, "");
  t = t.replace(/\s+/g, " ").trim();
  return t;
}
// Só aceita URLs https; bloqueia javascript:, data:, etc. em src/href de terceiros.
function sanUrl(url) {
  const u = (url || "").trim();
  return /^https:\/\//i.test(u) ? san(u) : "";
}
function timeAgo(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d) / 1000;
  if (diff < 60) return "agora";
  if (diff < 3600) return Math.floor(diff / 60) + "min";
  if (diff < 86400) return Math.floor(diff / 3600) + "h";
  if (diff < 604800) return Math.floor(diff / 86400) + "d";
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}
function initials(name) {
  return (name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
}
function avatarHtml(url, name) {
  const safe = sanUrl(url);
  return safe ? `<img src="${safe}" alt="${san(name)}">` : san(initials(name));
}

function escapeHtml(str) {
  return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function tagColorClass(tag) {
  // Hash deterministico (mesmo do forum.html): mesma tag sempre cai na mesma cor.
  let h = 0;
  const s = (tag || "").toLowerCase();
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return ["pj", "", "ev"][h % 3];
}

function extractTopicTags(body) {
  // Composer adiciona '\n\n#tag1 #tag2' em qualquer posicao (antes ou depois das fotos).
  // Acha um bloco isolado de hashtags entre quebras de paragrafo ou fim de string.
  const re = /\n\n((?:#[\wÀ-ɏ_-]+(?:[ \t]+|(?=\n\n|$)))+)(?=\n\n|$)/u;
  const src = body || "";
  const m = src.match(re);
  if (!m) return { tags: [], cleanBody: src };
  const tags = m[1].trim().split(/\s+/).filter(t => t.startsWith("#")).map(t => t.slice(1));
  const cleanBody = src.slice(0, m.index) + src.slice(m.index + m[0].length);
  return { tags, cleanBody };
}

function renderBody(rawText) {
  // (;codecs=opus etc) pode aparecer entre o tipo e ;base64, no MediaRecorder
  const VALID_IMG   = /^data:image\/(jpeg|png|gif|webp)(;[\w=.-]+)*;base64,/i;
  const VALID_AUDIO = /^data:audio\/(webm|ogg|mpeg|wav)(;[\w=.-]+)*;base64,/i;
  const VALID_URL   = /^https:\/\//i;

  const imgSlots     = [];
  const audioSlots   = [];
  const setlistSlots = [];
  const musicSlots   = [];

  // 1. Extract special tags before any HTML processing
  let processed = rawText;

  // Placeholders usam char de controle  pra evitar conflito com markdown (_italic_, **bold**)
  processed = processed.replace(
    /\[img(?::(esq|centro|dir))?\]([^\][\n]{10,}?)\[\/img\]/gi,
    (_, align, src) => {
      if (imgSlots.length >= 5 || !VALID_IMG.test(src.trim())) return "";
      imgSlots.push({ src: src.trim(), align: align ? align.toLowerCase() : "" });
      return `IMG${imgSlots.length - 1}`;
    }
  );

  processed = processed.replace(
    /\[audio\]([^\][\n]{20,}?)\[\/audio\]/gi,
    (_, src) => {
      if (audioSlots.length >= 2 || !VALID_AUDIO.test(src.trim())) return "";
      audioSlots.push({ type: "data", src: src.trim() });
      return `AUDIO${audioSlots.length - 1}`;
    }
  );

  processed = processed.replace(
    /\[audio-url\]([^\]\n]{10,300}?)\[\/audio-url\]/gi,
    (_, url) => {
      if (audioSlots.length >= 2 || !VALID_URL.test(url.trim())) return "";
      audioSlots.push({ type: "url", src: url.trim() });
      return `AUDIO${audioSlots.length - 1}`;
    }
  );

  processed = processed.replace(
    /\[setlist\]([^\n]{5,4000}?)\[\/setlist\]/gi,
    (_, content) => {
      setlistSlots.push(content.trim());
      return `SET${setlistSlots.length - 1}`;
    }
  );

  processed = processed.replace(
    /\[musica\]([^\n]{1,300}?)\[\/musica\]/gi,
    (_, content) => {
      musicSlots.push(content.trim());
      return `MUS${musicSlots.length - 1}`;
    }
  );

  // 2. Standard text transformations
  const escaped = escapeHtml(processed);
  const withSpoilers = escaped.replace(
    /\[spoiler\]([\s\S]*?)\[\/spoiler\]/gi,
    (_, c) => `<span class="spoiler"><span class="spoiler-label">&#9888; spoiler — clique para revelar</span><span class="spoiler-content">${c.trim()}</span></span>`
  );
  const _stripHeavy = (s) => s
    .replace(/\[img(?::[a-z]+)?\][\s\S]*?\[\/img\]/gi, " [foto] ")
    .replace(/\[audio\][\s\S]*?\[\/audio\]/gi, " [áudio] ")
    .replace(/\[audio-url\][\s\S]*?\[\/audio-url\]/gi, " [áudio] ")
    .replace(/\[setlist\][\s\S]*?\[\/setlist\]/gi, " [setlist] ")
    .replace(/\[musica\]([^|\n]+?)(?:\s*\|[\s\S]*?)?\[\/musica\]/gi, " [música: $1] ")
    .replace(/\s+/g, " ")
    .trim();
  const withQuotes = withSpoilers.replace(
    /^&gt;([^:\n]+):([^\n]*)/gm,
    (_, who, text) => `<div class="quote-block"><span class="quote-who">&#8627; ${who.trim()} escreveu</span>${_stripHeavy(text)}</div>`
  ).replace(
    /^&gt;([^\n]*)/gm,
    (_, c) => `<div class="quote-block">${_stripHeavy(c)}</div>`
  );
  const withBold   = withQuotes.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  const withItalic = withBold.replace(/_([^_\n]+)_/g, "<em>$1</em>");
  const withAlign  = withItalic.replace(
    /\[(esq|centro|dir)\]([\s\S]*?)\[\/\1\]/gi,
    (_, dir, content) => `<span class="align-${dir.toLowerCase()}">${content.trim()}</span>`
  );
  const withParas  = "<p>" + withAlign.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";

  const sanitized = DOMPurify.sanitize(withParas, {
    ALLOWED_TAGS: ["p", "br", "div", "span", "strong", "em"],
    ALLOWED_ATTR: ["class"],
  });

  const hasMedia = imgSlots.length || audioSlots.length || setlistSlots.length || musicSlots.length;
  if (!hasMedia) return sanitized;

  // 3. Post-process: inject rich elements via DOM (never via innerHTML) to prevent XSS
  const wrap = document.createElement("div");
  wrap.innerHTML = sanitized;

  function walkTextNodes(root, callback) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const hits = [];
    while (walker.nextNode()) {
      const node = walker.currentNode;
      const m = node.nodeValue.match(/\x01(IMG|AUDIO|SET|MUS)(\d+)\x01/);
      if (m) hits.push({ node, full: m[0] });
    }
    for (const h of hits) callback(h.node, h.full);
  }

  walkTextNodes(wrap, (node, marker) => {
    let el = null;
    const kind = marker.replace(/[\x01\d]/g, "");
    const idx  = parseInt(marker.replace(/[\x01A-Z]/g, ""), 10);

    if (kind === "IMG") {
      if (idx >= imgSlots.length) return;
      const slot = imgSlots[idx];
      const img = document.createElement("img");
      img.src = slot.src;
      img.alt = "foto";
      img.style.cssText = "max-width:100%;border-radius:6px;display:inline-block";
      if (slot.align) {
        const wrap2 = document.createElement("div");
        wrap2.className = "img-align align-" + slot.align;
        wrap2.appendChild(img);
        el = wrap2;
      } else {
        img.style.cssText += ";margin:8px 0";
        el = img;
      }
    }

    if (kind === "AUDIO") {
      if (idx >= audioSlots.length) return;
      const slot = audioSlots[idx];
      const wrap2 = document.createElement("div");
      wrap2.className = "audio-attach";
      const label = document.createElement("div");
      label.className = "audio-attach-label";
      label.textContent = "audio";
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = slot.src;
      wrap2.appendChild(label);
      wrap2.appendChild(audio);
      el = wrap2;
    }

    if (kind === "SET") {
      if (idx >= setlistSlots.length) return;
      const parts = setlistSlots[idx].split(/\s*\|\s*/);
      const banda = parts[0] || "";
      const data  = parts[1] || "";
      const venue = parts[2] || "";
      const songs = (parts[3] || "").split(",").map(s => s.trim()).filter(Boolean);
      const card = document.createElement("div");
      card.className = "embed-setlist";
      const bar = document.createElement("div"); bar.className = "bar";
      const body = document.createElement("div"); body.className = "body";
      const eyebrow = document.createElement("div"); eyebrow.className = "embed-setlist-eyebrow";
      eyebrow.textContent = songs.length ? `Setlist do show · ${songs.length} músicas` : "Setlist do show";
      const bandaEl = document.createElement("div"); bandaEl.className = "embed-setlist-banda";
      bandaEl.textContent = banda;
      const venueEl = document.createElement("div"); venueEl.className = "embed-setlist-venue";
      venueEl.textContent = [data, venue].filter(Boolean).join(" · ");
      body.appendChild(eyebrow); body.appendChild(bandaEl); body.appendChild(venueEl);
      if (songs.length) {
        const list = document.createElement("ol");
        list.className = "embed-setlist-list";
        songs.forEach(s => {
          const li = document.createElement("li");
          li.textContent = s;
          list.appendChild(li);
        });
        body.appendChild(list);
      }
      card.appendChild(bar); card.appendChild(body);
      el = card;
    }

    if (kind === "MUS") {
      if (idx >= musicSlots.length) return;
      const parts = musicSlots[idx].split(/\s*\|\s*/);
      const titulo = parts[0] || "";
      const album  = parts[1] || "";
      const url    = parts[2] && /^https:\/\//i.test(parts[2]) ? parts[2] : "";
      const isAudio = /\.(mp3|ogg|m4a|wav|opus)(\?|$)/i.test(url);
      const isLink  = url && !isAudio;
      const card = document.createElement(isLink ? "a" : "div");
      card.className = "embed-music";
      if (isLink) { card.href = url; card.target = "_blank"; card.rel = "noopener nofollow"; }
      const bar = document.createElement("div"); bar.className = "bar";
      const body = document.createElement("div"); body.className = "body";
      const eyebrow = document.createElement("div"); eyebrow.className = "embed-music-eyebrow";
      eyebrow.textContent = isAudio ? "Música · com áudio" : (isLink ? "Música · com cifra/letra" : "Música");
      const tituloEl = document.createElement("div"); tituloEl.className = "embed-music-titulo";
      tituloEl.textContent = titulo;
      body.appendChild(eyebrow); body.appendChild(tituloEl);
      if (album) {
        const albumEl = document.createElement("div"); albumEl.className = "embed-music-album";
        albumEl.textContent = album;
        body.appendChild(albumEl);
      }
      if (isAudio) {
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "none";
        audio.src = url;
        audio.style.cssText = "width:100%;height:32px;margin-top:6px";
        body.appendChild(audio);
      }
      card.appendChild(bar); card.appendChild(body);
      el = card;
    }

    if (el) node.parentNode.replaceChild(el, node);
  });

  return wrap.innerHTML;
}

const _HTTP_MSGS = {
  400: "Dados inválidos. Verifique o que foi enviado.",
  401: "Sessão expirada. Entre novamente.",
  403: "Sem permissão para esta ação.",
  404: "Conteúdo não encontrado.",
  422: "Texto muito longo ou formato inválido.",
  429: "Muitas tentativas seguidas. Aguarde um momento.",
  500: "Erro no servidor. Tente novamente em breve.",
  503: "Serviço temporariamente indisponível.",
};
async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (_token) headers["Authorization"] = "Bearer " + _token;
  let res;
  try {
    res = await fetch(API_BASE + path, { ...opts, headers });
  } catch (_) {
    throw new Error("Sem conexão com o servidor. Verifique sua internet.");
  }
  if (res.status === 401) { logout(); return null; }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const serverMsg = typeof body.detail === "string" ? body.detail : null;
    throw new Error(serverMsg || _HTTP_MSGS[res.status] || "Erro " + res.status);
  }
  return res.json();
}

function logout() {
  localStorage.removeItem("forum_token");
  localStorage.removeItem("forum_user");
  _token = null; _user = null;
  renderAuthArea();
}

function renderAuthArea() {
  const area = document.getElementById("authArea");
  if (_token && _user) {
    area.innerHTML = `
      <div class="user-badge">
        <div class="av">${avatarHtml(_user.avatar_url, _user.display_name)}</div>
        <span>${san(_user.display_name)}</span>
        <button class="logout-btn" id="logoutBtn">Sair</button>
      </div>`;
    document.getElementById("logoutBtn").addEventListener("click", logout);
  } else {
    area.innerHTML = `<button class="auth-btn primary" id="loginBtn">Entrar com Google</button>`;
    document.getElementById("loginBtn").addEventListener("click", () => { location.href = API_BASE + "/auth/google/login"; });
  }
}

function renderChips(reactions, myReactions, postId, targetType) {
  return [
    { type: "tava_la", ico: "🤧", label: "Tava lá", cls: "heard" },
    { type: "mata",    ico: "👍", label: "Like",    cls: ""      },
    { type: "curtir",  ico: "♥",  label: "",        cls: ""      },
    { type: "salvar",  ico: "✦",  label: "Salvar",  cls: "gold"  },
  ].map(r => {
    const active = (myReactions || []).includes(r.type);
    const cnt = (reactions || {})[r.type] || 0;
    const cls = active ? `react-chip active${r.cls ? " " + r.cls : ""}` : "react-chip";
    return `<button class="${cls}" data-type="${r.type}" data-id="${san(postId)}" data-ttype="${targetType}">
      <span class="ico">${r.ico}</span>${r.label ? `<span>${san(r.label)}</span>` : ""}${cnt > 0 ? `<span class="rcount">${cnt}</span>` : ""}
    </button>`;
  }).join("");
}

function renderPost(p, isRoot, opUserId) {
  const targetType = isRoot ? "topic" : "post";
  const isOp = p.user_id === opUserId;
  const chips = renderChips(p.reactions, p.my_reactions, p.id, targetType);
  const profileHref = p.user_id ? `forum-profile.html?id=${encodeURIComponent(p.user_id)}` : null;
  const authorEl = profileHref
    ? `<a href="${profileHref}" class="post-author">${san(p.display_name)}</a>`
    : `<span class="post-author">${san(p.display_name)}</span>`;
  // Posts (não-root) podem ter hashtags no fim do body, igual ao tópico
  let postBody = p.body;
  let postTagsHtml = "";
  if (!isRoot) {
    const { tags, cleanBody } = extractTopicTags(p.body);
    postBody = cleanBody;
    if (tags.length) {
      postTagsHtml = `<div class="post-tags">${tags.map(tag => {
        const variant = tagColorClass(tag);
        return `<span class="tag${variant ? " " + variant : ""}">${san(tag)}</span>`;
      }).join("")}</div>`;
    }
  }
  const quoteBtn = _token
    ? `<button class="quote-btn" data-name="${san(p.display_name)}" data-body="${san(cleanForQuote(postBody).slice(0, 200))}">❝ Citar</button>`
    : "";
  return `
    <div class="post${isRoot ? " root" : ""}" data-post-id="${san(p.id)}">
      <div class="post-avatar">${avatarHtml(p.avatar_url, p.display_name)}</div>
      <div>
        <div class="post-byline">
          ${authorEl}
          ${isRoot || isOp ? '<span class="post-badge op">OP</span>' : ""}
          <span class="post-date">${timeAgo(p.created_at)}</span>
        </div>
        <div class="post-body">${renderBody(postBody)}</div>
        ${postTagsHtml}
        <div class="reactions">${chips}</div>
        <div class="post-tools">
          ${quoteBtn}
          <button class="report-btn" data-id="${san(p.id)}">⚑ Reportar</button>
          ${(_user && (_user.is_admin || _user.user_id === p.user_id))
            ? `<button class="delete-btn" data-id="${san(p.id)}" data-kind="${isRoot ? "topic" : "post"}" style="color:var(--pj)">🗑 Apagar</button>`
            : ""}
        </div>
      </div>
    </div>`;
}

function renderThreadRail(t, posts, allItems, totalTavaLa, totalMata) {
  // Participantes únicos (autor do tópico + autores dos posts)
  const byUser = new Map();
  const all = [{ user_id: t.user_id, display_name: t.display_name, avatar_url: t.avatar_url, isOp: true }, ...posts];
  for (const p of all) {
    if (!p.user_id) continue;
    const entry = byUser.get(p.user_id) || { count: 0, display_name: p.display_name, avatar_url: p.avatar_url, isOp: false };
    entry.count += 1;
    if (p.isOp) entry.isOp = true;
    byUser.set(p.user_id, entry);
  }
  const voices = [...byUser.entries()]
    .map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => b.count - a.count)
    .slice(0, 5);

  // Total de reações
  const totalCurtir = allItems.reduce((s, x) => s + ((x.reactions?.curtir) || 0), 0);
  const totalSalvar = allItems.reduce((s, x) => s + ((x.reactions?.salvar) || 0), 0);

  // Show ancorado: extrai primeira tag [setlist] do body do tópico
  const setlistMatch = (t.body || "").match(/\[setlist\]([^\n]{5,200}?)\[\/setlist\]/i);
  let showCardHtml = "";
  if (setlistMatch) {
    const parts = setlistMatch[1].split(/\s*\|\s*/);
    const banda = parts[0] || "";
    const data  = parts[1] || "";
    const venue = parts[2] || "";
    showCardHtml = `

        <div class="rail-show-card">
          <div class="rail-show-eyebrow">${san(banda.toUpperCase())}</div>
          <div class="rail-show-date">${san(data)}</div>
          <div class="rail-show-venue">${san(venue)}</div>
        </div>
      </div>`;

  const voicesHtml = voices.map(v => {
    const av = avatarHtml(v.avatar_url, v.display_name);
    const opTag = v.isOp ? ' <span style="color:var(--pj)">(OP)</span>' : '';
    const profileHref = `forum-profile.html?id=${encodeURIComponent(v.id)}`;
    return `<a class="rail-user" href="${profileHref}">
      <span class="av">${av}</span>
      <span class="who">${san(v.display_name)}</span>
      <span class="count">${v.count}${opTag}</span>
    </a>`;
  }).join("");

  return `
    <aside class="thread-rail">
      <div class="rail-card">
        <div class="rail-card-label pj">// SOBRE ESTA THREAD</div>
        <div class="rail-stat-row"><span class="k">Aberta</span><span class="v">${timeAgo(t.created_at)}</span></div>
        <div class="rail-stat-row"><span class="k">Última resposta</span><span class="v">${timeAgo(t.last_post_at || t.created_at)}</span></div>
        <div class="rail-stat-row"><span class="k">Respostas</span><span class="v">${posts.length}</span></div>
        <div class="rail-stat-row"><span class="k">Participantes</span><span class="v">${byUser.size}</span></div>
        <div class="rail-stat-row"><span class="k">Categoria</span><span class="v">${san(t.category)}</span></div>
        <div class="rail-stat-row"><span class="k">🤧 Tava lá</span><span class="v" style="color:var(--heard)">${totalTavaLa}</span></div>
        <div class="rail-stat-row"><span class="k">👍 Like</span><span class="v">${totalMata}</span></div>
        <div class="rail-stat-row"><span class="k">♥ Curtir</span><span class="v">${totalCurtir}</span></div>
        <div class="rail-stat-row"><span class="k">✦ Salvar</span><span class="v" style="color:var(--ev)">${totalSalvar}</span></div>
      </div>

      ${showCardHtml}

      <div class="rail-card">

        <div class="rail-users">
          ${voicesHtml || '<div class="mu-meta">ninguém respondeu ainda</div>'}

    const replyAttachActions = {

    function updateReplyAttachStatus() {
      const body = replyBody.value || "";
      const detected = {
        setlist: /\[setlist\]/i.test(body),
        music:   _replyMusic.length > 0,
        photo:   _replyPhotos.length > 0,
        audio:   _replyAudio.length > 0,
        spoiler: /\[spoiler\]/i.test(body),
      };
      const addedLabel = {
        setlist: "setlist incorporado",
        music:   `${_replyMusic.length} música${_replyMusic.length === 1 ? "" : "s"} anexada${_replyMusic.length === 1 ? "" : "s"}`,
        photo:   `${_replyPhotos.length} foto${_replyPhotos.length === 1 ? "" : "s"} anexada${_replyPhotos.length === 1 ? "" : "s"}`,
        audio:   `${_replyAudio.length} áudio${_replyAudio.length === 1 ? "" : "s"} anexado${_replyAudio.length === 1 ? "" : "s"}`,

        setlist: "incorporar setlist",

    function renderReplyTagChips() {
      const editor = document.getElementById("replyTagEditor");
      const input = document.getElementById("replyTagInput");
      if (!editor || !input) return;
      editor.querySelectorAll(".reply-tag-chip").forEach(el => el.remove());
      _replyTags.forEach((tag, i) => {
        const chip = document.createElement("span");
        const variant = tagColorClass(tag);
        chip.className = variant ? `reply-tag-chip ${variant}` : "reply-tag-chip";
        chip.innerHTML = `${san(tag)}<button class="rm" data-i="${i}" title="Remover">&#215;</button>`;
        editor.insertBefore(chip, input);
      });
      editor.querySelectorAll(".rm").forEach(btn => {
        btn.addEventListener("click", () => {
          _replyTags.splice(parseInt(btn.dataset.i), 1);
          renderReplyTagChips();
        });
      });
    }

    const replyTagInput = document.getElementById("replyTagInput");
    if (replyTagInput) {
      function commitReplyTag() {
        const val = replyTagInput.value.trim().replace(/^#/, "").replace(/[^a-zA-Z0-9À-ɏ_-]/g, "");
        if (val && _replyTags.length < 4 && !_replyTags.includes(val)) {
          _replyTags.push(val);
          renderReplyTagChips();
        }
        replyTagInput.value = "";
      }
      replyTagInput.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === "," || e.key === " " || e.key === "Tab") {
          if (replyTagInput.value.trim()) { e.preventDefault(); commitReplyTag(); }
        }
        if (e.key === "Backspace" && !replyTagInput.value && _replyTags.length) {
          _replyTags.pop();
          renderReplyTagChips();
        }
      });
      replyTagInput.addEventListener("blur", () => {
        if (replyTagInput.value.trim()) commitReplyTag();
      });
      bindTagSuggest(replyTagInput, () => _replyTags, () => { commitReplyTag(); replyTagInput.focus(); });
    }
    updateReplyAttachStatus();

    function compressReplyImg(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 400;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderReplyPhotoRow() {
      const row = document.getElementById("replyPhotoRow");
      if (!row) return;
      row.innerHTML = "";
      if (!_replyPhotos.length) { row.style.display = "none"; return; }
      row.style.display = "flex";
      _replyPhotos.forEach((p, i) => {
        if (!p.align) p.align = "centro";
        const wrap = document.createElement("div");
        wrap.style.cssText = "position:relative;display:inline-flex;flex-direction:column;align-items:stretch;gap:3px";
        const thumb = document.createElement("div");
        thumb.style.cssText = "position:relative;width:72px;height:72px";
        const imgEl = document.createElement("img");
        imgEl.src = p.dataUrl;
        imgEl.alt = p.name;
        imgEl.style.cssText = "width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--divider)";
        const rm = document.createElement("button");
        rm.innerHTML = "&#215;";
        rm.title = "Remover foto";
        rm.style.cssText = "position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink-mute);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;padding:0;display:grid;place-items:center";
        rm.addEventListener("click", () => { _replyPhotos.splice(i, 1); renderReplyPhotoRow(); updateReplyAttachStatus(); });
        thumb.appendChild(imgEl); thumb.appendChild(rm);
        const alignRow = document.createElement("div");
        alignRow.style.cssText = "display:flex;gap:0;width:72px";
        [["esq","⇤","Alinhar à esquerda"],["centro","≡","Centralizar"],["dir","⇥","Alinhar à direita"]].forEach(([a, ico, title]) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = ico;
          b.title = title;
          const active = p.align === a;
          b.style.cssText = `flex:1;height:18px;border:1px solid var(--divider-strong);background:${active ? "var(--pj)" : "var(--bg-card-sunk)"};color:${active ? "#fff" : "var(--ink-mute)"};font-size:11px;cursor:pointer;padding:0;line-height:1`;
          b.addEventListener("click", () => { p.align = a; renderReplyPhotoRow(); });
          alignRow.appendChild(b);
        });
        wrap.appendChild(thumb); wrap.appendChild(alignRow);
        row.appendChild(wrap);
      });
    }

    const replyPhotoInput = document.getElementById("replyPhotoInput");
    replyPhotoInput.addEventListener("change", async () => {
      const all = Array.from(replyPhotoInput.files).filter(f => f.type.startsWith("image/"));
      const tooBig = all.filter(f => f.size > MAX_UPLOAD_BYTES);
      const files = all.filter(f => f.size <= MAX_UPLOAD_BYTES);
      const errEl = document.getElementById("replyError");
      if (tooBig.length && errEl) {
        errEl.textContent = `Foto acima de 8 MB ignorada (${tooBig.length}). Reduza o tamanho antes de anexar.`;
        errEl.classList.add("visible");
      }
      for (const file of files) {
        if (_replyPhotos.length >= 5) break;
        try {
          const dataUrl = await compressReplyImg(file);
          _replyPhotos.push({ dataUrl, name: file.name });
        } catch (_) {}
      }
      replyPhotoInput.value = "";
      renderReplyPhotoRow();
      updateReplyAttachStatus();
    });

    // Preview toggle
    let _previewing = false;
    document.getElementById("replyPreviewBtn").addEventListener("click", () => {
      const pane = document.getElementById("replyPreviewPane");
      _previewing = !_previewing;
      if (_previewing) {
        pane.innerHTML = renderBody(replyBody.value || "");
        pane.style.display = "block";
        replyBody.style.display = "none";
        document.getElementById("replyPreviewBtn").textContent = "Editar";
        pane.querySelectorAll(".spoiler").forEach(sp => sp.addEventListener("click", () => sp.classList.toggle("revealed")));
      } else {
        pane.style.display = "none";
        replyBody.style.display = "";
        document.getElementById("replyPreviewBtn").textContent = "Prévia";
      }
    });

    // Quote buttons on each post
    document.querySelectorAll(".quote-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const quoteLine = `> ${btn.dataset.name}: ${btn.dataset.body}`;
        replyBody.value = (replyBody.value ? replyBody.value + "\n\n" : "") + quoteLine + "\n\n";
        replyBody.focus();
        replyBody.scrollIntoView({ behavior: "smooth", block: "end" });
      });
    });
  } else {
    const gateBtn = document.getElementById("loginGateBtn");
    if (gateBtn) gateBtn.addEventListener("click", () => { location.href = API_BASE + "/auth/google/login"; });
  }
}

async function toggleReaction(btn) {
  if (!_token) { location.href = API_BASE + "/auth/google/login"; return; }
  const type = btn.dataset.type;
  const targetId = btn.dataset.id;
  const targetType = btn.dataset.ttype;
  const clsMap = { heard: "heard", gold: "gold" };
  const suffix = { tava_la: "heard", salvar: "gold" }[type] || "";

  try {
    const data = await apiFetch("/forum/reactions", {
      method: "POST",
      body: JSON.stringify({ target_id: targetId, target_type: targetType, type }),
    });
    if (data === null) return;
    const { active, count } = data;
    btn.classList.toggle("active", active);
    if (suffix) btn.classList.toggle(suffix, active);
    let rcount = btn.querySelector(".rcount");
    if (count > 0) {
      if (!rcount) { rcount = document.createElement("span"); rcount.className = "rcount"; btn.appendChild(rcount); }
      rcount.textContent = count;
    } else if (rcount) {
      rcount.remove();
    }
  } catch (err) {
    console.error("Reaction error:", err);
  }
}

// ── Setlist modal ─────────────────────────────────────────────
let _showsCatalog = null;
let _showsLoading = null;
async function loadShowsCatalog() {
  if (_showsCatalog) return _showsCatalog;
  if (_showsLoading) return _showsLoading;
  _showsLoading = fetch("/media/shows.json")
    .then(r => r.ok ? r.json() : Promise.reject(new Error("shows.json " + r.status)))
    .then(j => { _showsCatalog = j; return j; })
    .catch(err => { _showsLoading = null; throw err; });
  return _showsLoading;
}

function _fmtShowDate(iso) {
  if (!iso) return "";
  return new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", { day:"2-digit", month:"short", year:"numeric" });
}

function openSetlistModal(targetTextarea) {
  const modal = document.getElementById("setlistModal");
  const tabCat = document.getElementById("slTabCat");
  const tabMan = document.getElementById("slTabMan");
  const searchEl = document.getElementById("slSearch");
  const listEl = document.getElementById("slList");
  const selectedEl = document.getElementById("slSelected");
  const bandaEl = document.getElementById("slBanda");
  const dataEl  = document.getElementById("slData");
  const localEl = document.getElementById("slLocal");
  const songsEl = document.getElementById("slSongs");

  bandaEl.value = "Pearl Jam";
  dataEl.value = "";
  localEl.value = "";
  songsEl.value = "";
  searchEl.value = "";
  selectedEl.style.display = "none";
  listEl.innerHTML = `<div class="mu-empty">Carregando shows…</div>`;
  modal.style.display = "flex";
  setTimeout(() => searchEl.focus(), 50);

  let _activeTab = "cat";
  let _selectedShow = null;

  function setTab(name) {
    _activeTab = name;
    tabCat.style.display = name === "cat" ? "" : "none";
    tabMan.style.display = name === "man" ? "" : "none";
    document.querySelectorAll("#setlistModal .audio-tabs .tab-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.sltab === name);
    });
  }
  modal.querySelectorAll(".audio-tabs .tab-btn").forEach(b => {
    b.addEventListener("click", () => setTab(b.dataset.sltab));
  });

  function renderList(filter) {
    if (!_showsCatalog) return;
    const q = _muNorm(filter).trim();
    const all = _showsCatalog.shows;
    const filtered = q
      ? all.filter(s => {
          const hay = _muNorm([s.artist, s.venue, s.city, s.date, s.tour].filter(Boolean).join(" "));
          return hay.includes(q);
        })
      : all;
    if (!filtered.length) {
      listEl.innerHTML = `<div class="mu-empty">Nada encontrado</div>`;
      return;
    }
    listEl.innerHTML = filtered.slice(0, 100).map((s, i) => {
      const hasAudio = s.has_audio;
      const dt = _fmtShowDate(s.date);
      const meta = [dt, s.songs.length + " músicas", s.tour].filter(Boolean).join(" · ");
      return `<div class="mu-list-item${hasAudio ? " has-audio" : ""}" data-i="${i}">
        <div><div class="mu-title">${san(s.venue)}, ${san(s.city)}</div><div class="mu-meta">${san(s.artist)} · ${san(meta)}</div></div>
      </div>`;
    }).join("");
    listEl.querySelectorAll(".mu-list-item").forEach(el => {
      el.addEventListener("click", () => {
        const idx = parseInt(el.dataset.i);
        listEl.querySelectorAll(".mu-list-item").forEach(x => x.classList.remove("selected"));
        el.classList.add("selected");
        _selectedShow = filtered[idx];
        renderSelected();
      });
    });
  }

  function renderSelected() {
    if (!_selectedShow) { selectedEl.style.display = "none"; return; }
    selectedEl.style.display = "";
    const s = _selectedShow;
    const dt = _fmtShowDate(s.date);
    const songsPreview = s.songs.slice(0, 8).join(" · ") + (s.songs.length > 8 ? ` … (+${s.songs.length - 8})` : "");
    selectedEl.innerHTML = `
      <div class="mu-sel-title">${san(s.venue)}, ${san(s.city)}</div>
      <div class="mu-sel-album">${san(s.artist)} · ${san(dt)}${s.tour ? " · " + san(s.tour) : ""}</div>
      <div class="mu-meta" style="line-height:1.5">${san(songsPreview)}</div>`;
  }

  function close() { modal.style.display = "none"; cleanup(); }

  function insert() {
    let banda, dateStr, local, songs;
    if (_activeTab === "cat" && _selectedShow) {
      banda  = _selectedShow.artist;
      dateStr = _fmtShowDate(_selectedShow.date);
      local  = [_selectedShow.venue, _selectedShow.city].filter(Boolean).join(", ");
      songs  = _selectedShow.songs.slice(0, 60);
    } else {
      banda = bandaEl.value.trim() || "Pearl Jam";
      const d = dataEl.value;
      local = localEl.value.trim();
      if (!d || !local) { localEl.focus(); return; }
      dateStr = _fmtShowDate(d);
      songs = songsEl.value
        .split(/\r?\n/)
        .map(l => l.trim().replace(/^\d+[\.\)\-]\s*/, ""))
        .filter(Boolean)
        .slice(0, 60);
    }
    const parts = [banda, dateStr, local];
    if (songs && songs.length) parts.push(songs.join(", "));
    const tag = `[setlist]${parts.join(" | ")}[/setlist]`;
    const start = targetTextarea.selectionStart;
    const before = targetTextarea.value.substring(0, start);
    const after  = targetTextarea.value.substring(targetTextarea.selectionEnd);
    targetTextarea.value = (before ? before + "\n\n" : "") + tag + (after ? "\n\n" + after : "");
    targetTextarea.dispatchEvent(new Event("input", { bubbles: true }));
    targetTextarea.focus();
    close();
  }

  const slInsert = document.getElementById("slInsert");
  const slCancel = document.getElementById("slCancel");
  slInsert.addEventListener("click", insert);
  slCancel.addEventListener("click", close);
  modal.addEventListener("click", e => { if (e.target === modal) close(); });
  searchEl.addEventListener("input", () => renderList(searchEl.value));

  setTab("cat");
  loadShowsCatalog()
    .then(() => renderList(""))
    .catch(err => {
      listEl.innerHTML = `<div class="mu-empty">erro ao carregar catálogo</div>`;
      console.error(err);
    });

  function cleanup() {
    slInsert.removeEventListener("click", insert);
    slCancel.removeEventListener("click", close);
  }
}

// ── Music modal ───────────────────────────────────────────────
let _songsCatalog = null;       // {r2_audio_base, songs: [...]}
let _songsLoading = null;       // promise

async function loadSongsCatalog() {
  if (_songsCatalog) return _songsCatalog;
  if (_songsLoading) return _songsLoading;
  _songsLoading = fetch("/media/songs.json")
    .then(r => r.ok ? r.json() : Promise.reject(new Error("songs.json " + r.status)))
    .then(j => { _songsCatalog = j; return j; })
    .catch(err => { _songsLoading = null; throw err; });
  return _songsLoading;
}

function _muNorm(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

function openMusicModal(onInsert) {
  const modal = document.getElementById("musicModal");
  const tabCat = document.getElementById("muTabCat");
  const tabMan = document.getElementById("muTabMan");
  const searchEl = document.getElementById("muSearch");
  const listEl = document.getElementById("muList");
  const selectedEl = document.getElementById("muSelected");
  const tituloEl = document.getElementById("muTitulo");
  const albumEl  = document.getElementById("muAlbum");
  const urlEl    = document.getElementById("muUrl");
  tituloEl.value = ""; albumEl.value = ""; urlEl.value = "";
  searchEl.value = "";
  selectedEl.style.display = "none";
  listEl.innerHTML = `<div class="mu-empty">Carregando catálogo…</div>`;
  modal.style.display = "flex";
  setTimeout(() => searchEl.focus(), 50);

  let _activeTab = "cat";
  let _selectedSong = null;   // referência ao objeto song escolhido
  let _selectedAudio = null;  // {show_id, file, date, venue} ou null

  function setTab(name) {
    _activeTab = name;
    tabCat.style.display = name === "cat" ? "" : "none";
    tabMan.style.display = name === "man" ? "" : "none";
    document.querySelectorAll("#musicModal .audio-tabs .tab-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.mutab === name);
    });
  }

  modal.querySelectorAll(".audio-tabs .tab-btn").forEach(b => {
    b.addEventListener("click", () => setTab(b.dataset.mutab));
  });

  function renderList(filter) {
    if (!_songsCatalog) return;
    const q = _muNorm(filter).trim();
    const all = _songsCatalog.songs;
    const filtered = q
      ? all.filter(s => _muNorm(s.title).includes(q) || _muNorm(s.album).includes(q))
      : all.slice(0, 80); // sem busca, mostra primeiros 80
    if (!filtered.length) {
      listEl.innerHTML = `<div class="mu-empty">Nada encontrado</div>`;
      return;
    }
    const items = filtered.slice(0, 200).map((s, i) => {
      const hasAudio = s.audio && s.audio.length;
      const meta = [s.album, s.year].filter(Boolean).join(" · ");
      return `<div class="mu-list-item${hasAudio ? " has-audio" : ""}" data-i="${i}">
        <div><div class="mu-title">${escapeHtml(s.title)}</div><div class="mu-meta">${escapeHtml(meta)}</div></div>
      </div>`;
    }).join("");
    listEl.innerHTML = items;
    listEl.querySelectorAll(".mu-list-item").forEach(el => {
      el.addEventListener("click", () => {
        const idx = parseInt(el.dataset.i);
        listEl.querySelectorAll(".mu-list-item").forEach(x => x.classList.remove("selected"));
        el.classList.add("selected");
        selectSong(filtered[idx]);
      });
    });
  }

  function selectSong(song) {
    _selectedSong = song;
    _selectedAudio = song.audio && song.audio.length ? song.audio[0] : null;
    tituloEl.value = song.title;
    albumEl.value  = song.album || "";
    urlEl.value    = "";
    renderSelected();
  }

  function audioUrl(a) {
    return `${_songsCatalog.r2_audio_base}/${a.show_id}/${encodeURIComponent(a.file)}`;
  }

  function renderSelected() {
    if (!_selectedSong) { selectedEl.style.display = "none"; return; }
    selectedEl.style.display = "";
    const s = _selectedSong;
    const meta = [s.album, s.year].filter(Boolean).join(" · ");
    const audios = s.audio || [];
    let html = `<div class="mu-sel-title">${escapeHtml(s.title)}</div>`;
    if (meta) html += `<div class="mu-sel-album">${escapeHtml(meta)}</div>`;
    if (audios.length) {
      const pickerHtml = audios.length > 1
        ? `<div class="mu-audio-picker">${audios.map((a, i) =>
            `<button data-ai="${i}" class="${a === _selectedAudio ? "active" : ""}">${escapeHtml(a.date)} · ${escapeHtml(a.venue)}</button>`
          ).join("")}</div>`
        : `<div class="mu-meta">do show ${escapeHtml(audios[0].date)} · ${escapeHtml(audios[0].venue)}</div>`;
      html += pickerHtml;
      html += `<audio controls preload="none" src="${audioUrl(_selectedAudio)}"></audio>`;
    } else {
      html += `<div class="mu-meta">sem áudio disponível, vai linkar só a referência</div>`;
    }
    selectedEl.innerHTML = html;
    selectedEl.querySelectorAll(".mu-audio-picker button").forEach(b => {
      b.addEventListener("click", () => {
        _selectedAudio = audios[parseInt(b.dataset.ai)];
        renderSelected();
      });
    });
  }

  function close() { modal.style.display = "none"; cleanup(); }

  function insert() {
    let titulo, album, url;
    if (_activeTab === "cat" && _selectedSong) {
      titulo = _selectedSong.title;
      album  = _selectedSong.album || "";
      url    = _selectedAudio ? audioUrl(_selectedAudio) : "";
    } else {
      titulo = tituloEl.value.trim();
      album  = albumEl.value.trim();
      url    = urlEl.value.trim();
      if (url && !/^https:\/\//i.test(url)) { urlEl.focus(); return; }
    }
    if (!titulo) {
      if (_activeTab === "cat") return; // sem seleção, ignora
      tituloEl.focus(); return;
    }
    if (typeof onInsert === "function") onInsert({ titulo, album, url });
    close();
  }

  const muInsert = document.getElementById("muInsert");
  const muCancel = document.getElementById("muCancel");
  muInsert.addEventListener("click", insert);
  muCancel.addEventListener("click", close);
  modal.addEventListener("click", e => { if (e.target === modal) close(); });
  searchEl.addEventListener("input", () => renderList(searchEl.value));

  setTab("cat");
  loadSongsCatalog()
    .then(() => renderList(""))
    .catch(err => {
      listEl.innerHTML = `<div class="mu-empty">erro ao carregar catálogo</div>`;
      console.error(err);
    });

  function cleanup() {
    muInsert.removeEventListener("click", insert);
    muCancel.removeEventListener("click", close);
  }
}

// ── Audio modal ───────────────────────────────────────────────
const MAX_AUDIO_DATAURL = 150000; // ~150KB base64, ~10s opus a 64kbps (deixa folga pro restante do body de 200000)

function openAudioModal(onInsert) {
  const modal     = document.getElementById("audioModal");
  const recBtn    = document.getElementById("audioRecBtn");
  const timer     = document.getElementById("audioTimer");
  const errEl     = document.getElementById("audioRecErr");
  const preview   = document.getElementById("audioPreview");
  const prevWrap  = document.getElementById("audioPreviewWrap");
  const urlInput  = document.getElementById("audioUrlInput");
  const insertBtn = document.getElementById("audioInsert");
  const cancelBtn = document.getElementById("audioCancel");

  // Reset state
  urlInput.value = "";
  errEl.textContent = "";
  timer.textContent = "0:00 / 0:10";
  timer.classList.remove("recording");
  prevWrap.style.display = "none";
  preview.src = "";
  insertBtn.disabled = true;
  recBtn.textContent = "Iniciar gravacao";
  recBtn.disabled = false;

  let mediaRec = null, audioChunks = [], timerInterval = null, elapsed = 0;
  let pendingDataUrl = null;
  let activeTab = "rec";

  // Pre-flight: APIs disponiveis?
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
    errEl.textContent = "Este navegador nao suporta gravacao de audio (precisa de HTTPS e mediaDevices).";
    recBtn.disabled = true;
  } else if (typeof window.MediaRecorder === "undefined") {
    errEl.textContent = "Este navegador nao suporta MediaRecorder.";
    recBtn.disabled = true;
  }

  // Tabs (.onclick substitui handler anterior, nao empilha)
  document.querySelectorAll("[data-audiotab]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.audiotab === "rec");
    btn.onclick = () => {
      activeTab = btn.dataset.audiotab;
      document.querySelectorAll("[data-audiotab]").forEach(b => b.classList.toggle("active", b === btn));
      document.getElementById("audioTabRec").style.display = activeTab === "rec" ? "" : "none";
      document.getElementById("audioTabUrl").style.display = activeTab === "url" ? "" : "none";
      insertBtn.disabled = activeTab === "url" ? !urlInput.value.startsWith("https://") : !pendingDataUrl;
    };
  });
  document.getElementById("audioTabRec").style.display = "";
  document.getElementById("audioTabUrl").style.display = "none";

  urlInput.oninput = () => {
    if (activeTab === "url") insertBtn.disabled = !urlInput.value.trim().startsWith("https://");
  };

  function stopRecording() {
    if (mediaRec && mediaRec.state !== "inactive") mediaRec.stop();
    clearInterval(timerInterval);
    timer.classList.remove("recording");
    recBtn.textContent = "Gravar novamente";
  }

  recBtn.onclick = async () => {
    if (mediaRec && mediaRec.state === "recording") { stopRecording(); return; }
    try {
      errEl.textContent = "";
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = []; pendingDataUrl = null; elapsed = 0;
      prevWrap.style.display = "none"; preview.src = "";
      insertBtn.disabled = true;

      const mimeType = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/ogg"]
        .find(t => MediaRecorder.isTypeSupported(t)) || "";
      const recOpts = { audioBitsPerSecond: 64000 };
      if (mimeType) recOpts.mimeType = mimeType;
      mediaRec = new MediaRecorder(stream, recOpts);

      mediaRec.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(audioChunks, { type: mediaRec.mimeType || "audio/webm" });
        const reader = new FileReader();
        reader.onload = ev => {
          const dataUrl = ev.target.result;
          if (dataUrl.length > MAX_AUDIO_DATAURL) {
            errEl.textContent = "Gravação muito longa. Tente novamente (max ~10s).";
            insertBtn.disabled = true;
            return;
          }
          pendingDataUrl = dataUrl;
          preview.src = dataUrl;
          prevWrap.style.display = "";
          if (activeTab === "rec") insertBtn.disabled = false;
        };
        reader.readAsDataURL(blob);
      };

      mediaRec.start(200);
      recBtn.textContent = "Parar";
      timer.classList.add("recording");

      timerInterval = setInterval(() => {
        elapsed++;
        const m = Math.floor(elapsed / 60), s = elapsed % 60;
        timer.textContent = `${m}:${String(s).padStart(2, "0")} / 0:10`;
        if (elapsed >= 10) stopRecording();
      }, 1000);
    } catch (err) {
      console.error("[audio] Falha ao gravar:", err);
      const name = err && err.name ? err.name : "Erro";
      const friendly = {
        NotAllowedError:    "Permissao de microfone negada. Libere nas configuracoes do navegador.",
        NotFoundError:      "Nenhum microfone detectado. Conecte um dispositivo de audio.",
        NotReadableError:   "O microfone esta sendo usado por outro app.",
        SecurityError:      "Gravacao bloqueada por politica de seguranca do site.",
        AbortError:         "Acesso ao microfone interrompido. Tente novamente.",
        OverconstrainedError:"Configuracao de audio nao suportada pelo dispositivo.",
      }[name] || `Falha (${name}): ${err && err.message ? err.message : "erro desconhecido"}`;
      errEl.textContent = friendly;
    }
  };

  function close() {
    if (mediaRec && mediaRec.state !== "inactive") mediaRec.stop();
    clearInterval(timerInterval);
    modal.style.display = "none";
  }

  insertBtn.onclick = () => {
    let audioObj = null;
    if (activeTab === "rec" && pendingDataUrl) {
      audioObj = { type: "data", src: pendingDataUrl };
    } else if (activeTab === "url") {
      const url = urlInput.value.trim();
      if (!url.startsWith("https://")) return;
      audioObj = { type: "url", src: url };
    }
    if (!audioObj) return;
    if (typeof onInsert === "function") onInsert(audioObj);
    close();
  };

  cancelBtn.onclick = close;
  modal.onclick = e => { if (e.target === modal) close(); };

  modal.style.display = "flex";
}

async function submitReply(topicId) {
  let body = document.getElementById("replyBody").value.trim();
  const errEl = document.getElementById("replyError");
  if (!body || body.length < 2) {
    errEl.textContent = "Mensagem muito curta."; errEl.classList.add("visible"); return;
  }
  if (_replyPhotos.length) body += "\n\n" + _replyPhotos.map(p => `[img:${p.align || "centro"}]${p.dataUrl}[/img]`).join("\n");
  if (_replyAudio.length) body += "\n\n" + _replyAudio.map(a => a.type === "url" ? `[audio-url]${a.src}[/audio-url]` : `[audio]${a.src}[/audio]`).join("\n");
  if (_replyMusic.length) body += "\n\n" + _replyMusic.map(m => {
    const parts = [m.titulo];
    if (m.album) parts.push(m.album);
    if (m.url)   parts.push(m.url);
    return `[musica]${parts.join(" | ")}[/musica]`;
  }).join("\n");
  if (typeof _replyTags !== "undefined" && _replyTags.length) body += "\n\n" + _replyTags.map(t => "#" + t).join(" ");
  if (body.length > MAX_BODY_CHARS) {
    errEl.textContent = `Resposta muito grande (${body.length.toLocaleString("pt-BR")} caracteres, máximo ${MAX_BODY_CHARS.toLocaleString("pt-BR")}). Reduza áudio gravado ou remova uma foto.`;
    errEl.classList.add("visible");
    return;
  }
  const btn = document.getElementById("replySubmit");
  btn.disabled = true; btn.textContent = "Publicando…";
  errEl.classList.remove("visible");
  try {
    const result = await apiFetch(`/forum/topics/${encodeURIComponent(topicId)}/posts`, {
      method: "POST",
      body: JSON.stringify({ body }),
    });
    if (result === null) {
      const loginUrl = API_BASE + "/auth/google/login";
      errEl.innerHTML = `Sua sessão expirou. <a href="${loginUrl}" style="color:var(--accent);text-decoration:underline;font-weight:600">Entre novamente com Google</a> para publicar a resposta.`;
      errEl.classList.add("visible");
      return;
    }
    _replyPhotos = [];
    _replyAudio = [];
    _replyMusic = [];
    _replyTags = [];
    location.reload();
  } catch (err) {
    errEl.textContent = err.message || "Erro ao publicar.";
    errEl.classList.add("visible");
  } finally {
    btn.disabled = false; btn.textContent = "Publicar resposta";
  }
}

function openReport(postId) {
  if (!_token) { alert("Entre com Google para reportar."); return; }
  _reportTargetId = postId;
  document.getElementById("reportReason").value = "";
  document.getElementById("reportModal").classList.add("open");
}
function closeReport() {
  document.getElementById("reportModal").classList.remove("open");
  _reportTargetId = null;
}
async function submitReport() {
  if (!_reportTargetId) return;
  const reason = document.getElementById("reportReason").value.trim();
  try {
    await apiFetch("/forum/reports", {
      method: "POST",
      body: JSON.stringify({ target_id: _reportTargetId, target_type: "post", reason: reason || null }),
    });
    closeReport();
    alert("Report enviado. Obrigado!");
  } catch { alert("Erro ao enviar report."); }
}

function initTheme() {
  const saved = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });
}

let _officialTags = [];
async function loadOfficialTags() {
  try {
    const r = await fetch("/media/forum-tags.json", { cache: "no-cache" });
    if (!r.ok) return;
    const j = await r.json();
    if (Array.isArray(j.tags)) _officialTags = j.tags;
  } catch (_) { /* sem sugestões, ok */ }
}

function bindTagSuggest(inputEl, getCurrent, onPick) {
  if (!inputEl || inputEl.dataset.bound === "1") return;
  inputEl.dataset.bound = "1";
  let dropdown = null;
  let activeIdx = -1;
  let lastMatches = [];

  function close() {
    if (dropdown) { dropdown.remove(); dropdown = null; }
    activeIdx = -1;
  }

  function place() {
    if (!dropdown) return;
    const r = inputEl.getBoundingClientRect();
    dropdown.style.left = (r.left + window.scrollX) + "px";
    dropdown.style.top  = (r.bottom + window.scrollY) + "px";
    dropdown.style.minWidth = Math.max(r.width, 220) + "px";
  }

  function show(matches) {
    lastMatches = matches;
    activeIdx = matches.length ? 0 : -1;
    if (!dropdown) {
      dropdown = document.createElement("div");
      dropdown.className = "tag-suggest";
      document.body.appendChild(dropdown);
    }
    if (!matches.length) {
      dropdown.innerHTML = `<div class="tag-suggest-empty">sem sugestão · enter pra criar</div>`;
    } else {
      dropdown.innerHTML = matches.map((t, i) =>
        `<div class="tag-suggest-item${i === activeIdx ? " active" : ""}" data-i="${i}"><span class="hash">#</span>${san(t)}</div>`
      ).join("");
      dropdown.querySelectorAll(".tag-suggest-item").forEach(el => {
        el.addEventListener("mousedown", (e) => { e.preventDefault(); pick(parseInt(el.dataset.i)); });
      });
    }
    place();
  }

  function pick(i) {
    if (i < 0 || i >= lastMatches.length) return;
    inputEl.value = lastMatches[i];
    onPick();
    close();
  }

  function refresh() {
    const q = inputEl.value.trim().replace(/^#/, "").toLowerCase();
    const taken = new Set((getCurrent() || []).map(x => x.toLowerCase()));
    const matches = _officialTags
      .filter(t => !taken.has(t.toLowerCase()) && (q === "" || t.toLowerCase().includes(q)))
      .slice(0, 8);
    show(matches);
  }

  inputEl.addEventListener("focus", refresh);
  inputEl.addEventListener("input", refresh);
  inputEl.addEventListener("blur", () => setTimeout(close, 120));
  inputEl.addEventListener("keydown", e => {
    if (!dropdown || !lastMatches.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); activeIdx = (activeIdx + 1) % lastMatches.length; show(lastMatches); }
    else if (e.key === "ArrowUp") { e.preventDefault(); activeIdx = (activeIdx - 1 + lastMatches.length) % lastMatches.length; show(lastMatches); }
    else if (e.key === "Enter" || e.key === "Tab") {
      if (activeIdx >= 0 && inputEl.value.trim() && lastMatches[activeIdx].toLowerCase().startsWith(inputEl.value.trim().toLowerCase().replace(/^#/, ""))) {
        e.preventDefault(); pick(activeIdx);
      }
    } else if (e.key === "Escape") { close(); }
  });
  window.addEventListener("scroll", place, true);
  window.addEventListener("resize", place);
}

async function init() {
  initTheme();
  loadOfficialTags();

  if (_token) {
    try {
      const data = await apiFetch("/auth/me");
      _user = data;
      localStorage.setItem("forum_user", JSON.stringify(data));
    } catch (_) {
      if (!_user) { localStorage.removeItem("forum_token"); _token = null; }
    }
  }

  renderAuthArea();

  document.getElementById("reportCancel").addEventListener("click", closeReport);
  document.getElementById("reportSubmit").addEventListener("click", submitReport);
  document.getElementById("reportModal").addEventListener("click", e => {
    if (e.target === document.getElementById("reportModal")) closeReport();
  });

  const params = new URLSearchParams(location.search);
  _topicId = params.get("id");
  if (!_topicId) {
    document.getElementById("pageContent").innerHTML = `<div class="error-state">Tópico não encontrado. <a href="forum.html" style="color:var(--pj)">Voltar ao fórum</a></div>`;
    return;
  }

  try {
    const data = await apiFetch(`/forum/topics/${encodeURIComponent(_topicId)}`);
    if (data) renderTopic(data);
  } catch (err) {
    document.getElementById("pageContent").innerHTML = `<div class="error-state">Erro ao carregar tópico: ${san(err.message)}. <a href="forum.html" style="color:var(--pj)">Voltar ao fórum</a></div>`;
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>
