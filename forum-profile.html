<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — SMUFDPJ Fórum</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0908'/><text x='16' y='23' font-family='Arial Black,Arial,sans-serif' font-size='17' font-weight='900' fill='%23c1272d' text-anchor='middle'>PJ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap">
<script src="/purify.min.js"></script>
<style>
:root {
  --bg: #0a0908; --bg-card: #141210; --bg-card-hover: #1b1915;
  --ink: #f5f1e8; --ink-mute: #a8a092; --ink-dim: #6b6459;
  --divider: #2a2520; --divider-strong: #403930;
  --pj: #c1272d; --pj-soft: #7a1a1d; --ev: #e8a13a; --ev-soft: #8c5d1f;
  --heard: #5a8a52; --bg-card-sunk: #100e0c;
  --font-display: "Archivo Black", sans-serif;
  --font-editorial: "Instrument Serif", serif;
  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "JetBrains Mono", monospace;
}
html[data-theme="light"] {
  --bg: #f3ede0; --bg-card: #ebe4d3; --bg-card-hover: #e0d8c3;
  --ink: #1a1612; --ink-mute: #5a5245; --ink-dim: #8a7f6d;
  --divider: #d4cbb5; --divider-strong: #b3a78a;
  --pj: #9c1f22; --pj-soft: #6b1518; --ev: #a0671e; --ev-soft: #6e4716;
  --heard: #4a7342; --bg-card-sunk: #e6dec8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* Header */
.site-header { border-bottom: 1px solid var(--divider); background: var(--bg-card-sunk); position: sticky; top: 0; z-index: 100; }
.header-inner { max-width: 1400px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 20px; height: 56px; }
.site-logo { font-family: var(--font-display); font-size: 17px; color: var(--pj); text-transform: uppercase; letter-spacing: -0.01em; text-decoration: none; flex-shrink: 0; }
.header-back { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; padding: 6px 10px; border: 1px solid var(--divider); }
.header-back:hover { color: var(--ink); border-color: var(--ink-dim); }
.header-spacer { flex: 1; }
.theme-toggle { background: transparent; border: 1px solid var(--divider-strong); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
.theme-toggle:hover { border-color: var(--pj); color: var(--pj); }
.user-badge { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute); }
.user-badge .av { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--pj-soft); display: grid; place-items: center; font-family: var(--font-display); font-size: 10px; color: var(--pj); overflow: hidden; }
.user-badge .av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.logout-btn { background: none; border: none; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); cursor: pointer; padding: 4px; }
.logout-btn:hover { color: var(--pj); }
.auth-btn { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 14px; border: 1px solid var(--divider-strong); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.auth-btn.primary { background: var(--pj); border-color: var(--pj); color: #fff; }

/* Profile head */
.profile-head {
  padding: 32px 32px 28px;
  border-bottom: 1px solid var(--divider);
  display: grid;
  grid-template-columns: 130px 1fr auto;
  gap: 28px;
  align-items: center;
  max-width: 1400px;
  margin: 0 auto;
}
.profile-avatar-sq {
  width: 120px; height: 120px;
  background: var(--bg-card);
  border: 1px solid var(--pj);
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-size: 40px;
  color: var(--pj);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.profile-avatar-sq::after {
  content: "";
  position: absolute; inset: -7px;
  border: 1px dashed var(--divider-strong);
  pointer-events: none;
}
.profile-avatar-sq img { width: 100%; height: 100%; object-fit: cover; }
.profile-handle {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 6px;
}
.profile-name {
  font-family: var(--font-display);
  font-size: clamp(26px, 4vw, 44px);
  letter-spacing: -0.02em;
  text-transform: uppercase;
  color: var(--ink);
  line-height: 0.95;
  margin: 0 0 10px;
}
.profile-locale {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
  display: flex; gap: 6px; flex-wrap: wrap;
}
.profile-locale .sep { opacity: 0.4; }
.profile-actions { display: flex; flex-direction: column; gap: 10px; }
/* Andre: bio editorial italica embaixo do nome (vinda do design bundle) */
.profile-bio {
  font-family: var(--font-editorial);
  font-style: italic;
  font-size: 17px;
  color: var(--ink-mute);
  margin: 4px 0 10px;
  max-width: 600px;
  line-height: 1.4;
}
.btn { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 9px 16px; border: 1px solid var(--divider-strong); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; line-height: 1; text-decoration: none; }
.btn.primary { background: var(--pj); border-color: var(--pj); color: #fff; }
.btn.sm { padding: 6px 11px; font-size: 10px; }

/* Stats strip */
.profile-stats-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-bottom: 1px solid var(--divider);
  max-width: 1400px;
  margin: 0 auto;
}
.profile-stat {
  padding: 22px 24px;
  border-right: 1px solid var(--divider);
}
.profile-stat:last-child { border-right: none; }
.profile-stat .v {
  font-family: var(--font-display);
  font-size: 36px;
  letter-spacing: -0.01em;
  line-height: 1;
  color: var(--ink);
}
.profile-stat .v.pj { color: var(--pj); }
.profile-stat .v.ev { color: var(--ev); }
.profile-stat .v.heard { color: var(--heard); }
.profile-stat .l {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-top: 8px;
}

/* Two-column body */
.profile-body {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 36px;
  padding: 32px 32px 80px;
  max-width: 1400px;
  margin: 0 auto;
}

/* Section */
.section-block { margin-bottom: 36px; }
.section-title { font-family: var(--font-editorial); font-style: italic; font-size: 24px; color: var(--ink); margin: 0 0 4px; }
.section-sub { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin: 0 0 18px; }

/* Badges */
.badge-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.badge { border: 1px solid var(--divider-strong); background: var(--bg-card); padding: 14px; text-align: center; }
.badge .b-icon { width: 52px; height: 52px; margin: 0 auto 10px; border: 1px solid var(--pj); display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: var(--pj); border-radius: 50%; background: var(--bg-card-sunk); }
.badge.gold .b-icon { border-color: var(--ev); color: var(--ev); }
.badge.heard .b-icon { border-color: var(--heard); color: var(--heard); }
.badge.locked { opacity: 0.42; }
.badge.locked .b-icon { border-color: var(--ink-dim); color: var(--ink-dim); }
.badge .b-name { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }
.badge .b-desc { font-family: var(--font-editorial); font-style: italic; font-size: 12.5px; color: var(--ink-mute); line-height: 1.3; }

/* Activity */
.activity-row { display: grid; grid-template-columns: 80px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px dotted var(--divider); }
.activity-row:last-child { border-bottom: none; }
.activity-date { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); border-right: 1px solid var(--divider); padding-right: 14px; line-height: 1.5; }
.activity-body { font-family: var(--font-body); font-size: 14px; color: var(--ink-mute); line-height: 1.5; }
.activity-body .a-verb { color: var(--ink-dim); }
.activity-body .a-target { font-family: var(--font-editorial); font-style: italic; color: var(--ink); }
.activity-body .a-snippet {
  font-family: var(--font-editorial);
  font-style: italic;
  font-size: 14px;
  color: var(--ink-mute);
  margin-top: 4px;
  border-left: 2px solid var(--divider);
  padding-left: 10px;
}
/* Andre: mini-grid de shows confirmados (design bundle) */
.shows-attended {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.show-chip {
  border: 1px solid var(--divider-strong);
  background: var(--bg-card-sunk);
  padding: 10px 12px;
  position: relative;
}
.show-chip::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--pj);
}
.show-chip.ev::before { background: var(--ev); }
.show-chip .sc-eyebrow {
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--pj);
  margin-bottom: 4px;
}
.show-chip.ev .sc-eyebrow { color: var(--ev); }
.show-chip .sc-date {
  font-family: var(--font-display);
  font-size: 17px;
  color: var(--ink);
  line-height: 1;
}
.show-chip .sc-venue {
  font-family: var(--font-editorial);
  font-style: italic;
  font-size: 12.5px;
  color: var(--ink-mute);
  margin-top: 3px;
  line-height: 1.2;
}
.a-verb { color: var(--ink-dim); }
.a-target { font-family: var(--font-editorial); font-style: italic; color: var(--ink); }

/* Rail */
.thread-rail { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 72px; align-self: flex-start; }
.rail-card { border: 1px solid var(--divider); background: var(--bg-card); padding: 18px; }
.rail-card-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 12px; }
.rail-card-label.pj { color: var(--pj); }
.rail-stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px dotted var(--divider); font-family: var(--font-mono); font-size: 11px; }
.rail-stat-row:last-child { border-bottom: none; }
.rail-stat-row .k { color: var(--ink-dim); letter-spacing: 0.1em; text-transform: uppercase; font-size: 10px; }
.rail-stat-row .v { color: var(--ink); font-family: var(--font-display); font-size: 14px; }

/* Topics list */
.topic-row { padding: 14px 0; border-bottom: 1px solid var(--divider); }
.topic-row:last-child { border-bottom: none; }
.topic-row-title { font-family: var(--font-editorial); font-style: italic; font-size: 17px; color: var(--ink); text-decoration: none; line-height: 1.2; display: block; }
.topic-row-title:hover { color: var(--pj); }
.topic-row-meta { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); margin-top: 4px; }
.topic-tag { padding: 1px 6px; border: 1px solid var(--divider-strong); color: var(--ink-mute); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; }

/* Loading/error */
.loading-state, .error-state { padding: 80px 32px; text-align: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); }

@media (max-width: 900px) {
  .profile-head { grid-template-columns: 90px 1fr; gap: 20px; }
  .profile-head .profile-actions { display: none; }
  .profile-avatar-sq { width: 88px; height: 88px; font-size: 28px; }
  .profile-stats-strip { grid-template-columns: repeat(3, 1fr); }
  .profile-stats-strip .profile-stat:nth-child(3) { border-right: none; }
  .profile-stats-strip .profile-stat:nth-child(4) { border-top: 1px solid var(--divider); }
  .profile-stats-strip .profile-stat:nth-child(5) { border-top: 1px solid var(--divider); border-right: none; }
  .profile-body { grid-template-columns: 1fr; gap: 0; padding: 24px 16px 60px; }
  .thread-rail { position: static; }
  .header-inner { padding: 0 16px; }
  .profile-head { padding: 20px 16px; }
  .profile-stats-strip .profile-stat { padding: 16px; }
}
@media (max-width: 600px) {
  .profile-stats-strip { grid-template-columns: 1fr 1fr; }
  .profile-stats-strip .profile-stat:nth-child(3) { border-right: 1px solid var(--divider); border-top: 1px solid var(--divider); }
  .profile-stats-strip .profile-stat:nth-child(4) { border-top: 1px solid var(--divider); }
  .profile-stats-strip .profile-stat:nth-child(5) { grid-column: span 2; border-top: 1px solid var(--divider); border-right: none; }
  .badge-strip { grid-template-columns: repeat(2, 1fr); }
  .profile-stat .v { font-size: 28px; }
}
</style>

<body>

<script>const API_BASE = "https://perpetual-energy-production-1a69.up.railway.app";</script>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="site-logo">SMUFDPJ</a>
    <a href="forum.html" class="header-back">← Fórum</a>
    <div class="header-spacer"></div>
    <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">◑</button>
    <div id="authArea"></div>
  </div>
</header>

<div id="pageContent">
  <div class="loading-state">Carregando perfil…</div>
</div>

<script>
"use strict";

let _token = localStorage.getItem("forum_token");
let _user = (() => { try { return JSON.parse(localStorage.getItem("forum_user")); } catch(e) { return null; } })();
let _currentProfileData = null;
let _showsCatalogCache = null;
async function loadShowsCatalog() {
  if (_showsCatalogCache) return _showsCatalogCache;
  try { const r = await fetch("/media/shows.json"); if (r.ok) _showsCatalogCache = await r.json(); } catch (_) {}
  return _showsCatalogCache || { shows: [] };
}

function san(str) {
  return DOMPurify.sanitize(str || "", { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
}
function timeAgo(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d) / 1000;
  if (diff < 60) return "agora";
  if (diff < 3600) return Math.floor(diff / 60) + "min";
  if (diff < 86400) return Math.floor(diff / 3600) + "h";
  if (diff < 604800) return Math.floor(diff / 86400) + "d";
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}
function joinDate(iso) {
  return new Date(iso).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
}
function initials(name) {
  return (name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
}

async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (_token) headers["Authorization"] = "Bearer " + _token;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  if (res.status === 401) { logout(); return null; }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || "Erro " + res.status);
  return res.json();
}

function logout() {
  localStorage.removeItem("forum_token");
  localStorage.removeItem("forum_user");
  _token = null; _user = null;
  renderAuthArea();
}

function renderAuthArea() {
  const area = document.getElementById("authArea");
  if (_token && _user) {
    const av = _user.avatar_url ? `<img src="${san(_user.avatar_url)}" alt="">` : initials(_user.display_name);
    const uid = _user.user_id || _user.id || "";
    const profileHref = uid ? `forum-profile.html?id=${encodeURIComponent(uid)}` : "#";
    area.innerHTML = `<div class="user-badge"><a href="${profileHref}" class="av" title="Meu perfil" style="text-decoration:none">${av}</a><a href="${profileHref}" style="color:inherit;text-decoration:none" title="Meu perfil">${san(_user.display_name)}</a><button class="logout-btn" id="logoutBtn">Sair</button></div>`;
    document.getElementById("logoutBtn").addEventListener("click", logout);
  } else {
    area.innerHTML = `<button class="auth-btn primary" id="loginBtn">Entrar com Google</button>`;
    document.getElementById("loginBtn").addEventListener("click", () => { location.href = API_BASE + "/auth/google/login"; });
  }
}

function computeBadges(data, cat) {
  // Conta de shows confirmados (vem direto do shows_attended salvo no DB)
  const showsAttended = data.shows_attended || [];
  const showsCount = showsAttended.length;

  // Decade: precisa do catalogo pra mapear show.id -> ano.
  // Agrupa shows confirmados por ano; badge desbloca se algum ano >= 10.
  let maxShowsInYear = 0;
  if (cat && Array.isArray(cat.shows) && showsCount) {
    const byYear = {};
    const attendedSet = new Set(showsAttended);
    for (const s of cat.shows) {
      if (!attendedSet.has(s.id)) continue;
      const year = (s.date || "").slice(0, 4); // 'YYYY-MM-DD' -> 'YYYY'
      if (!year) continue;
      byYear[year] = (byYear[year] || 0) + 1;
      if (byYear[year] > maxShowsInYear) maxShowsInYear = byYear[year];
    }
  }

  const badges = [
    {
      icon: "★",
      name: "Membro",
      desc: "Faz parte da comunidade",
      cls: "",
      unlocked: true,
    },
    {
      icon: "VT",
      name: "Veterano",
      desc: "100+ posts no fórum",
      cls: "gold",
      unlocked: data.post_count >= 100,
    },
    {
      icon: "TH",
      name: "Criador",
      desc: "Abriu 10+ threads",
      cls: "",
      unlocked: data.topic_count >= 10,
    },
    {
      icon: "🤘",
      name: "Popular",
      desc: "50+ reações recebidas",
      cls: "",
      unlocked: data.reactions_received >= 50,
    },
    {
      icon: "🤧",
      name: "Tava lá",
      desc: "Confirma presença em shows",
      cls: "heard",
      unlocked: showsCount >= 1,
    },
    {
      icon: "8mm",
      name: "Arquivista",
      desc: "Compartilhou bootlegs",
      cls: "heard",
      unlocked: false,
    },
    {
      icon: "⛓",
      name: "Fonte",
      desc: "Citado 20+ vezes",
      cls: "",
      unlocked: false,
    },
    {
      icon: "?",
      name: "Decade",
      desc: "Esteve em 10 shows do mesmo ano",
      cls: "locked",
      unlocked: maxShowsInYear >= 10,
    },
  ];
  return badges;
}

function renderProfile(data, cat) {
  const avHtml = data.avatar_url
    ? `<img src="${san(data.avatar_url)}" alt="${san(data.display_name)}">`
    : initials(data.display_name);

  const badges = computeBadges(data, cat);
  // Mapeia shows_attended (ids) -> objetos do catalogo pra render visual.
  // Ordena por data desc (mais recente primeiro). Items sem match no
  // catalogo (id legado/removido) sao silenciosamente ignorados.
  const showsCatalog = (cat && Array.isArray(cat.shows)) ? cat.shows : [];
  const attendedIds = new Set(data.shows_attended || []);
  const attendedShows = showsCatalog
    .filter(s => attendedIds.has(s.id))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const badgesHtml = badges.map(b => `
    <div class="badge${!b.unlocked ? " locked" : ""}${b.cls && b.cls !== "locked" ? " " + b.cls : ""}">
      <div class="b-icon">${b.icon}</div>
      <div class="b-name">${b.name}</div>
      <div class="b-desc">${b.desc}</div>
    </div>`).join("");

  // Atividade combinada: mistura recent_topics (abertas) e poderia
  // incluir replies/badges no futuro. Por ora so threads do user.
  const activityHtml = data.recent_topics.length
    ? data.recent_topics.map(t => {
        const d = new Date(t.created_at);
        const dia = String(d.getDate()).padStart(2, "0");
        const mes = d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "");
        const hora = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
        return `<div class="activity-row">
          <div class="activity-date">${dia} ${mes}<br>${hora}</div>
          <div class="activity-body">
            <span class="a-verb">abriu thread</span>
            <a href="forum-topic.html?id=${encodeURIComponent(t.id)}" class="a-target"> ${san(t.title)}</a>
            ${t.reply_count > 0 ? `<div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);letter-spacing:0.1em;text-transform:uppercase;margin-top:3px">${t.reply_count} ${t.reply_count === 1 ? "resposta" : "respostas"}</div>` : ""}
          </div>
        </div>`;
      }).join("")
    : `<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-dim);padding:20px 0">Sem atividade recente</div>`;

  // Show chips no formato DD MES YY (estilo design bundle).
  const _ptMonths = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  const _fmtShowDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    const dia = String(d.getDate()).padStart(2, "0");
    const mes = _ptMonths[d.getMonth()];
    const ano = String(d.getFullYear()).slice(-2);
    return `${dia} ${mes} ${ano}`;
  };
  const showsHtml = attendedShows.map(s => {
    const isEV = (s.artist || "").toLowerCase().includes("eddie");
    return `<div class="show-chip${isEV ? " ev" : ""}">
      <div class="sc-eyebrow">${san(s.artist)}</div>
      <div class="sc-date">${_fmtShowDate(s.date)}</div>
      <div class="sc-venue">${san(s.venue)}</div>
    </div>`;
  }).join("");

  // Posts/mes e threads/mes: divide count total por meses ativos (clamp
  // em 1 pra evitar divisao por zero quando user eh recem-criado).
  const monthsActive = Math.max(1, Math.round(
    (Date.now() - new Date(data.created_at).getTime()) / (1000 * 60 * 60 * 24 * 30)
  ));
  const postsPerMonth = (data.post_count / monthsActive).toFixed(1).replace(/\.0$/, "");
  const threadsPerMonth = (data.topic_count / monthsActive).toFixed(1).replace(/\.0$/, "");

  const isOwnProfile = _user && ((_user.user_id || _user.id) === data.id);
  _currentProfileData = data;

  document.getElementById("pageContent").innerHTML = `
    <div class="profile-head">
      <div class="profile-avatar-sq">${avHtml}</div>
      <div class="profile-id">
        <div class="profile-handle">Membro desde ${joinDate(data.created_at)}</div>
        <h1 class="profile-name">${san(data.display_name)}</h1>
        ${data.bio ? `<p class="profile-bio">${san(data.bio)}</p>` : ""}
        <div class="profile-locale">
          ${data.city ? `<span>${san(data.city)}</span><span class="sep">/</span>` : ""}
          <span>${(data.shows_attended || []).length} show${(data.shows_attended || []).length !== 1 ? "s" : ""} assistido${(data.shows_attended || []).length !== 1 ? "s" : ""}</span>
          ${data.rank_pos ? `<span class="sep">/</span><span>#${data.rank_pos} no ranking</span>` : ""}
        </div>
      </div>
      <div class="profile-actions">
        ${isOwnProfile
          ? `<button class="btn primary" id="editProfileBtn">✎ Editar perfil</button>`
          : `<a href="forum.html" class="btn">← Ver fórum</a>`}
      </div>
    </div>

    <div class="profile-stats-strip">
      <div class="profile-stat"><div class="v pj">${data.post_count}</div><div class="l">Posts no fórum</div></div>
      <div class="profile-stat"><div class="v">${data.topic_count}</div><div class="l">Threads abertas</div></div>
      <div class="profile-stat"><div class="v heard">${(data.shows_attended || []).length}</div><div class="l">"Tava lá" — shows</div></div>
      <div class="profile-stat"><div class="v ev">—</div><div class="l">Bootlegs partilhados</div></div>
      <div class="profile-stat"><div class="v">${data.reactions_received}</div><div class="l">🤘 recebidos</div></div>
    </div>

    <div class="profile-body">
      <div>
        <div class="section-block">
          <h2 class="section-title">Badges</h2>
          <div class="section-sub">// COLECIONADAS · ${badges.filter(b => b.unlocked).length} de ${badges.length}</div>
          <div class="badge-strip">${badgesHtml}</div>
        </div>

        <div class="section-block">
          <h2 class="section-title">Atividade recente</h2>
          <div class="section-sub">// ÚLTIMOS 30 DIAS</div>
          ${activityHtml}
        </div>

        <div class="section-block">
          <h2 class="section-title">Shows que esteve</h2>
          <div class="section-sub">// ${attendedShows.length} PRESENCIADO${attendedShows.length !== 1 ? "S" : ""} · CRUZADO COM O ARQUIVO</div>
          ${attendedShows.length
            ? `<div class="shows-attended">${showsHtml}</div>`
            : `<div style="font-family:var(--font-editorial);font-style:italic;color:var(--ink-mute);padding:18px 0">Ainda não marcou nenhum show. ${isOwnProfile ? 'Clica em ✎ Editar perfil pra confirmar presença nos shows que esteve.' : ''}</div>`}
        </div>
      </div>

      <aside class="thread-rail">
        ${data.rank_pos ? `<div class="rail-card">
          <div class="rail-card-label pj">// NA HIERARQUIA</div>
          <div style="text-align:center;padding:8px 0 14px">
            <div style="font-family:var(--font-display);font-size:44px;color:var(--pj);letter-spacing:-0.02em;line-height:1">#${data.rank_pos}</div>
            <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px">no ranking de posts</div>
          </div>
          <div class="rail-stat-row"><span class="k">Posts/mês</span><span class="v">${postsPerMonth}</span></div>
          <div class="rail-stat-row"><span class="k">Threads/mês</span><span class="v">${threadsPerMonth}</span></div>
          <div class="rail-stat-row"><span class="k">🤧 Tava lá</span><span class="v" style="color:var(--heard)">${data.tava_la_count || 0}</span></div>
          <div class="rail-stat-row"><span class="k">👍 Recebidos</span><span class="v" style="color:var(--ev)">${data.reactions_received}</span></div>
        </div>` : ""}
        <div class="rail-card">
          <div class="rail-card-label">// MEMBRO</div>
          <div class="rail-stat-row"><span class="k">Desde</span><span class="v" style="font-family:var(--font-mono);font-size:11px">${joinDate(data.created_at)}</span></div>
          ${data.email ? `<div class="rail-stat-row"><span class="k">Email</span><span class="v" style="font-family:var(--font-mono);font-size:10px;color:var(--ink-mute)">${san(data.email)}</span></div>` : ""}
          ${data.birth_year ? `<div class="rail-stat-row"><span class="k">Nascimento</span><span class="v" style="font-family:var(--font-mono);font-size:11px">${data.birth_year}</span></div>` : ""}
        </div>
        <a href="forum.html" class="btn" style="justify-content:center">← Voltar ao fórum</a>
      </aside>
    </div>`;

  document.title = san(data.display_name) + " — SMUFDPJ Fórum";

  document.querySelectorAll(".a-target[href]").forEach(el => {
    el.style.cssText = "font-family:var(--font-editorial);font-style:italic;color:var(--ink);text-decoration:none";
    el.addEventListener("mouseover", () => { el.style.color = "var(--pj)"; });
    el.addEventListener("mouseout", () => { el.style.color = "var(--ink)"; });
  });
  const editBtn = document.getElementById("editProfileBtn");
  if (editBtn) editBtn.addEventListener("click", openEditProfile);
}

async function openEditProfile() {
  const data = _currentProfileData || {};
  const cat = await loadShowsCatalog();
  const allShows = cat.shows || [];
  const attended = new Set(data.shows_attended || []);

  const modal = document.createElement("div");
  modal.id = "editProfileModal";
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:grid;place-items:center;padding:20px;overflow:auto";
  modal.innerHTML = `
    <div style="background:var(--bg-card);border:1px solid var(--divider-strong);width:100%;max-width:560px;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto">
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--pj)">// Editar perfil</div>
      <div>
        <label style="display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px">Nome</label>
        <input id="ep_name" maxlength="80" value="${(data.display_name||'').replace(/"/g,'&quot;')}" style="width:100%;background:var(--bg-card-sunk);border:1px solid var(--divider);padding:10px;font-family:var(--font-body);font-size:15px;color:var(--ink);outline:none">
      </div>
      <div style="display:grid;grid-template-columns:1fr 110px;gap:10px">
        <div>
          <label style="display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px">Cidade</label>
          <input id="ep_city" maxlength="80" placeholder="São Paulo · BR" value="${(data.city||'').replace(/"/g,'&quot;')}" style="width:100%;background:var(--bg-card-sunk);border:1px solid var(--divider);padding:10px;font-family:var(--font-body);font-size:14px;color:var(--ink);outline:none">
        </div>
        <div>
          <label style="display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px">Nascimento</label>
          <input id="ep_year" type="number" min="1900" max="2100" placeholder="1985" value="${data.birth_year||''}" style="width:100%;background:var(--bg-card-sunk);border:1px solid var(--divider);padding:10px;font-family:var(--font-mono);font-size:13px;color:var(--ink);outline:none">
        </div>
      </div>
      <div>
        <label style="display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px">Email (privado)</label>
        <input id="ep_email" type="email" maxlength="200" placeholder="seu@email.com" value="${(data.email||'').replace(/"/g,'&quot;')}" style="width:100%;background:var(--bg-card-sunk);border:1px solid var(--divider);padding:10px;font-family:var(--font-mono);font-size:13px;color:var(--ink);outline:none">
      </div>
      <div>
        <label style="display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px">Bio (até 500)</label>
        <textarea id="ep_bio" maxlength="500" placeholder="Conta um pouco quem você é..." style="width:100%;min-height:80px;background:var(--bg-card-sunk);border:1px solid var(--divider);padding:10px;font-family:var(--font-body);font-size:14px;color:var(--ink);outline:none;resize:vertical">${san(data.bio||'')}</textarea>
      </div>
      <div>
        <label style="display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px">Shows que você esteve · <b id="ep_shows_count" style="color:var(--pj)">${attended.size}</b></label>
        <div id="ep_shows" style="max-height:200px;overflow-y:auto;border:1px solid var(--divider);background:var(--bg-card-sunk);padding:6px">
          ${allShows.map(s => `
            <label style="display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:pointer;border-bottom:1px dotted var(--divider);font-family:var(--font-mono);font-size:11px">
              <input type="checkbox" value="${s.id}" ${attended.has(s.id) ? "checked" : ""}>
              <span style="flex:1">${(s.artist+' · '+_fmtDateBR(s.date)+' · '+s.venue+', '+s.city).replace(/[<>]/g,'')}</span>
            </label>`).join("")}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px">
        <span id="ep_err" style="font-family:var(--font-mono);font-size:11px;color:var(--pj)"></span>
        <div style="display:flex;gap:8px">
          <button class="btn" id="ep_cancel">Cancelar</button>
          <button class="btn primary" id="ep_save">Salvar →</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);

  const shows = modal.querySelector("#ep_shows");
  const countEl = modal.querySelector("#ep_shows_count");
  shows.addEventListener("change", () => {
    const n = shows.querySelectorAll("input:checked").length;
    countEl.textContent = n;
  });

  modal.querySelector("#ep_cancel").addEventListener("click", () => modal.remove());
  modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });

  modal.querySelector("#ep_save").addEventListener("click", async () => {
    const err = modal.querySelector("#ep_err");
    err.textContent = "";
    const payload = {
      display_name: modal.querySelector("#ep_name").value.trim(),
      city:         modal.querySelector("#ep_city").value.trim(),
      birth_year:   modal.querySelector("#ep_year").value ? parseInt(modal.querySelector("#ep_year").value, 10) : null,
      email:        modal.querySelector("#ep_email").value.trim(),
      bio:          modal.querySelector("#ep_bio").value.trim(),
      shows_attended: Array.from(shows.querySelectorAll("input:checked")).map(i => i.value),
    };
    if (payload.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)) {
      err.textContent = "Email inválido"; return;
    }
    const saveBtn = modal.querySelector("#ep_save");
    saveBtn.disabled = true; saveBtn.textContent = "Salvando…";
    try {
      const res = await apiFetch("/forum/users/me", { method: "PATCH", body: JSON.stringify(payload) });
      if (res && res.updated) {
        modal.remove();
        location.reload();
      } else {
        err.textContent = "Nada pra atualizar";
        saveBtn.disabled = false; saveBtn.textContent = "Salvar →";
      }
    } catch (e) {
      err.textContent = e.message || "Erro ao salvar";
      saveBtn.disabled = false; saveBtn.textContent = "Salvar →";
    }
  });
}

function _fmtDateBR(iso) {
  if (!iso) return "";
  return new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", { day:"2-digit", month:"short", year:"numeric" });
}

function initTheme() {
  const saved = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });
}

async function init() {
  initTheme();
  if (_token && !_user) {
    try {
      const data = await apiFetch("/auth/me");
      _user = data;
      localStorage.setItem("forum_user", JSON.stringify(data));
    } catch (_) { localStorage.removeItem("forum_token"); _token = null; }
  }
  renderAuthArea();

  const params = new URLSearchParams(location.search);
  const profileId = params.get("id");
  if (!profileId) {
    document.getElementById("pageContent").innerHTML = `<div class="error-state">Perfil não encontrado. <a href="forum.html" style="color:var(--pj)">Voltar ao fórum</a></div>`;
    return;
  }
  try {
    // Carrega perfil e catalogo em paralelo (cataolgo eh estatico ~50KB).
    const [raw, cat] = await Promise.all([
      apiFetch(`/forum/users/${encodeURIComponent(profileId)}`),
      loadShowsCatalog(),
    ]);
    // Adapta payload do backend novo pro formato esperado pelo renderProfile
    const data = raw ? {
      id: raw.user_id,
      display_name: raw.display_name,
      avatar_url: raw.avatar_url,
      created_at: raw.created_at,
      bio: raw.bio || "",
      email: raw.email || "",
      birth_year: raw.birth_year || null,
      city: raw.city || "",
      shows_attended: raw.shows_attended || [],
      post_count: raw.posts_count,
      topic_count: raw.topics_count,
      reactions_received: raw.likes_received,
      tava_la_count: raw.tava_la_count,
      rank_pos: raw.rank_pos,
      veterano: raw.veterano,
      arquivista: raw.arquivista,
      recent_topics: (raw.recent_activity || []).filter(a => a.kind === "topic").map(a => ({
        id: a.target_id, title: a.target_title, created_at: a.created_at, reply_count: 0, category: ""
      })),
    } : null;
    if (data) renderProfile(data, cat);
  } catch (err) {
    const san2 = s => DOMPurify.sanitize(s || "", { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
    document.getElementById("pageContent").innerHTML = `<div class="error-state">Erro ao carregar perfil: ${san2(err.message)}. <a href="forum.html" style="color:var(--pj)">Voltar ao fórum</a></div>`;
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
