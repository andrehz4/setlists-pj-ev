<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fórum — Só mais um fã de Pearl Jam</title>
<meta name="description" content="Comunidade SMUFDPJ — discuta shows, álbuns e setlists do Pearl Jam e Eddie Vedder.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0908'/><text x='16' y='23' font-family='Arial Black,Arial,sans-serif' font-size='17' font-weight='900' fill='%23c1272d' text-anchor='middle'>PJ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Big+Shoulders+Stencil+Display:wght@500;700;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap">
<script src="/purify.min.js"></script>
<style>
/* ── Variáveis e reset ── */
:root {
  --bg: #0a0908; --bg-card: #141210; --bg-card-hover: #1b1915;
  --ink: #f5f1e8; --ink-mute: #a8a092; --ink-dim: #6b6459;
  --divider: #2a2520; --divider-strong: #403930;
  --pj: #c1272d; --pj-soft: #7a1a1d; --ev: #e8a13a; --ev-soft: #8c5d1f;
  --heard: #5a8a52; --bg-card-sunk: #100e0c;
  --font-display: "Archivo Black", sans-serif;
  --font-editorial: "Instrument Serif", serif;
  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "JetBrains Mono", monospace;
}
html[data-theme="light"] {
  --bg: #f3ede0; --bg-card: #ebe4d3; --bg-card-hover: #e0d8c3;
  --ink: #1a1612; --ink-mute: #5a5245; --ink-dim: #8a7f6d;
  --divider: #d4cbb5; --divider-strong: #b3a78a;
  --pj: #9c1f22; --pj-soft: #6b1518; --ev: #a0671e; --ev-soft: #6e4716;
  --heard: #4a7342; --bg-card-sunk: #e6dec8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* ── Header ── */
.site-header {
  border-bottom: 1px solid var(--divider);
  background: var(--bg-card-sunk);
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1400px; margin: 0 auto;
  padding: 0 32px;
  display: flex; align-items: center; gap: 20px;
  height: 56px;
}
.site-logo {
  font-family: var(--font-display); font-size: 17px; color: var(--pj);
  text-transform: uppercase; letter-spacing: -0.01em;
  text-decoration: none; flex-shrink: 0;
}
.header-back {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-dim);
  text-decoration: none; padding: 6px 10px; border: 1px solid var(--divider);
}
.header-back:hover { color: var(--ink); border-color: var(--ink-dim); }
.header-spacer { flex: 1; }
.theme-toggle {
  background: transparent; border: 1px solid var(--divider-strong);
  color: var(--ink); width: 36px; height: 36px; border-radius: 50%;
  cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center;
}
.theme-toggle:hover { border-color: var(--pj); color: var(--pj); }
.auth-btn {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em;
  text-transform: uppercase; padding: 8px 14px;
  border: 1px solid var(--divider-strong); background: transparent; color: var(--ink);
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.auth-btn.primary { background: var(--pj); border-color: var(--pj); color: #fff; }
.auth-btn:hover { border-color: var(--ink-mute); }
.auth-btn.primary:hover { background: var(--pj-soft); }
.user-badge {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-mute);
}
.user-badge .av {
  width: 28px; height: 28px; border-radius: 50%; background: var(--bg-card);
  border: 1px solid var(--pj-soft); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 10px; color: var(--pj); overflow: hidden;
}
.user-badge .av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.logout-btn {
  background: none; border: none; font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim);
  cursor: pointer; padding: 4px;
}
.logout-btn:hover { color: var(--pj); }

/* ── Forum page title ── */
.forum-header {
  max-width: 1400px; margin: 0 auto;
  padding: 28px 32px 0;
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
}
.forum-header h1 {
  font-family: var(--font-editorial); font-style: italic;
  font-size: clamp(28px, 4vw, 42px); color: var(--ink); margin: 0;
  line-height: 1.1;
}
.forum-header .eyebrow {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--pj); margin-bottom: 6px;
}

/* ── Botões gerais ── */
.btn {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; padding: 9px 16px;
  border: 1px solid var(--divider-strong); background: transparent; color: var(--ink);
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px; line-height: 1;
}
.btn.primary { background: var(--pj); border-color: var(--pj); color: #fff; }
.btn.ghost { border-color: transparent; color: var(--ink-mute); }
.btn.sm { padding: 6px 11px; font-size: 10px; }

/* ── Tags ── */
.tag { padding: 2px 7px; border: 1px solid var(--divider-strong); color: var(--ink-mute); line-height: 1.4; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; }
.tag.pj { color: var(--pj); border-color: var(--pj-soft); }
.tag.ev { color: var(--ev); border-color: var(--ev-soft); }

/* ── Forum CSS (extraído do index.html) ── */
.forum-subnav { display: flex; border-bottom: 1px solid var(--divider-strong); padding: 0 32px; align-items: stretch; flex-wrap: wrap; background: var(--bg-card-sunk); box-shadow: inset 0 -3px 0 var(--bg), inset 0 -4px 0 var(--divider); max-width: 1400px; margin: 0 auto; }
.forum-cat { padding: 14px 18px 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); background: transparent; border: none; border-right: 1px solid var(--divider-strong); display: flex; flex-direction: column; gap: 6px; min-width: 140px; text-align: left; cursor: pointer; position: relative; }
.forum-cat:last-child { border-right: none; }
.forum-cat.active { color: var(--ink); background: rgba(193,39,45,0.08); box-shadow: inset 0 -3px 0 var(--pj); }
.forum-cat .cat-count { font-size: 10px; color: var(--ink-dim); letter-spacing: 0.18em; }
.forum-cat.active .cat-count { color: var(--pj); }
.forum-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 32px 14px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; }
.forum-toolbar-left, .forum-toolbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sort-chip { padding: 6px 11px; border: 1px solid var(--divider); background: transparent; color: var(--ink-mute); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
.sort-chip.active { color: var(--ink); border-color: var(--ink-mute); }
.search-input { flex: 0 1 280px; padding: 8px 12px; background: var(--bg-card); color: var(--ink); border: 1px solid var(--divider-strong); font-family: var(--font-mono); font-size: 12px; border-radius: 0; }
.search-input::placeholder { color: var(--ink-dim); }
.thread-list { padding: 0 32px 40px; max-width: 1400px; margin: 0 auto; }
.thread-row { display: grid; grid-template-columns: 44px 1fr 180px 130px 100px; gap: 18px; align-items: center; padding: 18px 4px; border-bottom: 1px solid var(--divider); position: relative; cursor: pointer; }
.thread-row:hover .thread-title { color: var(--pj); }
.thread-row.pinned { background: rgba(193,39,45,0.04); border-left: 2px solid var(--pj); padding-left: 12px; }
.thread-avatar { width: 40px; height: 40px; background: var(--bg-card); border: 1px solid var(--divider-strong); border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; color: var(--ink-mute); overflow: hidden; flex-shrink: 0; }
.thread-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.thread-main { min-width: 0; }
.thread-tags { display: inline-flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.pinned-flag { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--pj); }
.thread-title { font-family: var(--font-editorial); font-style: italic; font-size: 19px; color: var(--ink); margin: 0; line-height: 1.25; }
.thread-snippet { margin-top: 4px; font-family: var(--font-body); font-size: 13.5px; color: var(--ink-mute); line-height: 1.45; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.thread-author { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim); margin-top: 6px; }
.thread-author .who { color: var(--ink-mute); text-transform: uppercase; }
.thread-author .ago { opacity: 0.6; margin-left: 8px; }
.thread-anchor { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); letter-spacing: 0.08em; border-left: 1px dashed var(--divider-strong); padding-left: 14px; line-height: 1.4; }
.thread-anchor .anchor-label { display: block; font-size: 9px; letter-spacing: 0.22em; color: var(--ink-dim); margin-bottom: 2px; text-transform: uppercase; }
.thread-anchor .anchor-where { color: var(--ink); display: block; }
.thread-anchor.pj .anchor-label { color: var(--pj); }
.thread-stats { display: flex; gap: 14px; align-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); }
.thread-stats .stat-bit { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.thread-stats .stat-bit b { font-family: var(--font-display); font-size: 16px; color: var(--ink); font-weight: normal; }
.thread-stats .stat-bit em { font-style: normal; font-size: 9px; letter-spacing: 0.2em; color: var(--ink-dim); text-transform: uppercase; }
/* Empty state stamp */
.empty-stamp-wrap { padding: 80px 32px; text-align: center; }
.empty-stamp { width: 150px; height: 150px; margin: 0 auto 26px; border: 2px dashed var(--pj); display: grid; place-items: center; position: relative; border-radius: 50%; background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(193,39,45,0.05) 6px 7px); transform: rotate(-6deg); }
.empty-stamp::before { content: ""; position: absolute; inset: 8px; border: 1px solid var(--pj); border-radius: 50%; opacity: 0.4; }
.empty-stamp-text { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--pj); text-align: center; line-height: 0.95; }
.empty-stamp-text small { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ev); letter-spacing: 0.25em; margin-top: 4px; }
.empty-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--pj); margin-bottom: 10px; }
.empty-title { font-family: var(--font-editorial); font-style: italic; font-size: clamp(28px, 4vw, 38px); color: var(--ink); margin: 0 0 12px; line-height: 1.1; }
.empty-sub { font-family: var(--font-body); font-size: 17px; color: var(--ink-mute); line-height: 1.55; margin: 0 auto 28px; max-width: 520px; }
.thread-activity { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); text-align: right; line-height: 1.4; }
.thread-activity .ago { display: block; color: var(--ink); font-size: 11.5px; margin-bottom: 2px; }
.thread-activity .who { color: var(--ink-dim); letter-spacing: 0.08em; }

/* ── Paginação ── */
.pagination { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 28px 32px 48px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
.pagination .page-info { color: var(--ink-dim); }

/* ── Composer ── */
.composer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; place-items: center; z-index: 200; padding: 20px;
}
.composer-overlay.open { display: grid; }
.composer-modal {
  background: var(--bg-card); border: 1px solid var(--divider-strong);
  width: 100%; max-width: 760px; display: flex; flex-direction: column;
  max-height: 90vh;
}
.composer-modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; border-bottom: 1px solid var(--divider);
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim);
  flex-shrink: 0;
}
.composer-modal-close {
  background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; margin-left: 4px;
}
.composer-modal-close:hover { color: var(--pj); }
.composer-form { padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.composer-field { display: flex; flex-direction: column; gap: 6px; }
.composer-field label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); }
.composer-field input {
  background: var(--bg-card-sunk); border: 1px solid var(--divider-strong);
  padding: 12px 14px; font-family: var(--font-body); font-size: 16px; color: var(--ink); width: 100%;
  border-radius: 0; outline: none;
}
.composer-field input:focus { border-color: var(--pj); }
.composer-field input::placeholder { color: var(--ink-dim); font-style: italic; }
.char-count { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); text-align: right; }
.char-count.warn { color: var(--ev); }
.composer-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.error-msg { background: rgba(193,39,45,0.1); border: 1px solid var(--pj-soft); padding: 10px 14px; font-family: var(--font-mono); font-size: 11px; color: var(--pj); display: none; }
.error-msg.visible { display: block; }

/* ── Category pills ── */
.cat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-pill { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 6px 12px; border: 1px solid var(--divider-strong); background: transparent; color: var(--ink-mute); cursor: pointer; }
.cat-pill:hover { border-color: var(--ink-mute); color: var(--ink); }
.cat-pill.active { background: rgba(193,39,45,0.1); border-color: var(--pj); color: var(--pj); }

/* ── Composer toolbar & body ── */
.tool-btn { background: transparent; border: 1px solid transparent; color: var(--ink-mute); font-family: var(--font-mono); font-size: 12px; width: 30px; height: 30px; display: inline-grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.tool-btn:hover { border-color: var(--divider-strong); color: var(--ink); }
.tool-btn.b { font-weight: 700; }
.tool-btn.i { font-style: italic; font-family: var(--font-editorial); font-size: 16px; }
.tool-sep { width: 1px; height: 16px; background: var(--divider-strong); margin: 0 4px; flex-shrink: 0; align-self: center; }
.ctoolbar { display: flex; gap: 2px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--divider); background: var(--bg-card-sunk); flex-wrap: wrap; }
.composer-body-wrap { border: 1px solid var(--divider-strong); }
.composer-textarea { width: 100%; padding: 14px; min-height: 180px; font-family: var(--font-body); font-size: 16px; color: var(--ink); line-height: 1.55; background: var(--bg-card-sunk); border: none; outline: none; resize: vertical; display: block; }
.composer-textarea::placeholder { color: var(--ink-dim); font-style: italic; font-family: var(--font-editorial); }
.composer-preview-pane { display: none; padding: 14px; min-height: 80px; background: var(--bg-card-sunk); font-family: var(--font-body); font-size: 16px; color: var(--ink); line-height: 1.55; border-top: 1px solid var(--divider); }
.composer-field-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }

/* ── Tag editor ── */
.tag-editor { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 10px; border: 1px solid var(--divider-strong); background: var(--bg-card-sunk); min-height: 44px; }
.tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: transparent; border: 1px solid var(--divider-strong); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-mute); }
.tag-chip .rm { background: none; border: none; color: var(--ink-mute); cursor: pointer; font-size: 12px; padding: 0 0 0 2px; line-height: 1; }
.tag-chip.pj { background: rgba(193,39,45,0.08); border-color: var(--pj-soft); color: var(--pj); }
.tag-chip.pj .rm { color: var(--pj); }
.tag-chip.ev { background: rgba(232,161,58,0.08); border-color: var(--ev-soft); color: var(--ev); }
.tag-chip.ev .rm { color: var(--ev); }
.tag-input-el { background: transparent; border: none; outline: none; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink); flex: 1; min-width: 120px; padding: 2px 0; }
.tag-input-el::placeholder { color: var(--ink-dim); }

/* ── Anexos (status de anexos) ── */
.composer-attachments { display: flex; gap: 8px; flex-wrap: wrap; }
.attach-btn { padding: 10px 14px; border: 1px dashed var(--divider-strong); background: transparent; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: border-color 120ms, color 120ms; }
.attach-btn:hover { border-color: var(--ink-mute); color: var(--ink); }
.attach-btn .ico { color: var(--pj); font-family: var(--font-display); font-size: 13px; line-height: 1; }
.attach-btn.added { border-style: solid; border-color: var(--heard, #4a8a3f); color: var(--heard, #4a8a3f); }
.attach-btn.added .ico { color: var(--heard, #4a8a3f); }
.attach-btn.added:hover { border-color: var(--heard, #4a8a3f); color: var(--heard, #4a8a3f); opacity: 0.85; }

/* ── Forum Highlights ── */
.forum-highlights { display: grid; grid-template-columns: 1.4fr 1fr 1fr; border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); margin: 0 32px; }
.fh-cell { padding: 22px 24px; border-right: 1px solid var(--divider); }
.fh-cell:last-child { border-right: none; }
.fh-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 10px; }
.fh-label.pj { color: var(--pj); }
.fh-headline { font-family: var(--font-editorial); font-style: italic; font-size: 20px; color: var(--ink); line-height: 1.2; margin: 0 0 6px; cursor: pointer; }
.fh-headline:hover { color: var(--pj); }
.fh-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); letter-spacing: 0.08em; text-transform: uppercase; }
.fh-mini-list { display: flex; flex-direction: column; gap: 10px; }
.fh-mini-item { display: flex; gap: 10px; align-items: baseline; border-bottom: 1px dotted var(--divider); padding-bottom: 8px; cursor: pointer; }
.fh-mini-item:last-child { border-bottom: none; padding-bottom: 0; }
.fh-mini-item:hover .fh-mini-title { color: var(--pj); }
.fh-mini-num { font-family: var(--font-display); font-size: 16px; color: var(--ink-dim); width: 24px; flex-shrink: 0; }
.fh-mini-num.top { color: var(--pj); }
.fh-mini-title { font-family: var(--font-editorial); font-style: italic; font-size: 15px; color: var(--ink); line-height: 1.25; flex: 1; }
.fh-mini-meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); letter-spacing: 0.08em; white-space: nowrap; }
.rail-users { display: flex; flex-direction: column; gap: 8px; }
.rail-user { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11px; }
.rail-user .av { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-card-sunk); border: 1px solid var(--divider-strong); display: grid; place-items: center; font-family: var(--font-display); font-size: 10px; color: var(--ink-mute); overflow: hidden; flex-shrink: 0; }
.rail-user .av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.rail-user .who { color: var(--ink); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10.5px; }
.rail-user .count { margin-left: auto; color: var(--ink-dim); font-size: 10px; }

<body>

<script>const API_BASE = "https://perpetual-energy-production-1a69.up.railway.app";</script>

<script>
"use strict";

// ── Config ──────────────────────────────────────────────────
const CATS = [
  { id: "", label: "Todos" },
  { id: "shows", label: "Shows & Relatos" },
  { id: "setlist", label: "Setlists & Palpites" },
  { id: "musicas", label: "Músicas & Letras" },
  { id: "albums", label: "Álbuns & Discografia" },
  { id: "bootleg", label: "Bootlegs & Áudios" },
  { id: "cifras", label: "Cifras & Tabs" },
  { id: "eddie", label: "Eddie Vedder solo" },
  { id: "geral", label: "Geral" },
];
const COMPOSER_CATS = CATS.filter(c => c.id !== "");

// ── Estado ──────────────────────────────────────────────────
let _state = {
  page: 1,
  per_page: 20,
  category: "",
  sort: "activity",
  total: 0,
  token: localStorage.getItem("forum_token"),
  user: (() => { try { return JSON.parse(localStorage.getItem("forum_user")); } catch(e) { return null; } })(),
};

// ── Helpers ──────────────────────────────────────────────────
function san(str) {
  return DOMPurify.sanitize(str || "", { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
}
// Só aceita URLs https; bloqueia javascript:, data:, etc. em src/href de terceiros.
function sanUrl(url) {
  const u = (url || "").trim();
  return /^https:\/\//i.test(u) ? san(u) : "";
}
function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60) return "agora";
  if (diff < 3600) return Math.floor(diff / 60) + "min";
  if (diff < 86400) return Math.floor(diff / 3600) + "h";
  if (diff < 604800) return Math.floor(diff / 86400) + "d";
  return new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}
function initials(name) {
  return (name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
}

function bodySnippet(body, max = 180) {
  let t = String(body || "");
  // Tira anexos pesados (base64 nao aparece no preview)
  t = t.replace(/\[img\][\s\S]*?\[\/img\]/gi, " [foto] ");
  t = t.replace(/\[audio\][\s\S]*?\[\/audio\]/gi, " [áudio] ");
  t = t.replace(/\[audio-url\][\s\S]*?\[\/audio-url\]/gi, " [áudio] ");
  t = t.replace(/\[setlist\][\s\S]*?\[\/setlist\]/gi, " [setlist] ");
  t = t.replace(/\[spoiler\][\s\S]*?\[\/spoiler\]/gi, " [spoiler] ");
  // Alinhamento e markdown ficam transparentes
  t = t.replace(/\[(esq|centro|dir)\]([\s\S]*?)\[\/\1\]/gi, "$2");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "$1");
  t = t.replace(/_([^_\n]+)_/g, "$1");
  t = t.replace(/~~([^~\n]+)~~/g, "$1");
  // Bloco de tags hashtag em qualquer posicao (aparecem como chips no topico)
  t = t.replace(/\n\n(?:#[\wÀ-ɏ_-]+(?:[ \t]+|(?=\n\n|$)))+(?=\n\n|$)/gu, "");
  t = t.replace(/\s+/g, " ").trim();
  if (t.length > max) t = t.slice(0, max - 1) + "…";
  return t;
}
function avatarHtml(url, name) {
  const safe = sanUrl(url);
  return safe ? `<img src="${safe}" alt="${san(name)}">` : san(initials(name));
}
const _HTTP_MSGS = {
  400: "Dados inválidos. Verifique o que foi enviado.",
  401: "Sessão expirada. Entre novamente.",
  403: "Sem permissão para esta ação.",
  404: "Conteúdo não encontrado.",
  422: "Texto muito longo ou formato inválido.",
  429: "Muitas tentativas seguidas. Aguarde um momento.",
  500: "Erro no servidor. Tente novamente em breve.",
  503: "Serviço temporariamente indisponível.",
};
async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (_state.token) headers["Authorization"] = "Bearer " + _state.token;
  let res;
  try {
    res = await fetch(API_BASE + path, { ...opts, headers });
  } catch (_) {
    throw new Error("Sem conexão com o servidor. Verifique sua internet.");
  }
  if (res.status === 401) { logout(); return null; }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const serverMsg = typeof body.detail === "string" ? body.detail : null;
    throw new Error(serverMsg || _HTTP_MSGS[res.status] || "Erro " + res.status);
  }
  return res.json();
}

// ── Auth ──────────────────────────────────────────────────────
function logout() {
  localStorage.removeItem("forum_token");
  localStorage.removeItem("forum_user");
  _state.token = null;
  _state.user = null;
  renderAuthArea();
}
function renderAuthArea() {
  const area = document.getElementById("authArea");
  const btn = document.getElementById("newTopicBtn");
  if (_state.token && _state.user) {
    const u = _state.user;
    const avHtml = avatarHtml(u.avatar_url, u.display_name);
    area.innerHTML = `
      <div class="user-badge">
        <div class="av">${avHtml}</div>
        <span>${san(u.display_name)}</span>
        <button class="logout-btn" id="logoutBtn">Sair</button>
      </div>`;
    document.getElementById("logoutBtn").addEventListener("click", logout);
    if (btn) btn.style.display = "";
  } else {
    area.innerHTML = `<button class="auth-btn primary" id="loginBtn">Entrar com Google</button>`;
    document.getElementById("loginBtn").addEventListener("click", () => {
      location.href = API_BASE + "/auth/google/login";
    });
    if (btn) btn.style.display = "none";
  }
}

// ── Render highlights ────────────────────────────────────────
function renderHighlights(items) {
  const area = document.getElementById("highlightsArea");
  if (!items || items.length === 0) { area.innerHTML = ""; return; }

  const top = items.slice().sort((a, b) => b.reply_count - a.reply_count);
  const hot = top[0];
  const hotAv = avatarHtml(hot.avatar_url, hot.display_name);

  const miniItems = top.slice(0, 3).map((t, i) =>
    `<div class="fh-mini-item" data-id="${san(t.id)}">
      <span class="fh-mini-num${i === 0 ? " top" : ""}">${i + 1}</span>
      <span class="fh-mini-title">${san(t.title)}</span>
      <span class="fh-mini-meta">${t.reply_count} ${t.reply_count === 1 ? "resp." : "resps."}</span>
    </div>`
  ).join("");

  const seen = new Set();
  const voices = items
    .filter(t => { const k = (t.display_name || "").toLowerCase().trim(); if (seen.has(k)) return false; seen.add(k); return true; })
    .slice(0, 4);
  const voiceItems = voices.map(t => {
    const av = avatarHtml(t.avatar_url, t.display_name);
    return `<div class="rail-user">
      <div class="av">${av}</div>
      <span class="who">${san(t.display_name)}</span>
    </div>`;
  }).join("");

  area.innerHTML = `
    <div class="forum-highlights">
      <div class="fh-cell">
        <div class="fh-label pj">// Em alta agora</div>
        <h3 class="fh-headline" data-id="${san(hot.id)}">${san(hot.title)}</h3>
        <div class="fh-meta">${hot.reply_count} ${hot.reply_count === 1 ? "resposta" : "respostas"} · ${san(hot.display_name)}</div>
      </div>
      <div class="fh-cell">
        <div class="fh-label">// Tópicos quentes</div>
        <div class="fh-mini-list">${miniItems}</div>
      </div>
      <div class="fh-cell">
        <div class="fh-label">// Vozes recentes</div>
        <div class="rail-users">${voiceItems}</div>
      </div>
    </div>`;

  area.querySelectorAll("[data-id]").forEach(el => {
    el.addEventListener("click", () => {
      location.href = `forum-topic.html?id=${encodeURIComponent(el.dataset.id)}`;
    });
  });
}

// ── Render subnav ─────────────────────────────────────────────
function renderSubnav() {
  document.getElementById("subnav").innerHTML = CATS.map(c => `
    <button class="forum-cat${_state.category === c.id ? " active" : ""}" data-cat="${c.id}">
      ${san(c.label)}
    </button>`).join("");
}

// ── Render threads ────────────────────────────────────────────
function renderThreads(data) {
  const list = document.getElementById("threadList");
  if (!data || !data.items || data.items.length === 0) {
    document.getElementById("highlightsArea").innerHTML = "";
    const cat = _state.category || "";
    list.innerHTML = `
      <div class="empty-stamp-wrap">
        <div class="empty-stamp">
          <div class="empty-stamp-text">CATEGORIA<br>VAZIA<small>${cat ? san(cat.toUpperCase()) : "FÓRUM"}</small></div>
        </div>
        <div class="empty-eyebrow">Sem tópicos aqui</div>
        <h2 class="empty-title">Ninguém falou ainda</h2>
        <p class="empty-sub">Seja o primeiro a abrir uma conversa nesta categoria.</p>
        ${_state.token ? `<button class="btn primary" onclick="openComposer()"><span class="plus">+</span> Abrir thread</button>` : ""}
      </div>`;
    return;
  }
  renderHighlights(data.items);
  list.innerHTML = data.items.map(t => {
    const avHtml = avatarHtml(t.avatar_url, t.display_name);
    return `
      <div class="thread-row${t.pinned ? " pinned" : ""}" data-id="${san(t.id)}">
        <div class="thread-avatar">${avHtml}</div>
        <div class="thread-main">
          ${t.pinned ? `<div class="thread-tags"><span class="pinned-flag">★ Fixado</span><span class="tag pj">${san(t.category)}</span></div>` : `<div class="thread-tags"><span class="tag">${san(t.category)}</span></div>`}
          <h3 class="thread-title">${san(t.title)}</h3>
          <p class="thread-snippet">${san(bodySnippet(t.body))}</p>
          <div class="thread-author">por <span class="who">${san(t.display_name)}</span><span class="ago">· ${timeAgo(t.created_at)}</span></div>
        </div>
        <div class="thread-anchor pj">
          <span class="anchor-label">Categoria</span>
          <span class="anchor-where">${san(t.category)}</span>
        </div>
        <div class="thread-stats">
          <div class="stat-bit"><b>${t.reply_count}</b><em>resp.</em></div>
          <div class="stat-bit"><b>${(t.reactions && t.reactions.mata) || 0}</b><em>🤘</em></div>
        </div>
        <div class="thread-activity">
          <span class="ago">${timeAgo(t.last_post_at)}</span>
          <span class="who">${san(t.display_name)}</span>
        </div>
      </div>`;
  }).join("");
  _state.total = data.total;
  renderPagination(data);
}

// ── Paginação ─────────────────────────────────────────────────
function renderPagination(data) {
  const total = data.total;
  const pages = Math.ceil(total / _state.per_page);
  const pg = document.getElementById("pagination");
  if (pages <= 1) { pg.style.display = "none"; return; }
  pg.style.display = "flex";
  pg.innerHTML = `
    <button class="btn sm" id="prevPage"${_state.page <= 1 ? " disabled" : ""}>← Anterior</button>
    <span class="page-info">Página ${_state.page} de ${pages}</span>
    <button class="btn sm" id="nextPage"${_state.page >= pages ? " disabled" : ""}>Próxima →</button>`;
  pg.querySelector("#prevPage").addEventListener("click", () => { if (_state.page > 1) { _state.page--; loadTopics(); } });
  pg.querySelector("#nextPage").addEventListener("click", () => { if (_state.page < pages) { _state.page++; loadTopics(); } });
}

// ── Load topics ───────────────────────────────────────────────
async function loadTopics() {
  document.getElementById("threadList").innerHTML = `<div class="loading-state">Carregando…</div>`;
  const params = new URLSearchParams({
    page: _state.page,
    per_page: _state.per_page,
    sort: _state.sort,
  });
  if (_state.category) params.set("category", _state.category);
  try {
    const data = await apiFetch("/forum/topics?" + params);
    if (data) renderThreads(data);
  } catch (err) {
    document.getElementById("threadList").innerHTML = `<div class="loading-state">Erro ao carregar tópicos. Tente novamente.</div>`;
  }
}

// ── Composer ──────────────────────────────────────────────────
let _composerTags = [];
let _composerPhotos = [];
let _ctPreviewing = false;

// Limites alinhados ao backend (body max 200000 chars). Foto grande trava o browser.
const MAX_UPLOAD_BYTES = 8 * 1024 * 1024;   // 8 MB por arquivo de entrada
const MAX_BODY_CHARS = 200000;              // teto do backend (TopicCreate.body)

function _escHtml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderPreview(raw) {
  const esc = _escHtml(raw);
  const bold = esc.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  const italic = bold.replace(/_([^_\n]+)_/g, "<em>$1</em>");
  const spoiler = italic.replace(/\[spoiler\]([\s\S]*?)\[\/spoiler\]/gi,
    (_, c) => `<span style="background:var(--bg-card);border:1px dashed var(--ev-soft);padding:2px 8px;color:var(--ev);font-family:var(--font-mono);font-size:12px">&#9888; spoiler</span>`);
  const quotes = spoiler.replace(/^&gt;([^\n]*)/gm, (_, c) => `<div style="border-left:3px solid var(--ev);background:var(--bg-card);padding:6px 12px;margin:4px 0;font-style:italic;color:var(--ink-mute)">${c.trim()}</div>`);
  const paras = "<p>" + quotes.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
  return DOMPurify.sanitize(paras, {
    ALLOWED_TAGS: ["p", "br", "strong", "em", "div", "span"],
    ALLOWED_ATTR: ["style"],
  });
}

function _totalBodyChars() {
  const bodyLen = (document.getElementById("topicBody")?.value || "").length;
  const photoChars = _composerPhotos.reduce((s, p) => s + p.dataUrl.length + 11, 0);
  return bodyLen + photoChars;
}
function updateComposerMeta() {
  const total = _totalBodyChars();
  const meta = document.getElementById("composerMeta");
  if (meta) {
    const tagStr = _composerTags.length ? `${_composerTags.length} tag${_composerTags.length > 1 ? "s" : ""}` : "0 tags";
    const photoStr = _composerPhotos.length ? ` · ${_composerPhotos.length} foto${_composerPhotos.length > 1 ? "s" : ""}` : "";
    const over = total > MAX_BODY_CHARS ? " · LIMITE EXCEDIDO" : "";
    meta.textContent = `${tagStr}${photoStr} · ${total} car.${over}`;
  }
  updateAttachmentStatus();
}

function updateAttachmentStatus() {
  const container = document.getElementById("composerAttachments");
  if (!container) return;
  const body = document.getElementById("topicBody")?.value || "";
  const detected = {
    setlist: /\[setlist\]/i.test(body),
    music:   /\[music(?:a|á)?\]/i.test(body),
    photo:   _composerPhotos.length > 0,
    audio:   /\[audio(?:-url)?\]/i.test(body),
    spoiler: /\[spoiler\]/i.test(body),
  };
  const addedLabel = {
    setlist: "setlist incorporado",
    music:   "música incorporada",
    photo:   `${_composerPhotos.length} foto${_composerPhotos.length === 1 ? "" : "s"} anexada${_composerPhotos.length === 1 ? "" : "s"}`,
    audio:   "áudio anexado",
    spoiler: "spoiler ativo",
  };
  const baseLabel = {
    setlist: "incorporar setlist",
    music:   "incorporar música",
    photo:   "foto (até 4)",
    audio:   "áudio curto",
    spoiler: "bloco com spoiler",
  };
  container.querySelectorAll(".attach-btn").forEach(btn => {
    const key = btn.dataset.attach;
    const isAdded = !!detected[key];
    btn.classList.toggle("added", isAdded);
    const ico = btn.querySelector(".ico");
    const lab = btn.querySelector(".label");
    if (ico) ico.textContent = isAdded ? "✓" : "+";
    if (lab) lab.textContent = isAdded ? addedLabel[key] : baseLabel[key];
  });
}

function renderPhotoRow() {
  const row = document.getElementById("photoAttachRow");
  if (!row) return;
  row.innerHTML = "";
  if (!_composerPhotos.length) { row.style.display = "none"; return; }
  row.style.display = "flex";
  _composerPhotos.forEach((p, i) => {
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:relative;display:inline-block";
    const img = document.createElement("img");
    img.src = p.dataUrl;
    img.alt = p.name;
    img.style.cssText = "width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--divider)";
    const rm = document.createElement("button");
    rm.innerHTML = "&#215;";
    rm.title = "Remover foto";
    rm.style.cssText = "position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink-mute);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;padding:0;display:grid;place-items:center";
    rm.addEventListener("click", () => { _composerPhotos.splice(i, 1); renderPhotoRow(); updateComposerMeta(); });
    wrap.appendChild(img);
    wrap.appendChild(rm);
    row.appendChild(wrap);
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 400;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.65));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function tagColorClass(tag) {
  // Hash deterministico: mesma tag sempre cai na mesma cor (pj / ev / neutra)
  let h = 0;
  const s = (tag || "").toLowerCase();
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return ["pj", "", "ev"][h % 3];
}

function renderTagChips() {
  const editor = document.getElementById("tagEditor");
  const input = document.getElementById("tagInput");
  if (!editor || !input) return;
  editor.querySelectorAll(".tag-chip").forEach(el => el.remove());
  _composerTags.forEach((tag, i) => {
    const chip = document.createElement("span");
    const variant = tagColorClass(tag);
    chip.className = variant ? `tag-chip ${variant}` : "tag-chip";
    chip.innerHTML = `${san(tag)}<button class="rm" data-i="${i}" title="Remover">&#215;</button>`;
    editor.insertBefore(chip, input);
  });
  editor.querySelectorAll(".rm").forEach(btn => {
    btn.addEventListener("click", () => {
      _composerTags.splice(parseInt(btn.dataset.i), 1);
      renderTagChips(); updateComposerMeta();
    });
  });
}

function buildCatPills(activeId) {
  const container = document.getElementById("catPills");
  if (!container) return;
  container.innerHTML = COMPOSER_CATS.map(c =>
    `<button class="cat-pill${c.id === activeId ? " active" : ""}" data-cid="${san(c.id)}">${san(c.label)}</button>`
  ).join("");
  container.querySelectorAll(".cat-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      document.getElementById("topicCategory").value = btn.dataset.cid;
      container.querySelectorAll(".cat-pill").forEach(b => b.classList.toggle("active", b === btn));
    });
  });
}

function openComposer() {
  _composerTags = [];
  _composerPhotos = [];
  _ctPreviewing = false;
  const ta = document.getElementById("topicBody");
  if (ta) { ta.style.display = ""; ta.value = ""; }
  const pane = document.getElementById("topicPreviewPane");
  if (pane) pane.style.display = "none";
  const prevBtn = document.getElementById("ctPreviewBtn");
  if (prevBtn) prevBtn.textContent = "Prévia";
  document.getElementById("topicTitle").value = "";
  document.getElementById("topicCategory").value = "geral";
  document.getElementById("composerError").classList.remove("visible");
  const photoRow = document.getElementById("photoAttachRow");
  if (photoRow) { photoRow.innerHTML = ""; photoRow.style.display = "none"; }
  renderTagChips();
  updateComposerMeta();
  document.getElementById("composerOverlay").classList.add("open");
}

function closeComposer() {
  document.getElementById("composerOverlay").classList.remove("open");
  _composerTags = [];
  _composerPhotos = [];
  _ctPreviewing = false;
}

async function submitTopic() {
  const title = document.getElementById("topicTitle").value.trim();
  let body = document.getElementById("topicBody").value.trim();
  const category = document.getElementById("topicCategory").value || "geral";
  const errEl = document.getElementById("composerError");
  if (!title || title.length < 3) { errEl.textContent = "Título muito curto (mínimo 3 caracteres)."; errEl.classList.add("visible"); return; }
  if (!body || body.length < 10) { errEl.textContent = "Texto muito curto (mínimo 10 caracteres)."; errEl.classList.add("visible"); return; }
  if (_composerTags.length) body += "\n\n" + _composerTags.map(t => "#" + t).join(" ");
  if (_composerPhotos.length) body += "\n\n" + _composerPhotos.map(p => `[img]${p.dataUrl}[/img]`).join("\n");
  if (body.length > MAX_BODY_CHARS) {
    errEl.textContent = "Conteúdo muito grande (fotos pesadas demais). Remova uma foto e tente de novo.";
    errEl.classList.add("visible");
    return;
  }
  const btn = document.getElementById("composerSubmit");
  btn.disabled = true; btn.textContent = "Publicando…";
  errEl.classList.remove("visible");
  try {
    const data = await apiFetch("/forum/topics", {
      method: "POST",
      body: JSON.stringify({ title, body, category }),
    });
    if (data === null) {
      const loginUrl = API_BASE + "/auth/google/login";
      errEl.innerHTML = `Sua sessão expirou. <a href="${loginUrl}" style="color:var(--accent);text-decoration:underline;font-weight:600">Entre novamente com Google</a> para publicar a thread.`;
      errEl.classList.add("visible");
      btn.disabled = false; btn.textContent = "Publicar thread →";
      return;
    }
    if (data) {
      closeComposer();
      location.href = `forum-topic.html?id=${encodeURIComponent(data.id)}`;
    }
  } catch (err) {
    errEl.textContent = err.message || "Erro ao publicar. Tente novamente.";
    errEl.classList.add("visible");
    btn.disabled = false; btn.textContent = "Publicar thread →";
  }
}

function initComposer() {
  document.getElementById("composerClose").addEventListener("click", closeComposer);
  document.getElementById("composerCancel").addEventListener("click", closeComposer);
  document.getElementById("composerSubmit").addEventListener("click", submitTopic);
  document.getElementById("composerOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("composerOverlay")) closeComposer();
  });

  const ta = document.getElementById("topicBody");

  function wrapCT(prefix, suffix, placeholder) {
    if (_ctPreviewing) return;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const sel = ta.value.substring(start, end) || placeholder;
    ta.value = ta.value.substring(0, start) + prefix + sel + suffix + ta.value.substring(end);
    ta.focus();
    ta.setSelectionRange(start + prefix.length, start + prefix.length + sel.length);
    const n = ta.value.length;
    const bc = document.getElementById("bodyCount");
    if (bc) { bc.textContent = n + " / 50000"; bc.classList.toggle("warn", n > 48000); }
    updateComposerMeta();
  }

  const ctActions = {
    bold:    () => wrapCT("**", "**", "texto"),
    italic:  () => wrapCT("_", "_", "texto"),
    strike:  () => wrapCT("~~", "~~", "texto"),
    alignleft:   () => wrapCT("[esq]",    "[/esq]",    "texto alinhado à esquerda"),
    aligncenter: () => wrapCT("[centro]", "[/centro]", "texto centralizado"),
    alignright:  () => wrapCT("[dir]",    "[/dir]",    "texto alinhado à direita"),
    spoiler: () => wrapCT("[spoiler]", "[/spoiler]", "texto spoiler"),
    link:    () => wrapCT("[", "](url)", "texto"),
    quote: () => {
      if (_ctPreviewing) return;
      const s = ta.selectionStart, e2 = ta.selectionEnd;
      const sel = ta.value.substring(s, e2) || "trecho";
      const q = sel.split("\n").map(l => "> " + l).join("\n");
      ta.value = ta.value.substring(0, s) + q + ta.value.substring(e2);
      ta.focus(); updateComposerMeta();
    },
    list: () => {
      if (_ctPreviewing) return;
      const s = ta.selectionStart;
      ta.value = ta.value.substring(0, s) + "- " + ta.value.substring(s);
      ta.focus(); ta.setSelectionRange(s + 2, s + 2); updateComposerMeta();
    },
    undo: () => { ta.focus(); document.execCommand("undo"); },
    redo: () => { ta.focus(); document.execCommand("redo"); },
    setlist: () => alert("Em breve: incorporar setlist do arquivo."),
    music:   () => alert("Em breve: linkar música."),
    photo:   () => document.getElementById("photoFileInput").click(),
    audio:   () => alert("Em breve: anexar áudio."),
  };

  document.querySelector(".ctoolbar").addEventListener("click", e => {
    const btn = e.target.closest("[data-ct]");
    if (!btn) return;
    ctActions[btn.dataset.ct]?.();
  });

  document.getElementById("composerAttachments").addEventListener("click", e => {
    const btn = e.target.closest(".attach-btn");
    if (!btn) return;
    ctActions[btn.dataset.attach]?.();
  });

  const photoInput = document.getElementById("photoFileInput");
  photoInput.addEventListener("change", async () => {
    const all = Array.from(photoInput.files).filter(f => f.type.startsWith("image/"));
    const tooBig = all.filter(f => f.size > MAX_UPLOAD_BYTES);
    const files = all.filter(f => f.size <= MAX_UPLOAD_BYTES);
    const errEl = document.getElementById("composerError");
    if (tooBig.length) {
      errEl.textContent = `Foto acima de 8 MB ignorada (${tooBig.length}). Reduza o tamanho antes de anexar.`;
      errEl.classList.add("visible");
    }
    for (const file of files) {
      if (_composerPhotos.length >= 4) break;
      try {
        const dataUrl = await compressImage(file);
        _composerPhotos.push({ dataUrl, name: file.name });
      } catch (_) {}
    }
    photoInput.value = "";
    renderPhotoRow();
    updateComposerMeta();
  });

  ta.addEventListener("input", () => {
    const n = ta.value.length;
    const bc = document.getElementById("bodyCount");
    if (bc) { bc.textContent = n + " / 50000"; bc.classList.toggle("warn", n > 48000); }
    updateComposerMeta();
  });

  document.getElementById("topicTitle").addEventListener("input", e => {
    const el = document.getElementById("titleCount");
    if (el) { const n = e.target.value.length; el.textContent = n + " / 120"; el.classList.toggle("warn", n > 100); }
  });

  document.getElementById("ctPreviewBtn").addEventListener("click", () => {
    const pane = document.getElementById("topicPreviewPane");
    _ctPreviewing = !_ctPreviewing;
    if (_ctPreviewing) {
      pane.innerHTML = renderPreview(ta.value || "");
      pane.style.display = "block";
      ta.style.display = "none";
      document.getElementById("ctPreviewBtn").textContent = "Editar";
    } else {
      pane.style.display = "none";
      ta.style.display = "";
      document.getElementById("ctPreviewBtn").textContent = "Prévia";
    }
  });

  const tagInput = document.getElementById("tagInput");
  tagInput.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      const val = tagInput.value.trim().replace(/^#/, "").replace(/[^a-zA-Z0-9À-ɏ_-]/g, "");
      if (val && _composerTags.length < 4 && !_composerTags.includes(val)) {
        _composerTags.push(val);
        renderTagChips(); updateComposerMeta();
      }
      tagInput.value = "";
    }
    if (e.key === "Backspace" && !tagInput.value && _composerTags.length) {
      _composerTags.pop();
      renderTagChips(); updateComposerMeta();
    }
  });
}

// ── Tema ──────────────────────────────────────────────────────
function initTheme() {
  const saved = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });
}

// ── Init ──────────────────────────────────────────────────────
async function init() {
  initTheme();
  renderSubnav();
  if (_state.token && !_state.user) {
    try {
      const data = await apiFetch("/auth/me");
      _state.user = data;
      localStorage.setItem("forum_user", JSON.stringify(data));
    } catch (_) {
      localStorage.removeItem("forum_token");
      _state.token = null;
    }
  }
  renderAuthArea();

  // Eventos subnav
  document.getElementById("subnav").addEventListener("click", e => {
    const btn = e.target.closest(".forum-cat");
    if (!btn) return;
    _state.category = btn.dataset.cat;
    _state.page = 1;
    renderSubnav();
    loadTopics();
  });

  // Eventos sort
  document.getElementById("sortBar").addEventListener("click", e => {
    const btn = e.target.closest(".sort-chip");
    if (!btn) return;
    document.querySelectorAll(".sort-chip").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    _state.sort = btn.dataset.sort;
    _state.page = 1;
    loadTopics();
  });

  // Eventos thread list (delegação)
  document.getElementById("threadList").addEventListener("click", e => {
    const row = e.target.closest(".thread-row");
    if (!row) return;
    location.href = `forum-topic.html?id=${encodeURIComponent(row.dataset.id)}`;
  });

  // Composer
  document.getElementById("newTopicBtn").addEventListener("click", openComposer);
  initComposer();

  // Busca
  let searchTimer;
  document.getElementById("searchInput").addEventListener("input", e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { _state.page = 1; loadTopics(); }, 500);
  });

  loadTopics();
}

document.addEventListener("DOMContentLoaded", init);
</script>
