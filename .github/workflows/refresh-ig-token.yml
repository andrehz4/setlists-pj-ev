name: Refresh IG token
# Tokens long-lived do Instagram expiram em 60 dias.
# Roda nos dias 1 e 15 (o token dura 60 dias; uma tentativa por mes ja deixou ele expirar).
#
# PRE-REQUISITO: secret GH_PAT_SECRETS com um token fine-grained (trocado em 2026-10-03):
#   github.com > Settings > Developer settings > Fine-grained tokens, nome "setlists-pj-ev renovar token IG",
#   sem expiracao, SO o repo andrehz4/setlists-pj-ev, permissao "Secrets: Read and write" (Metadata vem junto).
#   Salvar pelo app Terminal (o ! do Claude Code grava vazio):
#     read -s K && printf %s "$K" | gh secret set GH_PAT_SECRETS --repo andrehz4/setlists-pj-ev && echo "salvo: ${#K} caracteres"; unset K
#   (deve dar ~93 caracteres)
# SEM o PAT: o workflow falha com mensagem clara e NAO imprime o token no log.
on:
  schedule:
    # Dias 1 e 15, 06:13 UTC (o token do IG dura 60 dias).
    - cron: '13 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Verifica GH_PAT_SECRETS
        env:
          PAT: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::GH_PAT_SECRETS nao configurado. Veja instrucoes no topo deste workflow."
            exit 1
          fi
          echo "GH_PAT_SECRETS presente, prosseguindo."

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Refresh token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish/refresh-token.mjs

      - name: Alerta Telegram em falha
        # Falha silenciosa aqui ja causou 5 dias de IG parado (jun-ago/2026):
        # o refresh mensal falhou 3x sem ninguem ver e o token expirou em 30/jul.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "[telegram] sem token, skip"; exit 0; fi
          MSG="ALERTA: refresh do token IG FALHOU (refresh-ig-token.yml).
          Se nao corrigir, o token expira 60 dias apos a ultima renovacao e TODO o publish IG para.
          Ver run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MSG" >/dev/null
          echo "[telegram] alerta de falha enviado"
