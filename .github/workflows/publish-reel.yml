name: Publish Instagram Reel
on:
  schedule:
    # domingo 12:00 UTC = 09:00 BRT (resumao da semana)
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Gera MP4 mas nao chama IG API'
        type: boolean
        default: false
      force:
        description: 'Republica mesmo se ja postou na semana (ignora _reel-log)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-reel
  cancel-in-progress: false

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install ffmpeg
        timeout-minutes: 10
        uses: ./.github/actions/ffmpeg

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run publish-reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Facebook Pages: reel de video sai junto do reel do IG.
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PUBLISH_FB: '1'
          # narração (scripts/publish/narracao/): '1' liga; sem a chave ou com erro, sai só com música
          REEL_NARRACAO: '1'
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # transições e abertura com clipe (scripts/publish/reel/transicoes.mjs): trechos baixados do R2 (acervo/);
          # falha ou acervo vazio = reel sai sem transição
          REEL_TRANSICOES: '1'
          # mídia no R2 (scripts/publish/midia-r2.mjs): vídeo sobe pro bucket smufdpj-midia (apaga em 3 dias)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_MIDIA_BUCKET: ${{ secrets.R2_MIDIA_BUCKET }}
          R2_MIDIA_PUBLIC_BASE: ${{ secrets.R2_MIDIA_PUBLIC_BASE }}
          GIT_AUTHOR_NAME: pj-news-bot
          GIT_AUTHOR_EMAIL: bot@setlists-pj.local
        run: |
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/publish/run-publish-reel.mjs $ARGS
