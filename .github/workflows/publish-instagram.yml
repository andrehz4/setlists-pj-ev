name: Publish Instagram
on:
  schedule:
    # Roda apenas dentro das janelas ativas, a cada 20min.
    # Fora das janelas nao ha conteudo novo entrando na fila.
    #
    # Janela A: community manhã (12:25 UTC) + routine (12:30 UTC) = 09:10-10:50 BRT
    - cron: '10,30,50 12,13 * * *'
    # Janela B: story diario (16:00 UTC = 13:00 BRT) + ~40min de janela
    - cron: '0,20,40 16 * * *'
    # Janela C: community noite (00:25 UTC) + routine (00:30 UTC) = 21:10-22:50 BRT
    - cron: '10,30,50 0,1 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Gera slides e simula publish mas nao chama IG API'
        type: boolean
        default: false
      max-batches:
        description: 'Maximo de batches (regular+spotlight) por run'
        type: string
        default: '2'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # token padrao do workflow ja basta pra push (permissions: contents: write)
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Auto-merge routine branches
        # Detecta branches `claude/news-routine-*` deixados pela routine remota
        # (cujo push em main e bloqueado pelo proxy da Anthropic Cloud).
        # Valida rigorosamente (committer.login whitelist + path media/news/),
        # abre PR, mescla, deleta branch, notifica Telegram. Falha aqui nao
        # derruba o publish (publish prossegue mesmo se auto-merge der erro).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish/auto-merge-routine.mjs || true

      - name: Pull rebased main (auto-merge pode ter avancado)
        run: git pull --rebase --autostash || true

      - name: Run publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_AUTHOR_NAME: pj-news-bot
          GIT_AUTHOR_EMAIL: bot@setlists-pj.local
        run: |
          ARGS="--max-batches=${{ inputs.max-batches || '2' }}"
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/publish/run-publish.mjs $ARGS
