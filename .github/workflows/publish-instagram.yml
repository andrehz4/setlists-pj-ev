name: Publish Instagram
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke = so valida token/escopo (nao publica); publish = roda normal'
        type: choice
        options: [publish, smoke]
        default: publish
      dry-run:
        description: 'Gera slides e simula publish mas nao chama IG API'
        type: boolean
        default: false
      max-batches:
        description: 'Maximo de batches (regular+spotlight) por run'
        type: string
        default: '2'
      skip_fb:
        description: 'Marque pra publicar SO no Instagram nesta run (pula o Facebook)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # 50 commits cobrem o range origin/main..origin/<branch> que o
          # auto-merge-routine consulta; 0 baixava o historico inteiro
          # (~650MB) a cada run sem necessidade.
          fetch-depth: 50
          # token padrao do workflow ja basta pra push (permissions: contents: write)
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Auto-merge routine branches
        # Detecta branches `claude/news-routine-*` deixados pela routine remota
        # (cujo push em main e bloqueado pelo proxy da Anthropic Cloud).
        # Valida rigorosamente (committer.login whitelist + path media/news/),
        # abre PR, mescla, deleta branch, notifica Telegram. Falha aqui nao
        # derruba o publish (publish prossegue mesmo se auto-merge der erro).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish/auto-merge-routine.mjs || true

      - name: Pull rebased main (auto-merge pode ter avancado)
        # Se o rebase falhar, aborta pra não deixar o repo no meio de um rebase (run-publish
        # reconcilia a fila sozinho no commit dele).
        run: git pull --rebase --autostash || { git rebase --abort 2>/dev/null; echo "::warning::pull falhou, seguindo na main local"; }

      - name: Smoke test (valida token/escopo, nao publica)
        if: ${{ inputs.mode == 'smoke' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish/smoke-test.mjs

      - name: Run publish
        if: ${{ inputs.mode != 'smoke' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Facebook Pages: LIGADO por padrao (todo post sai no FB junto do IG).
          # skip_fb=true num disparo manual publica so no Instagram nesta run.
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PUBLISH_FB: ${{ inputs.skip_fb && '0' || '1' }}
          GIT_AUTHOR_NAME: pj-news-bot
          GIT_AUTHOR_EMAIL: bot@setlists-pj.local
          MAX_BATCHES: ${{ inputs.max-batches || '2' }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          case "$MAX_BATCHES" in ''|*[!0-9]*) echo "max-batches inválido: $MAX_BATCHES"; exit 1;; esac
          ARGS="--max-batches=$MAX_BATCHES"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/publish/run-publish.mjs $ARGS
