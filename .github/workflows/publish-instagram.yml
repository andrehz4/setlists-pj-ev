name: Publish Instagram
on:
  schedule:
    # Roda apenas dentro das 4 janelas ativas (routine + story), a cada 20min.
    # Cada janela cobre ~1h40 = 5 runs, garantindo que o publish nao perde
    # nenhum item que a routine ou o community-fetch jogou na fila.
    #
    # Janela A: routine 06:30 BRT (09:30 UTC) — noticias manha
    # Runs: 09:10, 09:30, 09:50, 10:10, 10:30 UTC = 06:10-07:30 BRT
    - cron: '10,30,50 9 * * *'
    - cron: '10,30 10 * * *'
    # Janela B: community digest (12:25 UTC) + routine 09:30 BRT (12:30 UTC)
    # Runs: 12:10, 12:30, 12:50, 13:10, 13:30 UTC = 09:10-10:30 BRT
    - cron: '10,30,50 12 * * *'
    - cron: '10,30 13 * * *'
    # Janela C: story diario (16:00 UTC = 13:00 BRT)
    # Runs: 16:00, 16:20, 16:40, 17:00, 17:20 UTC = 13:00-14:20 BRT
    - cron: '0,20,40 16 * * *'
    - cron: '0,20 17 * * *'
    # Janela D: community spotlight (00:25 UTC) + routine 21:30 BRT (00:30 UTC)
    # Runs: 00:10, 00:30, 00:50, 01:10, 01:30 UTC = 21:10-22:30 BRT
    - cron: '10,30,50 0 * * *'
    - cron: '10,30 1 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Gera slides e simula publish mas nao chama IG API'
        type: boolean
        default: false
      max-batches:
        description: 'Maximo de batches (regular+spotlight) por run'
        type: string
        default: '2'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # token padrao do workflow ja basta pra push (permissions: contents: write)
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Auto-merge routine branches
        # Detecta branches `claude/news-routine-*` deixados pela routine remota
        # (cujo push em main e bloqueado pelo proxy da Anthropic Cloud).
        # Valida rigorosamente (committer.login whitelist + path media/news/),
        # abre PR, mescla, deleta branch, notifica Telegram. Falha aqui nao
        # derruba o publish (publish prossegue mesmo se auto-merge der erro).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish/auto-merge-routine.mjs || true

      - name: Pull rebased main (auto-merge pode ter avancado)
        run: git pull --rebase --autostash || true

      - name: Run publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_AUTHOR_NAME: pj-news-bot
          GIT_AUTHOR_EMAIL: bot@setlists-pj.local
        run: |
          ARGS="--max-batches=${{ inputs.max-batches || '2' }}"
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/publish/run-publish.mjs $ARGS
