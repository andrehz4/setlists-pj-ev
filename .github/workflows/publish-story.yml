name: Publish Instagram Story
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Gera MP4 mas nao chama IG API'
        type: boolean
        default: false
      force:
        description: 'Republica mesmo se ja postou hoje (ignora _story-log)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-story
  cancel-in-progress: false

jobs:
  publish-story:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run publish-story
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # voz na abertura e no final (scripts/publish/narracao/story.mjs): '1' liga
          STORY_NARRACAO: '1'
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # mídia no R2 (scripts/publish/midia-r2.mjs): vídeo sobe pro bucket smufdpj-midia (apaga em 3 dias)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_MIDIA_BUCKET: ${{ secrets.R2_MIDIA_BUCKET }}
          R2_MIDIA_PUBLIC_BASE: ${{ secrets.R2_MIDIA_PUBLIC_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Facebook Pages: story de video sai junto do story do IG.
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PUBLISH_FB: '1'
          GIT_AUTHOR_NAME: pj-news-bot
          GIT_AUTHOR_EMAIL: bot@setlists-pj.local
        run: |
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/publish/run-publish-story.mjs $ARGS
