name: News merge curated (from routine)

# Disparado pela Claude routine remota via API:
#   POST https://api.github.com/repos/andrehz4/setlists-pj-ev/dispatches
#   body: { event_type: "news-curated", client_payload: { curated: [...] } }
#
# Existe porque o ambiente da routine bloqueia git push (allowlist de rede
# permite api.github.com mas nao receive-pack). Esse workflow recebe o JSON
# curado via payload, roda merge-curated.mjs e empurra com GITHUB_TOKEN nativo.

on:
  repository_dispatch:
    types: [news-curated]

permissions:
  contents: write

concurrency:
  group: news-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Escreve curated.json a partir do payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload.curated) }}
        run: |
          echo "$PAYLOAD" > /tmp/curated.json
          if ! jq -e 'type == "array"' /tmp/curated.json >/dev/null; then
            echo "ERRO: client_payload.curated nao e um array JSON"
            cat /tmp/curated.json | head -c 500
            exit 1
          fi
          echo "Items no payload: $(jq 'length' /tmp/curated.json)"

      - name: Archive payload bruto antes do merge
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          ARCHIVE_DIR=media/news/_routine-archive
          ARCHIVE_FILE="$ARCHIVE_DIR/${STAMP}.json"
          mkdir -p "$ARCHIVE_DIR"
          cp /tmp/curated.json "$ARCHIVE_FILE"
          echo "## Archive bruto" >> $GITHUB_STEP_SUMMARY
          echo "- arquivo: \`$ARCHIVE_FILE\`" >> $GITHUB_STEP_SUMMARY
          # gist_url do payload NAO vai pro Step Summary (publico no repo publico);
          # se precisar do gist como fallback, ler do response do worker no painel da routine.
          # commit do archive antes do merge, pra preservar mesmo se merge-curated.mjs falhar
          git config user.name "pj-news-bot"
          git config user.email "bot@setlists-pj.local"
          git add "$ARCHIVE_FILE"
          git commit -m "news: archive bruto do payload da routine ${STAMP}"
          for i in 1 2 3; do
            git pull origin main --rebase --autostash || true
            if git push origin main 2>&1; then break; fi
            echo "push tentativa $i falhou, retry..."
            sleep 2
          done

      - name: Merge curated
        run: node scripts/news/merge-curated.mjs --file /tmp/curated.json

      - name: Commit & push
        run: |
          git config user.name "pj-news-bot"
          git config user.email "bot@setlists-pj.local"
          git add media/news/
          if git diff --cached --quiet; then
            echo "Sem mudancas no media/news/, nao vou commitar."
          else
            N=$(jq '.items | length' media/news/index.json)
            COMMIT_MSG="news: curadoria automatica via routine sonnet (repository_dispatch, $N itens) $(date -u +%Y-%m-%dT%H:%MZ)"
            git commit -m "$COMMIT_MSG"
            for i in 1 2 3; do
              git pull origin main --rebase --autostash || true
              if git push origin main 2>&1; then break; fi
              echo "push tentativa $i falhou, retry..."
              sleep 2
            done
          fi

      - name: Notifica Telegram (preview do que vai pro feed)
        # Step pos-merge. Avisa Andre 17min antes do proximo cron de
        # publish-instagram.yml (que roda :17/:47). Falha aqui NAO derruba
        # o workflow porque notificacao e nice-to-have.
        if: success() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          # estima horario do proximo cron de publish em BRT
          NOW_UTC=$(date -u +%s)
          MIN_UTC=$(date -u +%M)
          # proximo :17 ou :47 UTC
          if [ "$MIN_UTC" -lt 17 ]; then NEXT_MIN=17
          elif [ "$MIN_UTC" -lt 47 ]; then NEXT_MIN=47
          else NEXT_MIN=17; fi
          NEXT_HOUR_BRT=$(TZ=America/Sao_Paulo date -d "now $([ "$NEXT_MIN" = 17 ] && [ "$MIN_UTC" -ge 47 ] && echo '+1 hour')" +%H)
          NEXT_AT_BRT="${NEXT_HOUR_BRT}:${NEXT_MIN}"

          # monta mensagem HTML a partir do payload curado
          MSG=$(jq -r --arg next "$NEXT_AT_BRT" '
            . as $arr |
            "<b>📰 SMUFDPJ • " + (length | tostring) + " " + (if length == 1 then "noticia" else "noticias" end) + " curadas</b>\n" +
            "Vao pro feed @smufdpj as <b>" + $next + " BRT</b>\n\n" +
            (
              [ . | to_entries[] |
                ((.key + 1) | tostring) + ". " +
                "<b>" + (.value.titulo_pt | gsub("<"; "&lt;") | gsub(">"; "&gt;") | gsub("&"; "&amp;")) + "</b>\n" +
                "   <code>" + .value.id + "</code>" +
                (if (.value.tags // []) | length > 0 then "  •  " + (.value.tags | join(" ")) else "" end) + "\n" +
                "   ↳ https://setlists-pj-ev.pages.dev/n/" + .value.id
              ] | join("\n\n")
            ) +
            "\n\nPra cancelar algum, edita _publish-queue.json e seta postedAt=\"skipped\""
          ' /tmp/curated.json)

          # trunca em 3900 chars pra ficar abaixo do limite IG de 4096
          if [ "${#MSG}" -gt 3900 ]; then
            MSG="${MSG:0:3900}...\n\n(truncado, total: ${#MSG} chars)"
          fi

          HTTP_CODE=$(curl -s -o /tmp/tg-resp.json -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "[telegram] OK: notificacao enviada"
          else
            echo "[telegram] FALHA HTTP $HTTP_CODE:"
            cat /tmp/tg-resp.json
          fi
          # nunca derruba workflow por causa da notif
          exit 0
