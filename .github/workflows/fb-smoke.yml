name: FB smoke test
# Teste controlado da publicacao no Facebook Pages: valida o Page Token e posta
# UM album de teste na Pagina (3 fotos estaveis do repo), pra conferir permissoes
# e o visual do album antes de ligar o feed em producao. NAO toca no Instagram
# nem na fila de publicacao. So dispara manualmente.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'O que postar de teste'
        type: choice
        options: [feed, story, reel]
        default: feed
      delete_post_id:
        description: 'Se preenchido, APAGA esse post de teste em vez de publicar um novo'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  fb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: FB smoke
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DELETE_POST_ID: ${{ inputs.delete_post_id }}
          MODO: ${{ inputs.mode || 'feed' }}
        run: |
          if [ -n "$DELETE_POST_ID" ]; then
            node scripts/publish/fb-smoke.mjs --delete "$DELETE_POST_ID"
          else
            node scripts/publish/fb-smoke.mjs "--$MODO"
          fi
