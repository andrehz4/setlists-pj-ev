name: FB smoke test
# Teste controlado da publicacao no Facebook Pages: valida o Page Token e posta
# UM album de teste na Pagina (3 fotos estaveis do repo), pra conferir permissoes
# e o visual do album antes de ligar o feed em producao. NAO toca no Instagram
# nem na fila de publicacao. So dispara manualmente.
on:
  workflow_dispatch:
    inputs:
      delete_post_id:
        description: 'Se preenchido, APAGA esse post de teste em vez de publicar um novo'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  fb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: FB smoke
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ -n "${{ inputs.delete_post_id }}" ]; then
            node scripts/publish/fb-smoke.mjs --delete "${{ inputs.delete_post_id }}"
          else
            node scripts/publish/fb-smoke.mjs
          fi
