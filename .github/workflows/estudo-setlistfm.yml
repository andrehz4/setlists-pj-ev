name: Estudo setlist.fm (carreira)
# Manual. Baixa todos os setlists do Eddie Vedder solo e do Pearl Jam (secret SETLISTFM_API_KEY) e guarda como
# artifact "setlists-bruto". No Mac: gh run download <id> -n setlists-bruto -D reels-especiais/eddie-carreira/bruto
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Coletar
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: node reels-especiais/eddie-carreira/coletar.mjs bruto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: setlists-bruto
          path: bruto/
          retention-days: 14
