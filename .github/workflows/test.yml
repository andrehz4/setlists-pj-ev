# Gate de testes: roda a suite (node --test) em todo push/PR que toque
# codigo do pipeline. Nao bloqueia os crons (workflows separados); serve
# pra pegar regressao antes que um cron rode com codigo quebrado.
name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "mock-ig/**"
      - "colab/**"
      - "functions/**"
      - "index.html"
      - "media/*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "mock-ig/**"
      - "colab/**"
      - "functions/**"
      - "index.html"
      - "media/*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run suite
        run: npm test
