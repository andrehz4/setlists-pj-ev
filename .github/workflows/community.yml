name: Community fetch
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo do pipeline (digest=24h reddit, spotlight=fan art semana, both=ambos)'
        type: choice
        options: [digest, spotlight, both]
        default: both
      curator:
        description: 'Backend de curadoria (default routine. Override pra gemini)'
        type: choice
        options: [routine, gemini]
        default: routine
      dry-run:
        description: 'Dry run (nao escreve, nao commita)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: community-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Determine mode
        id: mode
        run: |
          echo "mode=${{ inputs.mode || 'both' }}" >> $GITHUB_OUTPUT

      - name: Fetch community
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # REDDIT_PROXY_URL removido: proxy retornava 400, reddit.com direto funciona
          NEWS_CURATOR: ${{ inputs.curator || 'routine' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--mode=${{ steps.mode.outputs.mode }} --curator=$NEWS_CURATOR"
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/news/community-fetch.mjs $ARGS

      - name: Commit & push
        if: ${{ inputs.dry-run != true }}
        run: |
          git config user.name "pj-news-bot"
          git config user.email "bot@setlists-pj.local"
          git add media/news/
          if git diff --cached --quiet; then
            echo "Sem mudancas, nao vou commitar."
          else
            MODE="${{ steps.mode.outputs.mode }}"
            CURATOR="${{ inputs.curator || 'routine' }}"
            if [ "$CURATOR" = "routine" ]; then
              COMMIT_MSG="community: $MODE pendente pra routine sonnet $(date -u +%Y-%m-%dT%H:%MZ)"
            else
              COMMIT_MSG="community: $MODE ($CURATOR) $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git commit -m "$COMMIT_MSG"
            pushed=""
            for i in 1 2 3; do
              if ! git pull origin main --rebase --autostash; then
                git rebase --abort 2>/dev/null || true
                echo "rebase falhou (tentativa $i), abortado; retry..."
                sleep 2
                continue
              fi
              if git push origin main 2>&1; then pushed=1; break; fi
              echo "push tentativa $i falhou, retry..."
              sleep 2
            done
            if [ -z "$pushed" ]; then
              echo "::error::push falhou apos 3 tentativas, commit local perdido"
              exit 1
            fi
          fi