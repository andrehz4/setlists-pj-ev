name: Community fetch
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo do pipeline (digest=24h reddit, spotlight=fan art semana, both=ambos)'
        type: choice
        options: [digest, spotlight, both]
        default: both
      curator:
        description: 'Backend de curadoria (default routine. Override pra gemini)'
        type: choice
        options: [routine, gemini]
        default: routine
      dry-run:
        description: 'Dry run (nao escreve, nao commita)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: community-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Determine mode
        id: mode
        run: |
          echo "mode=${{ inputs.mode || 'both' }}" >> $GITHUB_OUTPUT

      - name: Diagnostico Reddit proxy
        env:
          REDDIT_PROXY_URL: ${{ secrets.REDDIT_PROXY_URL }}
        run: |
          echo "=== Diagnostico Reddit RSS ==="
          if [ -z "$REDDIT_PROXY_URL" ]; then
            echo "[diag] REDDIT_PROXY_URL nao configurado, vai usar reddit.com direto"
            BASE_URL="https://www.reddit.com"
          else
            echo "[diag] REDDIT_PROXY_URL configurado"
            BASE_URL="$REDDIT_PROXY_URL"
          fi

          TEST_URL="${BASE_URL}/r/pearljam/top.rss?t=day&limit=5"
          echo "[diag] Testando URL do proxy (valor mascarado pelo GitHub)..."
          HTTP_STATUS=$(curl -s -o /tmp/reddit_resp.txt -w "%{http_code}" \
            -H "User-Agent: setlists-pj-news-bot/1.0 (+https://setlists-pj-ev.pages.dev)" \
            -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            --max-time 15 \
            "$TEST_URL" || echo "CURL_FAIL")
          echo "[diag] HTTP status via proxy: $HTTP_STATUS"
          echo "[diag] Primeiros 400 bytes da resposta:"
          head -c 400 /tmp/reddit_resp.txt || echo "(sem resposta)"
          echo ""

          echo "[diag] Testando reddit.com diretamente (sem proxy)..."
          HTTP_DIRECT=$(curl -s -o /tmp/reddit_direct.txt -w "%{http_code}" \
            -H "User-Agent: setlists-pj-news-bot/1.0 (+https://setlists-pj-ev.pages.dev)" \
            -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            --max-time 15 \
            "https://www.reddit.com/r/pearljam/top.rss?t=day&limit=5" || echo "CURL_FAIL")
          echo "[diag] HTTP status direto: $HTTP_DIRECT"
          echo "[diag] Primeiros 400 bytes (direto):"
          head -c 400 /tmp/reddit_direct.txt || echo "(sem resposta)"
          echo ""
          echo "=== Fim diagnostico ==="

      - name: Fetch community
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          REDDIT_PROXY_URL: ${{ secrets.REDDIT_PROXY_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          NEWS_CURATOR: ${{ inputs.curator || 'routine' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--mode=${{ steps.mode.outputs.mode }} --curator=$NEWS_CURATOR"
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/news/community-fetch.mjs $ARGS

      - name: Commit & push
        if: ${{ inputs.dry-run != true }}
        run: |
          git config user.name "pj-news-bot"
          git config user.email "bot@setlists-pj.local"
          git add media/news/
          if git diff --cached --quiet; then
            echo "Sem mudancas, nao vou commitar."
          else
            MODE="${{ steps.mode.outputs.mode }}"
            CURATOR="${{ inputs.curator || 'routine' }}"
            if [ "$CURATOR" = "routine" ]; then
              COMMIT_MSG="community: $MODE pendente pra routine sonnet $(date -u +%Y-%m-%dT%H:%MZ)"
            else
              COMMIT_MSG="community: $MODE ($CURATOR) $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git commit -m "$COMMIT_MSG"
            for i in 1 2 3; do
              git pull origin main --rebase --autostash || true
              if git push origin main 2>&1; then break; fi
              echo "push tentativa $i falhou, retry..."
              sleep 2
            done
          fi