name: Community fetch
on:
  schedule:
    # Digest: 12:25 UTC = 09:25 BRT (1h antes da routine das 12:00 BRT)
    - cron: '25 12 * * *'
    # Spotlight: 00:25 UTC = 21:25 BRT (1h antes da routine das 00:00 BRT)
    - cron: '25 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo do pipeline (digest=24h reddit, spotlight=fan art semana, both=ambos)'
        type: choice
        options: [digest, spotlight, both]
        default: both
      curator:
        description: 'Backend de curadoria (default routine. Override pra gemini)'
        type: choice
        options: [routine, gemini]
        default: routine
      dry-run:
        description: 'Dry run (nao escreve, nao commita)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: community-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Cron 12:25 UTC -> digest; cron 00:25 UTC -> spotlight
            if [ "${{ github.event.schedule }}" = "25 12 * * *" ]; then
              echo "mode=digest" >> $GITHUB_OUTPUT
            else
              echo "mode=spotlight" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=${{ inputs.mode || 'both' }}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch community
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          REDDIT_PROXY_URL: ${{ secrets.REDDIT_PROXY_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Default no cron: routine (so coleta + escreve _pending.json).
          # Routine Sonnet remota acorda em :30 e cura. Manual via dispatch
          # pode trocar pra gemini pra curar na hora.
          NEWS_CURATOR: ${{ inputs.curator || 'routine' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--mode=${{ steps.mode.outputs.mode }} --curator=$NEWS_CURATOR"
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/news/community-fetch.mjs $ARGS

      - name: Commit & push
        if: ${{ inputs.dry-run != true }}
        run: |
          git config user.name "pj-news-bot"
          git config user.email "bot@setlists-pj.local"
          git add media/news/
          if git diff --cached --quiet; then
            echo "Sem mudancas, nao vou commitar."
          else
            MODE="${{ steps.mode.outputs.mode }}"
            CURATOR="${{ inputs.curator || 'routine' }}"
            if [ "$CURATOR" = "routine" ]; then
              COMMIT_MSG="community: $MODE pendente pra routine sonnet $(date -u +%Y-%m-%dT%H:%MZ)"
            else
              COMMIT_MSG="community: $MODE ($CURATOR) $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git commit -m "$COMMIT_MSG"
            # Pull --rebase pra evitar race condition se news.yml ou
            # a routine pushou no meio. Loop simples de retry (max 3x).
            for i in 1 2 3; do
              git pull origin main --rebase --autostash || true
              if git push origin main 2>&1; then break; fi
              echo "push tentativa $i falhou, retry..."
              sleep 2
            done
          fi
