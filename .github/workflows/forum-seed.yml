# Seeder semanal do forum: 1 topico de discussao com a pauta da semana,
# postado pelo usuario-bot (endpoint /forum/bot/topics, guardado por
# FORUM_BOT_KEY). Sem o secret cadastrado, o script faz skip gracioso.
name: Forum seed semanal

on:
  workflow_dispatch:
  schedule:
    - cron: "7 15 * * 5" # sexta 12:07 BRT (fora do :00)

permissions:
  contents: write

concurrency:
  group: forum-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Postar topico da semana
        env:
          FORUM_BOT_KEY: ${{ secrets.FORUM_BOT_KEY }}
        run: node scripts/news/forum-seed.mjs

      - name: Commit do stamp (idempotencia semanal)
        run: |
          git config user.name "pj-news-bot"
          git config user.email "bot@setlists-pj.local"
          # O seed faz skip gracioso (sem FORUM_BOT_KEY ou sem noticia na janela)
          # e NAO gera o stamp. Sem esta guarda, `git add <arquivo inexistente>`
          # aborta o step com exit 128 (shell roda com -e), deixando a run
          # vermelha toda sexta mesmo quando o skip foi o comportamento correto.
          if [ ! -f media/news/_forum-seed-stamp.json ]; then
            echo "Sem stamp (seed fez skip), nada a commitar"
            exit 0
          fi
          git add media/news/_forum-seed-stamp.json
          if git diff --cached --quiet; then
            echo "Sem stamp novo, nada a commitar"
          else
            git commit -m "forum-seed: topico da semana postado $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=""
            for i in 1 2 3; do
              if ! git pull origin main --rebase --autostash; then
                git rebase --abort 2>/dev/null || true
                sleep 2
                continue
              fi
              if git push origin main 2>&1; then pushed=1; break; fi
              sleep 2
            done
            if [ -z "$pushed" ]; then
              echo "::error::push do stamp do forum-seed falhou apos 3 tentativas"
              exit 1
            fi
          fi
