name: Publish Reel Especial
# Publica um reel especial pronto (reels-especiais/<pasta>/publicar.json, vídeo já no R2).
# Sem cron: quem dispara no horário é o TriggerAll (workflow_dispatch com a pasta).
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: 'Pasta em reels-especiais/ (ex: eddie-ibirapuera)'
        type: string
        required: true
      dry-run:
        description: 'Só confere o publicar.json, não chama o IG'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-reel-especial
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PUBLISH_FB: '1'
          GIT_AUTHOR_NAME: pj-news-bot
          GIT_AUTHOR_EMAIL: bot@setlists-pj.local
          PASTA: ${{ inputs.pasta }}
        run: |
          case "$PASTA" in *[!a-z0-9-]*|"") echo "pasta inválida"; exit 1;; esac
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="--dry-run"; fi
          node scripts/publish/reel/especial.mjs "$PASTA" $ARGS
