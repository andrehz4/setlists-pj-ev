# Story do dia por estado ("Alô, pessoal do RJ!") avisando os shows de hoje das bandas cover.
# Script scripts/agenda/redes/story-do-dia.mjs, ou o story em VÍDEO por banda (story-por-banda.mjs) quando a variável do
# repo AGENDA_STORY_VIDEO=1. Só publica de verdade com a variável do repo AGENDA_PUBLICAR=1;
# sem ela, gera a arte e mostra no log o que sairia (e não marca ninguém).
name: agenda-story
on:
  schedule:
    - cron: "37 13 * * *" # reserva: o GitHub chega a atrasar 6 h. Gatilho principal: TriggerAll 10:37 BRT (idempotente)
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Só gerar a arte (não publica)"
        type: boolean
        default: false
      video:
        description: "Testar o story em vídeo por banda (com dry-run, renderiza e não publica)"
        type: boolean
        default: false
      dia:
        description: "Dia (AAAA-MM-DD) pra testar; vazio = hoje"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: agenda
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Dependências
        run: npm ci --no-audit --no-fund
      - name: ffmpeg (story em vídeo)
        if: ${{ vars.AGENDA_STORY_VIDEO == '1' || inputs.video }}
        uses: ./.github/actions/ffmpeg
      - name: Publicar
        env:
          AGENDA_PUBLICAR: ${{ vars.AGENDA_PUBLICAR }}
          AGENDA_STORY_VIDEO: ${{ inputs.video && '1' || vars.AGENDA_STORY_VIDEO }}
          AGENDA_DIA: ${{ inputs.dia }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_MIDIA_BUCKET: ${{ secrets.R2_MIDIA_BUCKET }}
          R2_MIDIA_PUBLIC_BASE: ${{ secrets.R2_MIDIA_PUBLIC_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_AUTHOR_NAME: pj-news-bot
          GIT_AUTHOR_EMAIL: bot@setlists-pj.local
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          S=story-do-dia; [ "$AGENDA_STORY_VIDEO" = "1" ] && S=story-por-banda
          if [ "$DRY_RUN" = "true" ]; then node scripts/agenda/redes/$S.mjs --dry-run; else node scripts/agenda/redes/$S.mjs; fi
      - name: Guardar vídeos de teste
        if: ${{ inputs.video && inputs.dry-run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stories-teste
          path: media/agenda/_teste-*.mp4
          retention-days: 3
