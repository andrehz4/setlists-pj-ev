# Grava as falas fixas do story por banda (scripts/agenda/redes/gravar-voz.mjs). Manual: rodar quando entrar banda
# nova ou mudar frase. Só grava o que falta, então o crédito do ElevenLabs é gasto uma vez por fala.
name: agenda-voz
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Só listar o que falta (não grava)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: agenda
  cancel-in-progress: false
jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Gravar falas
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY_AGENDA }} # conta só da agenda (a do reel fica separada)
          GIT_AUTHOR_NAME: pj-news-bot
          GIT_AUTHOR_EMAIL: bot@setlists-pj.local
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then node scripts/agenda/redes/gravar-voz.mjs --dry-run; else node scripts/agenda/redes/gravar-voz.mjs; fi
