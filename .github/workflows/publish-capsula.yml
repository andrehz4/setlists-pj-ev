name: Publish Capsula
# Publica UMA cápsula do YouTube por dia às 20h BRT (23:00 UTC). O orquestrador
# pega a próxima da fila (_capsula-queue.json), gera o carrossel, publica no
# Instagram + Facebook e adiciona ao site. NÃO usa yt-dlp (a extração das
# legendas é feita local; aqui só publica slides já prontos das matérias).
on:
  schedule:
    - cron: '0 23 * * *'   # 20h BRT
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Gera os slides mas não publica'
        type: boolean
        default: false
      force:
        description: 'Publica a próxima da fila ignorando a agenda (pra testar)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-capsula
  cancel-in-progress: false

jobs:
  publish-capsula:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 5
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run publish-capsula
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PUBLISH_FB: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_AUTHOR_NAME: pj-news-bot
          GIT_AUTHOR_EMAIL: bot@setlists-pj.local
        run: |
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/publish/run-publish-capsula.mjs $ARGS
