name: News fetch
on:
  schedule:
    # 4x/dia, 5min antes dos marcos da routine (00:00, 06:00, 12:00, 18:00 BRT).
    # 23:55, 05:55, 11:55, 17:55 BRT = 02:55, 08:55, 14:55, 20:55 UTC.
    # 5min de folga pra scrape commitar antes da routine acordar.
    - cron: '55 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      curator:
        description: 'Backend de curadoria (default no cron: routine. Override pra gemini/anthropic)'
        type: choice
        options: [routine, gemini, anthropic]
        default: routine
      dry-run:
        description: 'Dry run (nao escreve, nao commita)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Fetch news
        env:
          # Define ambas as keys; o curator nao usado simplesmente nao chama.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_PROXY_URL: ${{ secrets.REDDIT_PROXY_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Default no cron: routine (so coleta + escreve _pending.json).
          # Routine Sonnet remota acorda em :30 e cura. Manual via dispatch
          # pode trocar pra gemini ou anthropic.
          NEWS_CURATOR: ${{ inputs.curator || 'routine' }}
          # Modelo Gemini: trocavel via repo variable GEMINI_MODEL.
          # Opcoes: gemini-2.5-flash (default), gemini-2.5-flash-lite, gemini-2.5-pro,
          # gemini-3-flash-preview, gemini-3.1-pro-preview. Tabela: ai.google.dev/pricing
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/news/fetch-news.mjs $ARGS

      - name: Commit & push
        if: ${{ inputs.dry-run != true }}
        run: |
          git config user.name "pj-news-bot"
          git config user.email "bot@setlists-pj.local"
          git add media/news/
          if git diff --cached --quiet; then
            echo "Sem mudancas, nao vou commitar."
          else
            CURATOR_LABEL="${{ inputs.curator || 'routine' }}"
            if [ "$CURATOR_LABEL" = "routine" ]; then
              COMMIT_MSG="news: coleta automatica em _pending.json (routine sonnet ira curar) $(date -u +%Y-%m-%dT%H:%MZ)"
            else
              COMMIT_MSG="news: atualizacao automatica ($CURATOR_LABEL) $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git commit -m "$COMMIT_MSG"
            # Pull --rebase pra evitar race condition se community.yml ou
            # a routine pushou no meio. Loop simples de retry (max 3x).
            for i in 1 2 3; do
              git pull origin main --rebase --autostash || true
              if git push origin main 2>&1; then break; fi
              echo "push tentativa $i falhou, retry..."
              sleep 2
            done
          fi

      - name: Notifica Telegram (scrape, resumo agregado)
        # Roda apos commit do scrape. Manda mensagem CURTA: total +
        # contagem por sourceLabel. Detalhe item-a-item fica no news-merge.yml
        # depois da curadoria. Falha aqui nao derruba o workflow.
        if: ${{ inputs.dry-run != true && env.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          if [ ! -f media/news/_pending.json ]; then
            echo "[telegram] sem _pending.json, skip"
            exit 0
          fi

          BRT_NOW=$(TZ=America/Sao_Paulo date +"%H:%M")
          TOTAL=$(jq '.items | length' media/news/_pending.json)

          if [ "$TOTAL" = "0" ] || [ -z "$TOTAL" ]; then
            echo "[telegram] _pending vazio, skip"
            exit 0
          fi

          # contagem por sourceLabel
          BY_SOURCE=$(jq -r '
            .items
            | group_by(.sourceLabel // .kind // "outros")
            | map({src: (.[0].sourceLabel // .[0].kind // "outros"), n: length})
            | sort_by(-.n)
            | map("  • " + .src + ": " + (.n | tostring))
            | join("\n")
          ' media/news/_pending.json)

          # lista titulo + fonte de cada candidato (max 20 pra nao estourar
          # 4096 chars do Telegram). Titulo trunca em 80 chars.
          ITEMS_LIST=$(jq -r '
            .items[:20] | to_entries | map(
              "\((.key + 1)). " +
              (.value.title_orig // .value.title // .value.post_title_orig // "?" | .[0:80]) +
              " · " +
              (.value.sourceLabel // .value.kind // "outros")
            ) | join("\n")
          ' media/news/_pending.json)

          OVERFLOW=""
          if [ "$TOTAL" -gt 20 ]; then OVERFLOW=$(printf '\n\n(+%s candidatos nao listados)' "$((TOTAL - 20))"); fi

          MSG=$(printf '🛰️ <b>Scrape de noticias, %s BRT</b>\n\n<b>%s candidatos novos coletados</b>\n\n<b>Por fonte:</b>\n%s\n\n<b>Manchetes:</b>\n%s%s\n\nA curadoria roda em ~5min e seleciona quais vao pro feed @smufdpj. Aviso aqui o que sobreviver.' "$BRT_NOW" "$TOTAL" "$BY_SOURCE" "$ITEMS_LIST" "$OVERFLOW")

          HTTP_CODE=$(curl -s -o /tmp/tg-resp.json -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "[telegram] OK scrape notif: total=$TOTAL"
          else
            echo "[telegram] FALHA HTTP $HTTP_CODE:"
            cat /tmp/tg-resp.json
          fi
          exit 0
