name: News fetch
on:
  schedule:
    # A cada 6h, offset 23min pra fugir de pico de cron do GitHub
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      curator:
        description: 'Backend de curadoria'
        type: choice
        options: [gemini, anthropic, routine]
        default: gemini
      dry-run:
        description: 'Dry run (nao escreve, nao commita)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Fetch news
        env:
          # Define ambas as keys; o curator nao usado simplesmente nao chama.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_PROXY_URL: ${{ secrets.REDDIT_PROXY_URL }}
          NEWS_CURATOR: ${{ inputs.curator || 'gemini' }}
          # Modelo Gemini: trocavel via repo variable GEMINI_MODEL.
          # Opcoes: gemini-2.5-flash (default), gemini-2.5-flash-lite, gemini-2.5-pro,
          # gemini-3-flash-preview, gemini-3.1-pro-preview. Tabela: ai.google.dev/pricing
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/news/fetch-news.mjs $ARGS

      - name: Commit & push
        if: ${{ inputs.dry-run != true }}
        run: |
          git config user.name "pj-news-bot"
          git config user.email "bot@setlists-pj.local"
          git add media/news/
          if git diff --cached --quiet; then
            echo "Sem mudancas, nao vou commitar."
          else
            CURATOR_LABEL="${{ inputs.curator || 'gemini' }}"
            git commit -m "news: atualizacao automatica ($CURATOR_LABEL) $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
